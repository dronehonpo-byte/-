{% extends "base.html" %}
{% block title %}新規リスト{% endblock %}
{% block content %}
<h1>新規メルマガリスト</h1>
<div class="card" style="max-width:560px">
  <form method="post">
    <div class="field"><label>リスト名</label><input type="text" name="name" required></div>
    <div class="field"><label>差出人名 (任意)</label><input type="text" name="from_name" placeholder="株式会社サンプル"></div>
    <div class="field"><label>差出人メール (任意)</label><input type="email" name="from_email" placeholder="news@example.com"></div>
    <div class="field"><label><input type="checkbox" name="confirm_required"> ダブルオプトイン (確認メールを送る)</label></div>
    <button class="btn" type="submit">作成</button>
    <a class="muted" href="{{ url_for('newsletter.index') }}" style="margin-left:12px">キャンセル</a>
  </form>
</div>
{% endblock %}
