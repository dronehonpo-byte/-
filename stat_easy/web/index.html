           st.error(str(e))\n\nst.divider()\n\n# ---- 読み込み結果の表示 ----\ndf = common.get_data()\nif df is not None:\n    source = st.session_state.get(\"source_name\", \"\")\n    column_types = st.session_state.get(\"column_types\", {})\n    encoding = st.session_state.get(\"_last_encoding\")\n    warnings = st.session_state.get(\"_last_warnings\", [])\n\n    st.success(\n        f\"『{source}』を読み込みました（{df.shape[0]} 行 × {df.shape[1]} 列）。\"\n    )\n    if encoding:\n        st.caption(f\"検出された文字コード：{encoding}\")\n\n    for w in warnings:\n        st.warning(w)\n\n    # 大規模データ（10万行超）の警告とサンプリング提案\n    if df.shape[0] > 100_000:\n        st.warning(\n            f\"⚠️ データが大規模です（{df.shape[0]:,} 行）。\"\n            \"分析によってはメモリ不足や処理時間の増大が起こる可能性があります。\"\n            \"機械学習・クラスタリングは自動でサブサンプリングされますが、\"\n            \"必要に応じて事前に行数を絞ることをおすすめします。\"\n        )\n\n    st.subheader(\"データプレビュー（先頭 50 行）\")\n    st.dataframe(df.head(50), use_container_width=True)\n\n    st.subheader(\"検出された列の型\")\n    type_rows = [\n        {\"列名\": col, \"型\": column_types.get(col, \"—\")} for col in df.columns\n    ]\n    st.dataframe(pd.DataFrame(type_rows), use_container_width=True, hide_index=True)\n\n    st.divider()\n    st.page_link(\n        \"pages/02_quality.py\",\n        label=\"次へ：データ品質診断で欠損・外れ値を確認する\",\n        icon=\"🔍\",\n    )\nelse:\n    st.info(\"ファイルをアップロードするか、サンプルデータを選択してください。\")\n\ncommon.render_footer()\n", "pages/02_quality.py": "\"\"\"② データ品質診断ページ。\n\n読み込み済みデータに対し、欠損値・外れ値・重複行などの品質を自動診断する。\n\"\"\"\nfrom __future__ import annotations\n\nimport streamlit as st\n\nfrom modules import common, data_loader, data_quality, descriptive_stats, visualizer\n\ndf = common.require_data()\n\nst.title(\"🔍 データ品質診断\")\nst.markdown(\n    \"読み込んだデータの品質を自動で点検します。\"\n    \"欠損値・外れ値候補・重複行をチェックし、解析前に注意すべき点を確認しましょう。\"\n)\n\n# ---- サイドバー：診断パラメータ ----\nst.sidebar.header(\"診断設定\")\niqr_k = st.sidebar.slider(\n    \"IQR係数\",\n    min_value=0.5,\n    max_value=3.0,\n    value=1.5,\n    step=0.1,\n    help=\"四分位範囲（IQR）の何倍を外れ値の境界とするか。一般的には1.5。\",\n)\nz_thresh = st.sidebar.slider(\n    \"Zスコア閾値\",\n    min_value=1.0,\n    max_value=5.0,\n    value=3.0,\n    step=0.1,\n    help=\"標準化得点（Zスコア）の絶対値がこの値を超える点を外れ値候補とする。一般的には3.0。\",\n)\n\ncolumn_types = st.session_state.get(\"column_types\")\n\n# ---- 診断実行 ----\ntry:\n    report = data_quality.diagnose(\n        df, column_types=column_types, iqr_k=iqr_k, z_thresh=z_thresh\n    )\nexcept Exception as e:  # noqa: BLE001\n    st.error(f\"品質診断中にエラーが発生しました: {e}\")\n    common.render_footer()\n    st.stop()\n\n# ---- データ形状サマリー ----\nst.subheader(\"データ概要\")\nc1, c2, c3 = st.columns(3)\nc1.metric(\"行数\", f\"{report.shape[0]:,}\")\nc2.metric(\"列数\", f\"{report.shape[1]:,}\")\nc3.metric(\"有効サンプルサイズ\", f\"{report.valid_n:,}\", help=\"欠損のない完全な行の数\")\n\n# ---- 欠損値レポート ----\nst.subheader(\"欠損値レポート\")\n\nmissing = report.missing.copy()\n\n_emoji = {\"ok\": \"🟢\", \"warn\": \"🟡\", \"bad\": \"🔴\"}\nmissing[\"状態\"] = missing[\"列名\"].map(\n    lambda c: _emoji.get(report.severity.get(c, \"ok\"), \"🟢\")\n)\n\n\ndef _row_color(row):\n    sev = report.severity.get(row[\"列名\"], \"ok\")\n    bg = {\"ok\": \"#e6f4ea\", \"warn\": \"#fff7e0\", \"bad\": \"#fde7e7\"}.get(sev, \"\")\n    return [f\"background-color: {bg}\"] * len(row)\n\n\ntry:\n    styled = missing.style.apply(_row_color, axis=1)\n    st.dataframe(styled, use_container_width=True)\nexcept Exception:  # noqa: BLE001 — スタイル適用失敗時は素のまま表示\n    st.dataframe(missing, use_container_width=True)\n\nst.caption(\"状態の凡例： 🟢 欠損率10%以下 ／ 🟡 10%超 ／ 🔴 50%超\")\n\n# 50%超の警告\nif report.high_missing_cols:\n    st.warning(\n        \"次の列は欠損率が50%を超えています： \"\n        + \"、\".join(map(str, report.high_missing_cols))\n        + \" 。これらの変数を解析に用いるべきか再検討してください。\"\n    )\n\n# ---- 欠損ヒント（最も欠損率の高い列について）----\nst.sidebar.markdown(\"---\")\nst.sidebar.subheader(\"欠損対処ヒント\")\nif len(missing) and missing[\"欠損率(%)\"].max() > 0:\n    idx = missing[\"欠損率(%)\"].idxmax()\n    top_col = missing.loc[idx, \"列名\"]\n    top_rate = float(missing.loc[idx, \"欠損率(%)\"])\n    st.sidebar.markdown(f\"**最大欠損列：** {top_col}（{top_rate:.1f}%）\")\n    st.sidebar.info(data_quality.missing_hint(top_rate))\nelse:\n    st.sidebar.success(\"欠損はありません。\")\n\n# ---- 欠損ヒートマップ ----\nst.subheader(\"欠損値ヒートマップ\")\ntry:\n    fig = visualizer.missing_heatmap(df)\n    st.pyplot(fig)\n    png_bytes = visualizer.fig_to_bytes(fig, fmt=\"png\")\n    svg_bytes = visualizer.fig_to_bytes(fig, fmt=\"svg\")\n    d1, d2 = st.columns(2)\n    d1.download_button(\n        \"PNG をダウンロード\",\n        data=png_bytes,\n        file_name=\"missing_heatmap.png\",\n        mime=\"image/png\",\n        key=\"dl_missing_png\",\n    )\n    d2.download_button(\n        \"SVG をダウンロード\",\n        data=svg_bytes,\n        file_name=\"missing_heatmap.svg\",\n        mime=\"image/svg+xml\",\n        key=\"dl_missing_svg\",\n    )\nexcept Exception as e:  # noqa: BLE001\n    st.error(f\"ヒートマップの作成に失敗しました: {e}\")\n\n# ---- 外れ値レポート ----\nst.subheader(\"外れ値候補レポート\")\nst.caption(\n    f\"IQR係数 = {iqr_k}、Zスコア閾値 = {z_thresh} に基づく数値列の外れ値候補件数です。\"\n)\nif len(report.outliers):\n    st.dataframe(report.outliers, use_container_width=True)\nelse:\n    st.info(\"数値列が無いため外れ値の判定は行えませんでした。\")\n\n# ---- 重複行 ----\nst.subheader(\"重複行\")\nst.metric(\"重複行数\", f\"{report.n_duplicates:,}\")\nif report.n_duplicates > 0:\n    st.write(\"重複している行（最初の出現を除く）：\")\n    st.dataframe(report.duplicate_rows, use_container_width=True)\nelse:\n    st.success(\"完全に重複した行はありません。\")\n\ncommon.render_footer()\n", "pages/03_descriptive.py": "\"\"\"③ 記述統計・Table 1 ページ。\n\n連続変数・カテゴリ変数の記述統計と、論文用 Table 1（APA 形式・三線表）を生成する。\n\"\"\"\nfrom __future__ import annotations\n\nimport streamlit as st\n\nfrom modules import common, data_loader, data_quality, descriptive_stats, visualizer\nfrom exporters import excel_exporter, word_exporter, pdf_exporter\n\ndf = common.require_data()\n\nst.title(\"📋 記述統計・Table 1\")\nst.markdown(\n    \"データの基本的な要約統計量を確認し、論文掲載用の Table 1 を自動生成します。\"\n)\n\n# ---- 記述統計（連続変数 / カテゴリ変数）----\ntab_num, tab_cat, tab_t1 = st.tabs([\"連続変数\", \"カテゴリ変数\", \"Table 1\"])\n\nnum_table = descriptive_stats.describe_numeric(df)\ncat_table = descriptive_stats.describe_categorical(df)\nt1 = None\n\nwith tab_num:\n    st.subheader(\"連続変数の記述統計\")\n    if len(num_table):\n        st.dataframe(num_table, use_container_width=True)\n    else:\n        st.info(\"数値型の変数が見つかりませんでした。\")\n\nwith tab_cat:\n    st.subheader(\"カテゴリ変数の記述統計\")\n    if len(cat_table):\n        st.dataframe(cat_table, use_container_width=True)\n    else:\n        st.info(\"カテゴリ型の変数が見つかりませんでした。\")\n\n# ---- Table 1 ----\nwith tab_t1:\n    st.subheader(\"Table 1（APA 形式）\")\n    st.markdown(\n        \"**APA形式（三線表）について：** \"\n        \"上辺・見出し下・下辺の3本の横罫線だけで構成する表で、縦罫線は引きません。\"\n        \"連続変数は「平均 ± SD」、カテゴリ変数は「n (%)」で要約します。\"\n        \"群分け変数を指定すると、群ごとの集計が並びます。\"\n    )\n\n    no_group = \"（群分けなし）\"\n    group_options = [no_group] + data_loader.categorical_columns(df)\n    group_choice = st.selectbox(\"群分け変数\", group_options, index=0)\n    group_col = None if group_choice == no_group else group_choice\n\n    try:\n        t1 = descriptive_stats.table_one(df, group_col=group_col)\n        st.table(t1)\n    except Exception as e:  # noqa: BLE001\n        st.error(f\"Table 1 の生成に失敗しました: {e}\")\n        t1 = None\n\n# ---- ダウンロード ----\nst.markdown(\"---\")\nst.subheader(\"ダウンロード\")\nst.caption(\"記述統計表と Table 1 を Excel / Word / PDF 形式で出力できます。\")\n\ntables: dict = {}\nif len(num_table):\n    tables[\"連続変数_記述統計\"] = num_table\nif len(cat_table):\n    tables[\"カテゴリ変数_記述統計\"] = cat_table\nif t1 is not None and len(t1):\n    tables[\"Table1\"] = t1\n\nif not tables:\n    st.info(\"出力できる表がありません。\")\nelse:\n    col_x, col_w, col_p = st.columns(3)\n\n    with col_x:\n        try:\n            xlsx_bytes = excel_exporter.export_tables(tables)\n            st.download_button(\n                \"Excel (.xlsx)\",\n                data=xlsx_bytes,\n                file_name=\"stateasy_descriptive.xlsx\",\n                mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n                key=\"dl_desc_xlsx\",\n            )\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"Excel 出力に失敗しました: {e}\")\n\n    with col_w:\n        try:\n            docx_bytes = word_exporter.export_report(\n                tables, heading=\"記述統計・Table 1\"\n            )\n            st.download_button(\n                \"Word (.docx)\",\n                data=docx_bytes,\n                file_name=\"stateasy_descriptive.docx\",\n                mime=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document\",\n                key=\"dl_desc_docx\",\n            )\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"Word 出力に失敗しました: {e}\")\n\n    with col_p:\n        try:\n            pdf_bytes = pdf_exporter.export_report(\n                tables, heading=\"記述統計・Table 1\"\n            )\n            st.download_button(\n                \"PDF (.pdf)\",\n                data=pdf_bytes,\n                file_name=\"stateasy_descriptive.pdf\",\n                mime=\"application/pdf\",\n                key=\"dl_desc_pdf\",\n            )\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"PDF 出力に失敗しました: {e}\")\n\ncommon.render_footer()\n", "pages/04_hypothesis.py": "\"\"\"③ 群の違いを調べる（仮説検定の自動選択）。\n\n手法名を知らなくても、目的を選ぶだけで最適な検定が自動で選ばれる教育的ページ。\n\"\"\"\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom modules import common, data_loader, hypothesis_test, effect_size, visualizer\nfrom exporters import excel_exporter, word_exporter, pdf_exporter\n\ncommon.load_css()\ncommon.setup_japanese_font()\n\ndf = common.require_data()\n\nst.title(\"群の違いを調べる\")\nst.markdown(\n    \"手法名を知らなくても大丈夫。目的を選ぶだけで最適な検定が自動で選ばれます。\"\n)\n\n# ---- スタイル付きの理由ボックス ----\nst.markdown(\n    \"\"\"\n    <style>\n    .reason-box {\n        background: #EEF6FF;\n        border-left: 5px solid #2E7BE4;\n        border-radius: 8px;\n        padding: 0.9rem 1.1rem;\n        margin: 0.6rem 0 1.1rem 0;\n        line-height: 1.6;\n        color: #234;\n    }\n    <\/style>\n    \"\"\",\n    unsafe_allow_html=True,\n)\n\n\ndef _show_assumptions(res) -> None:\n    \"\"\"前提条件チェックの表示。\"\"\"\n    assumptions = res.assumptions or {}\n    if not assumptions:\n        return\n    st.subheader(\"前提条件チェック\")\n\n    # 数値比較：正規性\n    normality = assumptions.get(\"normality\")\n    if isinstance(normality, dict):\n        rows = []\n        for label, info in normality.items():\n            rows.append(\n                {\n                    \"群\": str(label),\n                    \"検定\": info.get(\"test\", \"Shapiro-Wilk\"),\n                    \"p値\": common.fmt_p(info.get(\"p\")),\n                    \"正規性\": \"○\" if info.get(\"normal\") else \"×\",\n                    \"備考\": info.get(\"note\", \"\"),\n                }\n            )\n        st.markdown(\"**正規性（Shapiro-Wilk 検定）**\")\n        st.caption(\"p > α なら『正規分布とみなせる（○）』と判断します。\")\n        st.dataframe(pd.DataFrame(rows), use_container_width=True, hide_index=True)\n\n    # 数値比較：等分散\n    eqvar = assumptions.get(\"equal_variance\")\n    if isinstance(eqvar, dict):\n        st.markdown(\"**等分散性（Levene 検定）**\")\n        st.caption(\"p > α なら『等分散とみなせる（○）』と判断します。\")\n        st.dataframe(\n            pd.DataFrame(\n                [\n                    {\n                        \"検定\": eqvar.get(\"test\", \"Levene\"),\n                        \"p値\": common.fmt_p(eqvar.get(\"p\")),\n                        \"等分散\": \"○\" if eqvar.get(\"equal\") else \"×\",\n                        \"備考\": eqvar.get(\"note\", \"\"),\n                    }\n                ]\n            ),\n            use_container_width=True,\n            hide_index=True,\n        )\n\n    # カテゴリ：最小期待度数\n    if \"min_expected_freq\" in assumptions:\n        st.markdown(\"**期待度数のチェック**\")\n        st.caption(\"すべてのセルで期待度数が5以上だとカイ二乗検定が安心して使えます。\")\n        st.dataframe(\n            pd.DataFrame(\n                [\n                    {\n                        \"最小期待度数\": common.fmt_num(\n                            assumptions.get(\"min_expected_freq\")\n                        ),\n                        \"表のサイズ\": \" × \".join(\n                            str(s) for s in assumptions.get(\"table_shape\", (\"\", \"\"))\n                        ),\n                        \"5以上か\": \"○\"\n                        if assumptions.get(\"min_expected_freq\", 0) >= 5\n                        else \"×\",\n                    }\n                ]\n            ),\n            use_container_width=True,\n            hide_index=True,\n        )\n\n\ndef _show_result(res, alpha: float) -> None:\n    \"\"\"検定結果の共通表示。\"\"\"\n    # 検定名を目立たせる\n    st.subheader(\"結果\")\n    st.markdown(f\"### 選ばれた検定：{res.test_name}\")\n\n    # 教育的な理由（必須・絶対に省略しない）\n    st.markdown(\n        f\"<div class='reason-box'><b>なぜこの検定？<\/b><br>{res.reason}<\/div>\",\n        unsafe_allow_html=True,\n    )\n\n    # 前提条件チェック\n    _show_assumptions(res)\n\n    # 検定統計量・自由度・p値\n    st.subheader(\"検定統計量と p 値\")\n    if isinstance(res.dof, (tuple, list)):\n        dof_str = \", \".join(str(d) for d in res.dof)\n    elif res.dof is None:\n        dof_str = \"—\"\n    else:\n        dof_str = str(res.dof)\n    cols = st.columns(3)\n    cols[0].metric(\"検定統計量\", common.fmt_num(res.statistic))\n    cols[1].metric(\"自由度 (df)\", dof_str)\n    cols[2].metric(\n        \"p 値\", f\"{common.fmt_p(res.pvalue)} {common.stars(res.pvalue)}\"\n    )\n    if res.pvalue is not None and not np.isnan(res.pvalue):\n        if res.pvalue < alpha:\n            st.success(f\"p < α（={alpha}）なので、統計的に有意な差があります。\")\n        else:\n            st.info(f\"p ≥ α（={alpha}）なので、有意な差は認められませんでした。\")\n\n    # 効果量\n    eff = res.effect\n    if eff is not None:\n        st.subheader(\"効果量（差の大きさ）\")\n        ci_str = \"—\"\n        if not (np.isnan(eff.ci_low) or np.isnan(eff.ci_high)):\n            ci_str = f\"[{common.fmt_num(eff.ci_low)}, {common.fmt_num(eff.ci_high)}]\"\n        ecols = st.columns(3)\n        ecols[0].metric(eff.name, common.fmt_num(eff.value))\n        ecols[1].metric(\"95% 信頼区間\", ci_str)\n        ecols[2].metric(\"解釈\", eff.interpretation)\n        if eff.comment:\n            st.caption(eff.comment)\n\n    # 多重比較\n    if res.posthoc is not None:\n        st.subheader(\"多重比較（どの群とどの群が違うか）\")\n        st.dataframe(res.posthoc, use_container_width=True, hide_index=True)\n\n\ndef _summary_table(res, value_col=None, group_col=None) -> pd.DataFrame:\n    \"\"\"結果サマリ表を組み立てる（エクスポート用）。\"\"\"\n    eff = res.effect\n    if isinstance(res.dof, (tuple, list)):\n        dof_str = \", \".join(str(d) for d in res.dof)\n    elif res.dof is None:\n        dof_str = \"—\"\n    else:\n        dof_str = str(res.dof)\n    row = {\n        \"検定\": res.test_name,\n        \"検定統計量\": common.fmt_num(res.statistic),\n        \"自由度\": dof_str,\n        \"p値\": common.fmt_p(res.pvalue),\n        \"有意性\": common.stars(res.pvalue),\n    }\n    if eff is not None:\n        row[\"効果量の名称\"] = eff.name\n        row[\"効果量\"] = common.fmt_num(eff.value)\n        row[\"効果量の解釈\"] = eff.interpretation\n    if value_col is not None:\n        row[\"比較した数値\"] = value_col\n    if group_col is not None:\n        row[\"グループ列\"] = group_col\n    return pd.DataFrame([row]).T.reset_index().rename(\n        columns={\"index\": \"項目\", 0: \"値\"}\n    )\n\n\ndef _download_buttons(summary_df: pd.DataFrame, key_prefix: str) -> None:\n    \"\"\"Excel / Word / PDF のダウンロードボタン群。\"\"\"\n    st.subheader(\"結果のダウンロード\")\n    tables = {\"検定結果\": summary_df}\n    dcols = st.columns(3)\n    try:\n        with dcols[0]:\n            st.download_button(\n                \"Excel (.xlsx)\",\n                data=excel_exporter.export_tables(tables),\n                file_name=\"検定結果.xlsx\",\n                mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n                key=f\"{key_prefix}_xlsx\",\n            )\n        with dcols[1]:\n            st.download_button(\n                \"Word (.docx)\",\n                data=word_exporter.export_report(tables, heading=\"検定結果\"),\n                file_name=\"検定結果.docx\",\n                mime=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document\",\n                key=f\"{key_prefix}_docx\",\n            )\n        with dcols[2]:\n            st.download_button(\n                \"PDF (.pdf)\",\n                data=pdf_exporter.export_report(tables, heading=\"検定結果\"),\n                file_name=\"検定結果.pdf\",\n                mime=\"application/pdf\",\n                key=f\"{key_prefix}_pdf\",\n            )\n    except Exception as e:  # noqa: BLE001\n        st.error(f\"ダウンロードファイルの作成に失敗しました：{e}\")\n\n\ndef _figure_downloads(fig, key_prefix: str) -> None:\n    \"\"\"図の PNG / SVG ダウンロード。\"\"\"\n    fcols = st.columns(2)\n    try:\n        with fcols[0]:\n            st.download_button(\n                \"図を PNG で保存\",\n                data=visualizer.fig_to_bytes(fig, fmt=\"png\"),\n                file_name=\"図.png\",\n                mime=\"image/png\",\n                key=f\"{key_prefix}_png\",\n            )\n        with fcols[1]:\n            st.download_button(\n                \"図を SVG で保存\",\n                data=visualizer.fig_to_bytes(fig, fmt=\"svg\"),\n                file_name=\"図.svg\",\n                mime=\"image/svg+xml\",\n                key=f\"{key_prefix}_svg\",\n            )\n    except Exception as e:  # noqa: BLE001\n        st.error(f\"図の保存に失敗しました：{e}\")\n\n\n# ============ 目的の選択 ============\nst.divider()\npurpose = st.radio(\n    \"何を調べたいですか？（目的を選んでください）\",\n    [\n        \"2群以上の数値を比較したい（例：介入群と対照群のスコア差）\",\n        \"2つのカテゴリの関連を調べたい（クロス集計）\",\n    ],\n)\n\nnumeric_cols = data_loader.numeric_columns(df)\ncategorical_cols = data_loader.categorical_columns(df)\n\n# ============ 数値比較パス ============\nif purpose.startswith(\"2群以上の数値\"):\n    if not numeric_cols:\n        st.warning(\"数値の列が見つかりません。数値データを含むファイルをお使いください。\")\n    elif not categorical_cols:\n        st.warning(\"グループ分けに使えるカテゴリ列が見つかりません。\")\n    else:\n        value_col = st.selectbox(\"比較したい数値\", numeric_cols, key=\"num_value_col\")\n        group_col = st.selectbox(\n            \"グループ分けの列\", categorical_cols, key=\"num_group_col\"\n        )\n        paired = st.checkbox(\n            \"対応あり（同じ対象の前後比較など）\", value=False, key=\"num_paired\"\n        )\n        use_bootstrap = st.checkbox(\n            \"ブートストラップ信頼区間を使う\", value=False, key=\"num_bootstrap\"\n        )\n        alpha = st.slider(\n            \"有意水準 α\", min_value=0.001, max_value=0.10, value=0.05, step=0.001,\n            key=\"num_alpha\",\n        )\n\n        if st.button(\"検定を実行\", type=\"primary\", key=\"num_run\"):\n            try:\n                res = hypothesis_test.compare_groups(\n                    df,\n                    value_col,\n                    group_col,\n                    paired=paired,\n                    alpha=alpha,\n                    use_bootstrap=use_bootstrap,\n                )\n                st.session_state[\"hyp_num_res\"] = res\n                st.session_state[\"hyp_num_meta\"] = (value_col, group_col, alpha)\n            except Exception as e:  # noqa: BLE001\n                st.error(f\"検定を実行できませんでした：{e}\")\n\n        res = st.session_state.get(\"hyp_num_res\")\n        meta = st.session_state.get(\"hyp_num_meta\")\n        if res is not None and meta is not None:\n            value_col, group_col, alpha = meta\n            _show_result(res, alpha)\n\n            # 図：箱ひげ図\n            st.subheader(\"グラフで確認（箱ひげ図）\")\n            try:\n                fig = visualizer.boxplot(df, value_col, group_col)\n                st.pyplot(fig)\n                _figure_downloads(fig, \"num_box\")\n            except Exception as e:  # noqa: BLE001\n                st.error(f\"図の描画に失敗しました：{e}\")\n\n            # ダウンロード\n            _download_buttons(\n                _summary_table(res, value_col, group_col), \"num_dl\"\n            )\n\n# ============ カテゴリ関連パス ============\nelse:\n    if len(categorical_cols) < 2:\n        st.warning(\"カテゴリの列が2つ以上必要です。\")\n    else:\n        col1 = st.selectbox(\"1つ目のカテゴリ列\", categorical_cols, key=\"cat_col1\")\n        col2 = st.selectbox(\n            \"2つ目のカテゴリ列\",\n            categorical_cols,\n            index=1 if len(categorical_cols) > 1 else 0,\n            key=\"cat_col2\",\n        )\n        alpha = st.slider(\n            \"有意水準 α\", min_value=0.001, max_value=0.10, value=0.05, step=0.001,\n            key=\"cat_alpha\",\n        )\n\n        if st.button(\"検定を実行\", type=\"primary\", key=\"cat_run\"):\n            if col1 == col2:\n                st.error(\"異なる2つの列を選んでください。\")\n            else:\n                try:\n                    res = hypothesis_test.categorical_test(df, col1, col2, alpha)\n                    st.session_state[\"hyp_cat_res\"] = res\n                    st.session_state[\"hyp_cat_meta\"] = (col1, col2, alpha)\n                except Exception as e:  # noqa: BLE001\n                    st.error(f\"検定を実行できませんでした：{e}\")\n\n        res = st.session_state.get(\"hyp_cat_res\")\n        meta = st.session_state.get(\"hyp_cat_meta\")\n        if res is not None and meta is not None:\n            col1, col2, alpha = meta\n            _show_result(res, alpha)\n\n            # クロス集計表と期待度数\n            extra = res.extra or {}\n            if \"crosstab\" in extra:\n                st.subheader(\"クロス集計表（観測度数）\")\n                st.dataframe(extra[\"crosstab\"], use_container_width=True)\n            if \"expected\" in extra:\n                st.subheader(\"期待度数\")\n                st.caption(\"各セルが独立だった場合に期待される度数です。\")\n                st.dataframe(\n                    extra[\"expected\"].round(2), use_container_width=True\n                )\n\n            _download_buttons(_summary_table(res, col1, col2), \"cat_dl\")\n\ncommon.render_footer()\n", "pages/05_effect.py": "\"\"\"④ 効果量・信頼区間（スタンドアロン）。\n\np 値だけでは『差の大きさ（実質的な意味）』はわからない。\n効果量と信頼区間で、差がどれくらい大きいのかを評価する。\n\"\"\"\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom modules import common, data_loader, hypothesis_test, effect_size, visualizer\nfrom exporters import excel_exporter, word_exporter, pdf_exporter\n\ncommon.load_css()\ncommon.setup_japanese_font()\n\ndf = common.require_data()\n\nst.title(\"効果量・信頼区間\")\nst.markdown(\n    \"p 値は『差があるか（偶然か否か）』を示しますが、**差の大きさ（実質的な意味）**は教えてくれません。\"\n    \"サンプルサイズが大きいと、ごくわずかな差でも有意になりがちです。\"\n    \"そこで、差の大きさを表す**効果量**と、その推定の確からしさを示す**信頼区間**を確認します。\"\n)\n\n# ---- 効果量の基準（参照表）----\nst.subheader(\"効果量の大きさの目安（Cohen の基準）\")\nthreshold_df = pd.DataFrame(\n    {\n        \"効果量\": [\"Cohen's d / Hedges' g\", \"η²（イータ二乗）\", \"Cramér's V\"],\n        \"小 (small)\": [\"0.2\", \".01\", \".1\"],\n        \"中 (medium)\": [\"0.5\", \".06\", \".3\"],\n        \"大 (large)\": [\"0.8\", \".14\", \".5\"],\n    }\n)\nst.dataframe(threshold_df, use_container_width=True, hide_index=True)\n\nst.divider()\n\n# ---- Cohen's d / Hedges' g の計算 ----\nst.subheader(\"2群の効果量（Cohen's d / Hedges' g）を計算する\")\n\nnumeric_cols = data_loader.numeric_columns(df)\ncategorical_cols = data_loader.categorical_columns(df)\n\nif not numeric_cols:\n    st.warning(\"数値の列が見つかりません。数値データを含むファイルをお使いください。\")\nelif not categorical_cols:\n    st.warning(\"グループ分けに使えるカテゴリ列が見つかりません。\")\nelse:\n    value_col = st.selectbox(\"対象の数値\", numeric_cols, key=\"eff_value_col\")\n    group_col = st.selectbox(\"グループ分けの列\", categorical_cols, key=\"eff_group_col\")\n\n    levels = list(pd.Series(df[group_col].dropna().unique()))\n\n    chosen = None\n    if len(levels) < 2:\n        st.warning(\"選んだ列にはグループが1つしかありません。2群以上の列を選んでください。\")\n    elif len(levels) == 2:\n        chosen = levels\n        st.caption(f\"比較する2群：{levels[0]} と {levels[1]}\")\n    else:\n        chosen = st.multiselect(\n            \"比較する2つの群を選んでください（ちょうど2つ）\",\n            options=[str(x) for x in levels],\n            default=[str(levels[0]), str(levels[1])],\n            max_selections=2,\n            key=\"eff_levels\",\n        )\n        if len(chosen) != 2:\n            st.info(\"ちょうど2つの群を選んでください。\")\n            chosen = None\n\n    paired = st.checkbox(\"対応あり（同じ対象の前後比較など）\", value=False, key=\"eff_paired\")\n    use_bootstrap = st.checkbox(\n        \"ブートストラップ信頼区間を使う\", value=False, key=\"eff_bootstrap\"\n    )\n\n    if st.button(\"効果量を計算\", type=\"primary\", key=\"eff_run\"):\n        if not chosen or len(chosen) != 2:\n            st.error(\"比較する2つの群を選んでください。\")\n        else:\n            try:\n                sub = df[[value_col, group_col]].dropna()\n                sub[group_col] = sub[group_col].astype(str)\n                g1, g2 = str(chosen[0]), str(chosen[1])\n                a = sub.loc[sub[group_col] == g1, value_col].to_numpy(dtype=float)\n                b = sub.loc[sub[group_col] == g2, value_col].to_numpy(dtype=float)\n                if len(a) < 2 or len(b) < 2:\n                    raise ValueError(\"各群に2件以上のデータが必要です。\")\n                res = effect_size.two_group_effect(\n                    a, b, paired=paired, use_bootstrap=use_bootstrap\n                )\n                st.session_state[\"eff_res\"] = res\n                st.session_state[\"eff_meta\"] = (value_col, group_col, g1, g2)\n            except Exception as e:  # noqa: BLE001\n                st.error(f\"効果量を計算できませんでした：{e}\")\n\n    res = st.session_state.get(\"eff_res\")\n    meta = st.session_state.get(\"eff_meta\")\n    if res is not None and meta is not None:\n        value_col_r, group_col_r, g1, g2 = meta\n        st.subheader(\"結果\")\n        st.caption(f\"{value_col_r}：『{g1}』 vs 『{g2}』\")\n\n        ci_str = \"—\"\n        if not (np.isnan(res.ci_low) or np.isnan(res.ci_high)):\n            ci_str = f\"[{common.fmt_num(res.ci_low)}, {common.fmt_num(res.ci_high)}]\"\n\n        mcols = st.columns(3)\n        mcols[0].metric(res.name, common.fmt_num(res.value))\n        mcols[1].metric(\"95% 信頼区間\", ci_str)\n        mcols[2].metric(\"解釈\", res.interpretation)\n\n        if res.comment:\n            st.info(res.comment)\n\n        st.caption(\n            \"信頼区間が0をまたぐ場合、差が0である可能性も否定できないことを意味します。\"\n        )\n\n        # サマリ表とダウンロード\n        summary_df = pd.DataFrame(\n            [\n                {\"項目\": \"効果量の名称\", \"値\": res.name},\n                {\"項目\": \"効果量\", \"値\": common.fmt_num(res.value)},\n                {\"項目\": \"95% 信頼区間\", \"値\": ci_str},\n                {\"項目\": \"解釈\", \"値\": res.interpretation},\n                {\"項目\": \"対象の数値\", \"値\": value_col_r},\n                {\"項目\": \"比較した群\", \"値\": f\"{g1} vs {g2}\"},\n            ]\n        )\n        tables = {\"効果量\": summary_df}\n        st.subheader(\"結果のダウンロード\")\n        dcols = st.columns(3)\n        try:\n            with dcols[0]:\n                st.download_button(\n                    \"Excel (.xlsx)\",\n                    data=excel_exporter.export_tables(tables),\n                    file_name=\"効果量.xlsx\",\n                    mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n                    key=\"eff_xlsx\",\n                )\n            with dcols[1]:\n                st.download_button(\n                    \"Word (.docx)\",\n                    data=word_exporter.export_report(tables, heading=\"効果量\"),\n                    file_name=\"効果量.docx\",\n                    mime=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document\",\n                    key=\"eff_docx\",\n                )\n            with dcols[2]:\n                st.download_button(\n                    \"PDF (.pdf)\",\n                    data=pdf_exporter.export_report(tables, heading=\"効果量\"),\n                    file_name=\"効果量.pdf\",\n                    mime=\"application/pdf\",\n                    key=\"eff_pdf\",\n                )\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"ダウンロードファイルの作成に失敗しました：{e}\")\n\ncommon.render_footer()\n", "pages/06_regression.py": "\"\"\"⑥ 変数間の関係を調べる（相関・回帰）。\n\n相関分析、線形回帰、ロジスティック回帰、変数変換による比較を行う。\n\"\"\"\nfrom __future__ import annotations\n\nimport streamlit as st\nimport pandas as pd\n\nfrom modules import common, data_loader, correlation, visualizer\nfrom exporters import excel_exporter, word_exporter, pdf_exporter\n\ndf = common.require_data()\n\nst.title(\"🔗 変数間の関係を調べる\")\nst.markdown(\n    \"相関分析・線形回帰・ロジスティック回帰・変数変換を通じて、\"\n    \"変数どうしの関係を統計的に調べます。\"\n)\n\nnumeric_cols = data_loader.numeric_columns(df)\ncat_cols = data_loader.categorical_columns(df)\n\ntab_corr, tab_lin, tab_logit, tab_trans = st.tabs(\n    [\"相関分析\", \"線形回帰\", \"ロジスティック回帰\", \"変数変換\"]\n)\n\n\ndef _fmt_p_table(table: pd.DataFrame, p_col: str = \"p値\") -> pd.DataFrame:\n    \"\"\"表示用に p 値列を APA 形式へ整形したコピーを返す。\"\"\"\n    disp = table.copy()\n    if p_col in disp.columns:\n        disp[p_col] = disp[p_col].map(common.fmt_p)\n    return disp\n\n\ndef _table_download_buttons(tables: dict, images, key_prefix: str,\n                            heading: str = \"StatEasy 解析レポート\"):\n    \"\"\"主要表を Excel / Word / PDF でダウンロードできるボタン群を出す。\"\"\"\n    c1, c2, c3 = st.columns(3)\n    try:\n        xlsx = excel_exporter.export_tables(tables)\n        c1.download_button(\n            \"Excel をダウンロード\", data=xlsx,\n            file_name=f\"{key_prefix}.xlsx\",\n            mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n            key=f\"dl_{key_prefix}_xlsx\",\n        )\n    except Exception as e:  # noqa: BLE001\n        c1.error(f\"Excel 出力に失敗: {e}\")\n    try:\n        docx = word_exporter.export_report(tables, images=images, heading=heading)\n        c2.download_button(\n            \"Word をダウンロード\", data=docx,\n            file_name=f\"{key_prefix}.docx\",\n            mime=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document\",\n            key=f\"dl_{key_prefix}_docx\",\n        )\n    except Exception as e:  # noqa: BLE001\n        c2.error(f\"Word 出力に失敗: {e}\")\n    try:\n        pdf = pdf_exporter.export_report(tables, images=images, heading=heading)\n        c3.download_button(\n            \"PDF をダウンロード\", data=pdf,\n            file_name=f\"{key_prefix}.pdf\",\n            mime=\"application/pdf\",\n            key=f\"dl_{key_prefix}_pdf\",\n        )\n    except Exception as e:  # noqa: BLE001\n        c3.error(f\"PDF 出力に失敗: {e}\")\n\n\ndef _fig_download_buttons(fig, key_prefix: str):\n    \"\"\"図の PNG / SVG ダウンロードボタンを出す。\"\"\"\n    png = visualizer.fig_to_bytes(fig, fmt=\"png\")\n    svg = visualizer.fig_to_bytes(fig, fmt=\"svg\")\n    d1, d2 = st.columns(2)\n    d1.download_button(\n        \"PNG をダウンロード\", data=png, file_name=f\"{key_prefix}.png\",\n        mime=\"image/png\", key=f\"dl_{key_prefix}_png\",\n    )\n    d2.download_button(\n        \"SVG をダウンロード\", data=svg, file_name=f\"{key_prefix}.svg\",\n        mime=\"image/svg+xml\", key=f\"dl_{key_prefix}_svg\",\n    )\n\n\n# =========================== 相関分析 ===========================\nwith tab_corr:\n    st.subheader(\"相関分析\")\n    if len(numeric_cols) < 2:\n        st.info(\"相関分析には数値列が 2 つ以上必要です。\")\n    else:\n        method_label = st.radio(\n            \"相関係数の種類\",\n            [\"Pearson（ピアソン）\", \"Spearman（スピアマン）\", \"Kendall（ケンドール）\"],\n            horizontal=True,\n            help=\"Pearson は線形関係、Spearman / Kendall は順位に基づく単調関係を測ります。\",\n            key=\"corr_method\",\n        )\n        method = {\n            \"Pearson（ピアソン）\": \"pearson\",\n            \"Spearman（スピアマン）\": \"spearman\",\n            \"Kendall（ケンドール）\": \"kendall\",\n        }[method_label]\n\n        cols = st.multiselect(\n            \"対象とする数値列\", numeric_cols, default=numeric_cols, key=\"corr_cols\"\n        )\n        if len(cols) < 2:\n            st.info(\"2 つ以上の列を選択してください。\")\n        else:\n            try:\n                corr, pvals = correlation.correlation_matrix(df, method, cols)\n            except Exception as e:  # noqa: BLE001\n                st.error(f\"相関の計算に失敗しました: {e}\")\n            else:\n                st.markdown(\"**相関係数行列**\")\n                st.dataframe(corr.round(3), use_container_width=True)\n\n                st.markdown(\"**p 値行列**\")\n                st.dataframe(\n                    pvals.map(common.fmt_p), use_container_width=True\n                )\n\n                st.markdown(\"**相関ヒートマップ**\")\n                fig = visualizer.correlation_heatmap(corr)\n                st.pyplot(fig)\n                _fig_download_buttons(fig, \"correlation_heatmap\")\n\n\n# =========================== 線形回帰 ===========================\nwith tab_lin:\n    st.subheader(\"線形回帰\")\n    if len(numeric_cols) < 2:\n        st.info(\"線形回帰には数値列が 2 つ以上必要です。\")\n    else:\n        y_col = st.selectbox(\"目的変数 y（数値）\", numeric_cols, key=\"lin_y\")\n        x_candidates = [c for c in numeric_cols if c != y_col]\n        x_cols = st.multiselect(\n            \"説明変数 x（数値・複数可）\", x_candidates,\n            default=x_candidates[:1], key=\"lin_x\",\n        )\n\n        if st.button(\"線形回帰を実行\", key=\"run_lin\"):\n            if not x_cols:\n                st.warning(\"説明変数を 1 つ以上選択してください。\")\n            else:\n                try:\n                    res = correlation.linear_regression(df, y_col, x_cols)\n                except Exception as e:  # noqa: BLE001\n                    st.error(f\"線形回帰に失敗しました: {e}\")\n                else:\n                    st.markdown(\"**回帰係数**\")\n                    st.dataframe(\n                        _fmt_p_table(res.summary_table), use_container_width=True\n                    )\n\n                    st.markdown(\"**モデル適合度**\")\n                    fit_disp = {\n                        k: (common.fmt_p(v) if \"p値\" in k else v)\n                        for k, v in res.fit_stats.items()\n                    }\n                    fit_df = pd.DataFrame(\n                        list(fit_disp.items()), columns=[\"指標\", \"値\"]\n                    )\n                    st.dataframe(fit_df, use_container_width=True)\n\n                    if res.vif is not None:\n                        st.markdown(\"**VIF（多重共線性）**\")\n                        st.dataframe(res.vif, use_container_width=True)\n                    for w in res.warnings:\n                        st.warning(w)\n\n                    st.markdown(\"**残差診断**\")\n                    fig = visualizer.residual_plots(\n                        res.diagnostics[\"fitted\"], res.diagnostics[\"residuals\"]\n                    )\n                    st.pyplot(fig)\n                    st.caption(\n                        f\"Durbin-Watson 統計量 = {res.diagnostics['durbin_watson']}\"\n                        \"（2 前後なら残差の独立性に問題は少ない）\"\n                    )\n\n                    png = visualizer.fig_to_bytes(fig, fmt=\"png\")\n                    st.markdown(\"**結果のダウンロード**\")\n                    _table_download_buttons(\n                        {\"回帰係数\": res.summary_table, \"モデル適合度\": fit_df},\n                        images=[(\"残差診断プロット\", png)],\n                        key_prefix=\"linear_regression\",\n                        heading=\"線形回帰 解析レポート\",\n                    )\n\n\n# ====================== ロジスティック回帰 ======================\nwith tab_logit:\n    st.subheader(\"ロジスティック回帰\")\n    if not cat_cols or not numeric_cols:\n        st.info(\"ロジスティック回帰には 2 値のカテゴリ列と数値の説明変数が必要です。\")\n    else:\n        y_col = st.selectbox(\n            \"目的変数 y（2 値カテゴリ）\", cat_cols, key=\"logit_y\",\n            help=\"水準が 2 つのカテゴリ列を選んでください。\",\n        )\n        x_cols = st.multiselect(\n            \"説明変数 x（数値・複数可）\", numeric_cols,\n            default=numeric_cols[:1], key=\"logit_x\",\n        )\n\n        if st.button(\"ロジスティック回帰を実行\", key=\"run_logit\"):\n            if not x_cols:\n                st.warning(\"説明変数を 1 つ以上選択してください。\")\n            else:\n                try:\n                    res = correlation.logistic_regression(df, y_col, x_cols)\n                except Exception as e:  # noqa: BLE001\n                    st.error(f\"ロジスティック回帰に失敗しました: {e}\")\n                else:\n                    st.markdown(\"**回帰係数（オッズ比）**\")\n                    st.dataframe(\n                        _fmt_p_table(res.summary_table), use_container_width=True\n                    )\n\n                    st.markdown(\"**モデル適合度**\")\n                    fit_df = pd.DataFrame(\n                        list(res.fit_stats.items()), columns=[\"指標\", \"値\"]\n                    )\n                    st.dataframe(fit_df, use_container_width=True)\n\n                    st.markdown(\"**ROC 曲線**\")\n                    fpr, tpr = res.diagnostics[\"roc\"]\n                    auc = res.diagnostics[\"auc\"]\n                    roc_data = {\"モデル\": (fpr, tpr, auc)}\n                    fig = visualizer.roc_curve_plot(roc_data)\n                    st.pyplot(fig)\n                    _fig_download_buttons(fig, \"roc_curve\")\n\n                    st.markdown(\"**混同行列**\")\n                    classes = res.diagnostics[\"classes\"]\n                    cm = res.diagnostics[\"confusion_matrix\"]\n                    cm_df = pd.DataFrame(\n                        cm,\n                        index=[f\"実測: {c}\" for c in classes],\n                        columns=[f\"予測: {c}\" for c in classes],\n                    )\n                    st.dataframe(cm_df, use_container_width=True)\n\n                    st.markdown(\"**Hosmer-Lemeshow 適合度検定**\")\n                    hl = res.diagnostics[\"hosmer_lemeshow\"]\n                    st.write(\n                        f\"統計量 = {hl['statistic']}、自由度 = {hl['dof']}、\"\n                        f\"p = {common.fmt_p(hl['p'])}\"\n                    )\n                    st.caption(\"p が大きい（>0.05）ほどモデルの当てはまりは良好です。\")\n\n                    png = visualizer.fig_to_bytes(fig, fmt=\"png\")\n                    st.markdown(\"**結果のダウンロード**\")\n                    _table_download_buttons(\n                        {\n                            \"回帰係数\": res.summary_table,\n                            \"モデル適合度\": fit_df,\n                            \"混同行列\": cm_df.reset_index().rename(\n                                columns={\"index\": \"\"}\n                            ),\n                        },\n                        images=[(\"ROC 曲線\", png)],\n                        key_prefix=\"logistic_regression\",\n                        heading=\"ロジスティック回帰 解析レポート\",\n                    )\n\n\n# =========================== 変数変換 ===========================\nwith tab_trans:\n    st.subheader(\"変数変換とモデル比較\")\n    st.markdown(\n        \"説明変数に変換（対数・二乗・平方根・交互作用項）を施し、元のモデルと\"\n        \"当てはまり（AIC/BIC/R²）を比較できます。\"\n    )\n    if len(numeric_cols) < 2:\n        st.info(\"変数変換の比較には数値列が 2 つ以上必要です。\")\n    else:\n        target_x = st.selectbox(\n            \"変換する数値列\", numeric_cols, key=\"trans_col\"\n        )\n        kind_labels = st.multiselect(\n            \"適用する変換\",\n            [\"対数（log）\", \"二乗（square）\", \"平方根（sqrt）\"],\n            default=[\"対数（log）\"],\n            key=\"trans_kinds\",\n        )\n        kinds = [\n            {\"対数（log）\": \"log\", \"二乗（square）\": \"square\",\n             \"平方根（sqrt）\": \"sqrt\"}[k]\n            for k in kind_labels\n        ]\n\n        y_candidates = [c for c in numeric_cols if c != target_x]\n        y_col = st.selectbox(\"目的変数 y（数値）\", y_candidates, key=\"trans_y\")\n\n        # 交互作用項\n        use_interaction = st.checkbox(\n            \"交互作用項を追加する（2つの説明変数の積）\", key=\"trans_interaction\"\n        )\n        inter_col = None\n        if use_interaction:\n            inter_candidates = [c for c in numeric_cols if c not in (target_x, y_col)]\n            if inter_candidates:\n                inter_col = st.selectbox(\n                    f\"{target_x} と掛け合わせる列\", inter_candidates, key=\"trans_inter_col\"\n                )\n            else:\n                st.info(\"交互作用に使える数値列が不足しています。\")\n\n        if st.button(\"変換してモデルを比較\", key=\"run_trans\"):\n            if not kinds and not (use_interaction and inter_col):\n                st.warning(\"変換または交互作用項を 1 つ以上選択してください。\")\n            else:\n                try:\n                    tdf = correlation.add_transformations(df, target_x, kinds)\n                    models = {}\n                    base = correlation.linear_regression(tdf, y_col, [target_x])\n                    models[\"元の変数\"] = base\n                    name_map = {\n                        \"log\": (f\"log_{target_x}\", \"対数変換\"),\n                        \"square\": (f\"sq_{target_x}\", \"二乗変換\"),\n                        \"sqrt\": (f\"sqrt_{target_x}\", \"平方根変換\"),\n                    }\n                    for k in kinds:\n                        col_name, label = name_map[k]\n                        if col_name in tdf.columns:\n                            models[label] = correlation.linear_regression(\n                                tdf, y_col, [col_name]\n                            )\n                    if use_interaction and inter_col:\n                        tdf = correlation.add_interaction(tdf, target_x, inter_col)\n                        inter_name = f\"{target_x}×{inter_col}\"\n                        models[f\"交互作用（{target_x}×{inter_col}）\"] = (\n                            correlation.linear_regression(\n                                tdf, y_col, [target_x, inter_col, inter_name]\n                            )\n                        )\n                    comp = correlation.compare_models_fit(models)\n                except Exception as e:  # noqa: BLE001\n                    st.error(f\"変換・モデル比較に失敗しました: {e}\")\n                else:\n                    st.markdown(\"**モデル比較（AIC / BIC / R²）**\")\n                    st.dataframe(comp, use_container_width=True)\n                    st.caption(\"AIC・BIC は小さいほど、R² は大きいほど当てはまりが良いとされます。\")\n                    _table_download_buttons(\n                        {\"モデル比較\": comp},\n                        images=None,\n                        key_prefix=\"model_comparison\",\n                        heading=\"変数変換 モデル比較レポート\",\n                    )\n\n\ncommon.render_footer()\n", "pages/07_ml.py": "\"\"\"⑥ 予測モデルを作る（機械学習モデルの自動比較）ページ。\n\n目的変数の型から分類/回帰を自動判定し、複数モデルを k 分割交差検証で比較する。\n\"\"\"\nfrom __future__ import annotations\n\nimport streamlit as st\nimport pandas as pd\n\nfrom modules import common, data_loader, ml_compare, clustering, visualizer\nfrom exporters import excel_exporter, pdf_exporter\n\ndf = common.require_data()\n\nst.title(\"🤖 予測モデルを作る\")\nst.markdown(\n    \"選んだ目的変数を予測するモデルを自動で作成・比較します。\"\n    \"目的変数の型から **分類**（カテゴリの予測）か **回帰**（数値の予測）かを自動で判定し、\"\n    \"ランダムフォレストやロジスティック回帰などの複数モデルを \"\n    \"**k 分割交差検証** で公平に評価して、最も成績の良いモデルを提示します。\"\n)\nst.caption(\"計算は scikit-learn / xgboost のみで行います（生成 AI は使用しません）。\")\n\n# ---- 目的変数 ----\ntarget = st.selectbox(\"目的変数（予測したい列）\", df.columns.tolist())\n\nmode = ml_compare.detect_mode(df[target])\nmode_label = \"分類\" if mode == \"classification\" else \"回帰\"\nst.info(f\"判定された分析タイプ： **{mode_label}**\")\n\n# ---- 特徴量 ----\nnumeric_cols = [c for c in data_loader.numeric_columns(df) if c != target]\nfeatures = st.multiselect(\n    \"特徴量（予測に使う数値列）\",\n    numeric_cols,\n    default=numeric_cols,\n    help=\"目的変数を予測するために使う説明変数を選びます。\",\n)\n\n# ---- 交差検証の分割数 ----\nk = st.slider(\"交差検証の分割数 (k)\", min_value=2, max_value=10, value=5,\n              help=\"データを k 個に分けて、k 回の学習・検証を繰り返して平均的な性能を測ります。\")\n\n# ---- 実行 ----\nif st.button(\"モデルを比較\", type=\"primary\"):\n    if not features:\n        st.error(\"特徴量を1つ以上選んでください。\")\n    else:\n        try:\n            with st.spinner(\"モデルを学習・比較しています…\"):\n                result = ml_compare.compare(df, target, features, k)\n            st.session_state[\"ml_result\"] = result\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"モデル比較中にエラーが発生しました: {e}\")\n\nresult = st.session_state.get(\"ml_result\")\n\nif result is not None and result.target == target:\n    # ---- 警告 ----\n    for w in result.warnings:\n        st.warning(w)\n\n    # ---- 比較表 ----\n    st.subheader(\"モデル比較結果\")\n    st.caption(\"成績の良い順に並んでいます（上が最優秀）。\")\n    st.dataframe(result.comparison, use_container_width=True)\n    st.success(f\"最優秀モデル: {result.best_model_name}\")\n\n    # ---- 特徴量重要度 ----\n    if result.feature_importance is not None:\n        st.subheader(\"特徴量重要度\")\n        st.caption(\"予測にどの特徴量が効いているかを示します（最優秀モデルに基づく）。\")\n        try:\n            fig_fi = visualizer.feature_importance_plot(result.feature_importance)\n            st.pyplot(fig_fi)\n            c1, c2 = st.columns(2)\n            c1.download_button(\n                \"PNG をダウンロード\",\n                data=visualizer.fig_to_bytes(fig_fi, fmt=\"png\"),\n                file_name=\"feature_importance.png\",\n                mime=\"image/png\",\n                key=\"dl_fi_png\",\n            )\n            c2.download_button(\n                \"SVG をダウンロード\",\n                data=visualizer.fig_to_bytes(fig_fi, fmt=\"svg\"),\n                file_name=\"feature_importance.svg\",\n                mime=\"image/svg+xml\",\n                key=\"dl_fi_svg\",\n            )\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"特徴量重要度の作図に失敗しました: {e}\")\n        st.dataframe(result.feature_importance, use_container_width=True)\n\n    # ---- ROC 曲線（2値分類のみ）----\n    if result.roc_data:\n        st.subheader(\"ROC 曲線\")\n        st.caption(\"2値分類における各モデルの判別性能（曲線が左上に寄るほど良い）。\")\n        try:\n            fig_roc = visualizer.roc_curve_plot(result.roc_data)\n            st.pyplot(fig_roc)\n            c1, c2 = st.columns(2)\n            c1.download_button(\n                \"PNG をダウンロード\",\n                data=visualizer.fig_to_bytes(fig_roc, fmt=\"png\"),\n                file_name=\"roc_curve.png\",\n                mime=\"image/png\",\n                key=\"dl_roc_png\",\n            )\n            c2.download_button(\n                \"SVG をダウンロード\",\n                data=visualizer.fig_to_bytes(fig_roc, fmt=\"svg\"),\n                file_name=\"roc_curve.svg\",\n                mime=\"image/svg+xml\",\n                key=\"dl_roc_svg\",\n            )\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"ROC 曲線の作図に失敗しました: {e}\")\n\n    # ---- 混同行列（最優秀分類モデル）----\n    if result.mode == \"classification\" and result.confusion_matrix is not None:\n        st.subheader(f\"混同行列（{result.best_model_name}）\")\n        st.caption(\"行＝実際のクラス、列＝予測クラス（ホールドアウト 30% で評価）。\")\n        labels = result.confusion_labels\n        cm_df = pd.DataFrame(\n            result.confusion_matrix,\n            index=[f\"実際: {l}\" for l in labels],\n            columns=[f\"予測: {l}\" for l in labels],\n        )\n        st.dataframe(cm_df, use_container_width=True)\n\n    # ---- 表のエクスポート ----\n    st.subheader(\"レポート出力\")\n    tables = {\"モデル比較\": result.comparison}\n    if result.feature_importance is not None:\n        tables[\"特徴量重要度\"] = result.feature_importance\n    c1, c2 = st.columns(2)\n    try:\n        c1.download_button(\n            \"Excel をダウンロード\",\n            data=excel_exporter.export_tables(tables),\n            file_name=\"ml_comparison.xlsx\",\n            mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n            key=\"dl_ml_xlsx\",\n        )\n    except Exception as e:  # noqa: BLE001\n        c1.error(f\"Excel 出力に失敗しました: {e}\")\n    try:\n        c2.download_button(\n            \"PDF をダウンロード\",\n            data=pdf_exporter.export_report(tables, heading=\"StatEasy 予測モデル比較レポート\"),\n            file_name=\"ml_comparison.pdf\",\n            mime=\"application/pdf\",\n            key=\"dl_ml_pdf\",\n        )\n    except Exception as e:  # noqa: BLE001\n        c2.error(f\"PDF 出力に失敗しました: {e}\")\n\ncommon.render_footer()\n", "pages/08_clustering.py": "\"\"\"⑦ グループに分ける（クラスタリング）ページ。\n\nk-means / 階層的クラスタリングで、似たデータどうしを自動でグループ化する。\n\"\"\"\nfrom __future__ import annotations\n\nimport streamlit as st\nimport pandas as pd\n\nfrom modules import common, data_loader, ml_compare, clustering, visualizer\nfrom exporters import excel_exporter, pdf_exporter\n\ndf = common.require_data()\n\nst.title(\"🧩 グループに分ける\")\nst.markdown(\n    \"似たデータどうしを自動でまとめて、いくつかの **クラスタ（グループ）** に分けます。\"\n    \"正解ラベルが無くてもデータの構造を発見できる手法（教師なし学習）です。\"\n    \"まず最適なクラスタ数を検討してから、k-means または階層的クラスタリングを実行できます。\"\n)\nst.caption(\"計算は scikit-learn / scipy のみで行います（生成 AI は使用しません）。\")\n\n# ---- 特徴量 ----\nnumeric_cols = data_loader.numeric_columns(df)\nfeatures = st.multiselect(\n    \"特徴量（グループ分けに使う数値列）\",\n    numeric_cols,\n    default=numeric_cols,\n    help=\"この列の値が似ているデータどうしを同じグループにまとめます。\",\n)\n\n# ---- セクション1：クラスタ数の検討 ----\nst.subheader(\"1. クラスタ数の検討\")\nst.markdown(\n    \"Elbow 法（慣性の減り方）とシルエット係数から、適切なクラスタ数の目安を提示します。\"\n)\nif st.button(\"クラスタ数を検討する\"):\n    if not features:\n        st.error(\"特徴量を1つ以上選んでください。\")\n    else:\n        try:\n            with st.spinner(\"クラスタ数を検討しています…\"):\n                suggestion = clustering.suggest_k(df, features)\n            st.session_state[\"cluster_suggestion\"] = suggestion\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"クラスタ数の検討中にエラーが発生しました: {e}\")\n\nsuggestion = st.session_state.get(\"cluster_suggestion\")\nif suggestion is not None:\n    try:\n        fig_es = visualizer.elbow_silhouette(suggestion)\n        st.pyplot(fig_es)\n        c1, c2 = st.columns(2)\n        c1.download_button(\n            \"PNG をダウンロード\",\n            data=visualizer.fig_to_bytes(fig_es, fmt=\"png\"),\n            file_name=\"elbow_silhouette.png\",\n            mime=\"image/png\",\n            key=\"dl_es_png\",\n        )\n        c2.download_button(\n            \"SVG をダウンロード\",\n            data=visualizer.fig_to_bytes(fig_es, fmt=\"svg\"),\n            file_name=\"elbow_silhouette.svg\",\n            mime=\"image/svg+xml\",\n            key=\"dl_es_svg\",\n        )\n    except Exception as e:  # noqa: BLE001\n        st.error(f\"図の作成に失敗しました: {e}\")\n    st.info(f\"推奨されるクラスタ数： **k = {suggestion.suggested_k}**\")\n\n# ---- セクション2：クラスタリング実行 ----\nst.subheader(\"2. クラスタリングの実行\")\n\nmethod_choice = st.radio(\"手法\", [\"k-means\", \"階層的クラスタリング\"], horizontal=True)\n\ndefault_k = suggestion.suggested_k if suggestion is not None else 3\nk = st.slider(\"クラスタ数 (k)\", min_value=2, max_value=10, value=int(default_k))\n\nlinkage_method = \"ward\"\nif method_choice == \"階層的クラスタリング\":\n    method_label = st.radio(\n        \"結合方法\", [\"Ward法\", \"Complete法\", \"Average法\"], horizontal=True\n    )\n    linkage_method = {\"Ward法\": \"ward\", \"Complete法\": \"complete\", \"Average法\": \"average\"}[\n        method_label\n    ]\n\nif st.button(\"クラスタリング実行\", type=\"primary\"):\n    if not features:\n        st.error(\"特徴量を1つ以上選んでください。\")\n    else:\n        try:\n            with st.spinner(\"クラスタリングを実行しています…\"):\n                if method_choice == \"k-means\":\n                    result = clustering.kmeans(df, k, features)\n                else:\n                    result = clustering.hierarchical(df, k, linkage_method, features)\n            st.session_state[\"cluster_result\"] = result\n            st.session_state[\"cluster_method\"] = method_choice\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"クラスタリング中にエラーが発生しました: {e}\")\n\nresult = st.session_state.get(\"cluster_result\")\nif result is not None:\n    # ---- 警告（階層的・大規模データのサンプリングなど）----\n    for w in result.extra.get(\"warnings\", []) or []:\n        st.warning(w)\n\n    # ---- クラスタ別サマリー ----\n    st.subheader(\"クラスタ別サマリー\")\n    st.caption(\"各クラスタの件数と、特徴量ごとの平均値です。\")\n    st.dataframe(result.cluster_summary, use_container_width=True)\n\n    # ---- PCA 散布図 ----\n    if result.pca_coords is not None:\n        st.subheader(\"PCA 散布図\")\n        st.caption(\"特徴量を2次元に圧縮し、クラスタを色分けして表示します。\")\n        try:\n            fig_pca = visualizer.pca_scatter(\n                result.pca_coords, result.labels, result.pca_explained\n            )\n            st.pyplot(fig_pca)\n            c1, c2 = st.columns(2)\n            c1.download_button(\n                \"PNG をダウンロード\",\n                data=visualizer.fig_to_bytes(fig_pca, fmt=\"png\"),\n                file_name=\"pca_scatter.png\",\n                mime=\"image/png\",\n                key=\"dl_pca_png\",\n            )\n            c2.download_button(\n                \"SVG をダウンロード\",\n                data=visualizer.fig_to_bytes(fig_pca, fmt=\"svg\"),\n                file_name=\"pca_scatter.svg\",\n                mime=\"image/svg+xml\",\n                key=\"dl_pca_svg\",\n            )\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"PCA 散布図の作図に失敗しました: {e}\")\n\n    # ---- デンドログラム（階層的のみ）----\n    linkage_z = result.extra.get(\"linkage\")\n    if linkage_z is not None:\n        st.subheader(\"デンドログラム\")\n        st.caption(\"データがどのように結合されていくかを樹形図で示します。\")\n        try:\n            fig_dn = visualizer.dendrogram_plot(linkage_z)\n            st.pyplot(fig_dn)\n            c1, c2 = st.columns(2)\n            c1.download_button(\n                \"PNG をダウンロード\",\n                data=visualizer.fig_to_bytes(fig_dn, fmt=\"png\"),\n                file_name=\"dendrogram.png\",\n                mime=\"image/png\",\n                key=\"dl_dn_png\",\n            )\n            c2.download_button(\n                \"SVG をダウンロード\",\n                data=visualizer.fig_to_bytes(fig_dn, fmt=\"svg\"),\n                file_name=\"dendrogram.svg\",\n                mime=\"image/svg+xml\",\n                key=\"dl_dn_svg\",\n            )\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"デンドログラムの作図に失敗しました: {e}\")\n\n    # ---- クラスタ付きデータのダウンロード ----\n    st.subheader(\"クラスタ付きデータのダウンロード\")\n    st.caption(\"各行にクラスタ番号（cluster 列）を付けたデータです。\")\n    csv_bytes = result.df_with_clusters.to_csv(index=False).encode(\"utf-8-sig\")\n    st.download_button(\n        \"CSV をダウンロード\",\n        data=csv_bytes,\n        file_name=\"clustered_data.csv\",\n        mime=\"text/csv\",\n        key=\"dl_cluster_csv\",\n    )\n\ncommon.render_footer()\n", "pages/09_visualization.py": "\"\"\"⑨ 図表を出力する。\n\n任意の図を生成し、PNG（300dpi・共有用）と SVG（ベクター・論文投稿用）で\nダウンロードできるギャラリーページ。\n\"\"\"\nfrom __future__ import annotations\n\nimport streamlit as st\nimport pandas as pd\n\nfrom modules import common, data_loader, correlation, visualizer\nfrom exporters import excel_exporter, word_exporter, pdf_exporter  # noqa: F401\n\ndf = common.require_data()\n\nst.title(\"🎨 図表を出力する\")\nst.markdown(\n    \"各種の統計図を生成し、ダウンロードできます。\"\n    \"**PNG（300dpi）は発表・共有用**、**SVG（ベクター）は論文投稿用**に適しています。\"\n)\n\nnumeric_cols = data_loader.numeric_columns(df)\ncat_cols = data_loader.categorical_columns(df)\n\n# ---- 言語切り替え ----\nlang_label = st.radio(\"ラベル言語 / Label language\", [\"日本語\", \"English\"],\n                      horizontal=True, key=\"viz_lang\")\nlang = \"ja\" if lang_label == \"日本語\" else \"en\"\n\nchart = st.selectbox(\n    \"図の種類\",\n    [\n        \"ヒストグラム\",\n        \"箱ひげ図\",\n        \"バイオリンプロット\",\n        \"散布図+回帰直線\",\n        \"相関ヒートマップ\",\n        \"棒グラフ（エラーバー）\",\n        \"欠損値ヒートマップ\",\n    ],\n    key=\"viz_chart\",\n)\n\nfig = None\nfname = \"figure\"\n\ntry:\n    if chart == \"ヒストグラム\":\n        if not numeric_cols:\n            st.info(\"数値列がありません。\")\n        else:\n            col = st.selectbox(\"数値列\", numeric_cols, key=\"hist_col\")\n            bins = st.slider(\"ビン数\", 5, 100, 30, key=\"hist_bins\")\n            kde = st.checkbox(\"密度推定・正規分布曲線を重ねる\", value=True, key=\"hist_kde\")\n            fig = visualizer.histogram(df, col, bins=bins, kde=kde, lang=lang)\n            fname = f\"histogram_{col}\"\n\n    elif chart == \"箱ひげ図\":\n        if not numeric_cols:\n            st.info(\"数値列がありません。\")\n        else:\n            value_col = st.selectbox(\"数値列\", numeric_cols, key=\"box_val\")\n            group_col = st.selectbox(\n                \"グループ列（任意）\", [\"（なし）\"] + cat_cols, key=\"box_grp\"\n            )\n            grp = None if group_col == \"（なし）\" else group_col\n            strip = st.checkbox(\"各データ点を重ねる\", value=True, key=\"box_strip\")\n            fig = visualizer.boxplot(df, value_col, group_col=grp, strip=strip, lang=lang)\n            fname = f\"boxplot_{value_col}\"\n\n    elif chart == \"バイオリンプロット\":\n        if not numeric_cols:\n            st.info(\"数値列がありません。\")\n        else:\n            value_col = st.selectbox(\"数値列\", numeric_cols, key=\"vln_val\")\n            group_col = st.selectbox(\n                \"グループ列（任意）\", [\"（なし）\"] + cat_cols, key=\"vln_grp\"\n            )\n            grp = None if group_col == \"（なし）\" else group_col\n            fig = visualizer.violin(df, value_col, group_col=grp, lang=lang)\n            fname = f\"violin_{value_col}\"\n\n    elif chart == \"散布図+回帰直線\":\n        if len(numeric_cols) < 2:\n            st.info(\"散布図には数値列が 2 つ以上必要です。\")\n        else:\n            x_col = st.selectbox(\"x 軸（数値）\", numeric_cols, key=\"sct_x\")\n            y_candidates = [c for c in numeric_cols if c != x_col]\n            y_col = st.selectbox(\"y 軸（数値）\", y_candidates, key=\"sct_y\")\n            fig = visualizer.scatter_regression(df, x_col, y_col, lang=lang)\n            fname = f\"scatter_{x_col}_{y_col}\"\n\n    elif chart == \"相関ヒートマップ\":\n        if len(numeric_cols) < 2:\n            st.info(\"相関ヒートマップには数値列が 2 つ以上必要です。\")\n        else:\n            cols = st.multiselect(\n                \"対象とする数値列\", numeric_cols, default=numeric_cols, key=\"hm_cols\"\n            )\n            method_label = st.radio(\n                \"相関係数の種類\",\n                [\"Pearson\", \"Spearman\", \"Kendall\"],\n                horizontal=True, key=\"hm_method\",\n            )\n            method = {\"Pearson\": \"pearson\", \"Spearman\": \"spearman\",\n                      \"Kendall\": \"kendall\"}[method_label]\n            if len(cols) < 2:\n                st.info(\"2 つ以上の列を選択してください。\")\n            else:\n                corr, _ = correlation.correlation_matrix(df, method, cols)\n                fig = visualizer.correlation_heatmap(corr, lang=lang)\n                fname = \"correlation_heatmap\"\n\n    elif chart == \"棒グラフ（エラーバー）\":\n        if not cat_cols or not numeric_cols:\n            st.info(\"棒グラフにはカテゴリ列と数値列が必要です。\")\n        else:\n            group_col = st.selectbox(\"グループ列（カテゴリ）\", cat_cols, key=\"bar_grp\")\n            value_col = st.selectbox(\"数値列\", numeric_cols, key=\"bar_val\")\n            fig = visualizer.bar_with_error(df, group_col, value_col, lang=lang)\n            fname = f\"bar_{group_col}_{value_col}\"\n\n    elif chart == \"欠損値ヒートマップ\":\n        fig = visualizer.missing_heatmap(df, lang=lang)\n        fname = \"missing_heatmap\"\n\nexcept Exception as e:  # noqa: BLE001\n    st.error(f\"図の作成に失敗しました: {e}\")\n    fig = None\n\nif fig is not None:\n    st.pyplot(fig)\n    png = visualizer.fig_to_bytes(fig, fmt=\"png\")\n    svg = visualizer.fig_to_bytes(fig, fmt=\"svg\")\n    d1, d2 = st.columns(2)\n    d1.download_button(\n        \"PNG をダウンロード（300dpi・共有用）\", data=png,\n        file_name=f\"{fname}.png\", mime=\"image/png\", key=f\"dl_{fname}_png\",\n    )\n    d2.download_button(\n        \"SVG をダウンロード（ベクター・論文投稿用）\", data=svg,\n        file_name=f\"{fname}.svg\", mime=\"image/svg+xml\", key=f\"dl_{fname}_svg\",\n    )\n    st.caption(\n        \"PNG は 300dpi の高解像度ラスター画像（発表・共有向け）、\"\n        \"SVG は拡大しても劣化しないベクター画像（論文投稿向け）です。\"\n    )\n\ncommon.render_footer()\n", "sample_data/sample_experiment.csv": "﻿subject_id,group,age,gender,pre_score,post_score,region\n1,対照,53.0,女性,66.1,65.7,近畿\n2,介入,40.0,男性,37.8,41.3,北海道\n3,対照,45.0,女性,52.5,45.5,北海道\n4,対照,43.0,女性,68.2,71.8,東北\n5,介入,49.0,女性,33.5,43.8,中部\n6,対照,62.0,男性,37.2,130.0,関東\n7,対照,46.0,男性,45.8,45.5,関東\n8,対照,53.0,男性,44.8,51.3,東北\n9,介入,20.0,男性,,72.5,近畿\n10,介入,44.0,男性,52.4,66.6,東北\n11,介入,35.0,女性,32.3,40.5,北海道\n12,対照,30.0,女性,55.2,50.6,近畿\n13,対照,34.0,女性,4
