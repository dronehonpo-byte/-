      読み込むため 1〜2 分ほどかかります。そのままお待ちください。</div>

  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>
  <script>
    const files = {"app.py": "\"\"\"StatEasy — Excel/CSV 対応 自動統計解析ツール（メインエントリーポイント）。\n\n  streamlit run app.py\n\nで起動する。研究目的ベースのメニューを左サイドバーに表示する。\n\n考案：土居拓務 ／ 制作：株式会社Miyabee\n\"\"\"\nfrom __future__ import annotations\n\nimport streamlit as st\n\nfrom modules.common import load_css, render_sidebar_credit\n\nst.set_page_config(\n    page_title=\"StatEasy — 自動統計解析ツール\",\n    page_icon=\"📊\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\",\n)\n\nload_css()\n\n# ---- 研究目的ベースのナビゲーション ----\nhome = st.Page(\"pages/00_home.py\", title=\"ホーム / 使い方ガイド\", icon=\"🏠\", default=True)\nupload = st.Page(\"pages/01_upload.py\", title=\"データアップロード\", icon=\"📁\")\n\nquality = st.Page(\"pages/02_quality.py\", title=\"データ品質診断\", icon=\"🔍\")\ndescriptive = st.Page(\"pages/03_descriptive.py\", title=\"記述統計・Table 1\", icon=\"📋\")\n\nhypothesis = st.Page(\"pages/04_hypothesis.py\", title=\"群の違いを調べる\", icon=\"⚖️\")\neffect = st.Page(\"pages/05_effect.py\", title=\"効果量・信頼区間\", icon=\"📏\")\n\nregression = st.Page(\"pages/06_regression.py\", title=\"変数間の関係を調べる\", icon=\"🔗\")\nml = st.Page(\"pages/07_ml.py\", title=\"予測モデルを作る\", icon=\"🤖\")\ncluster = st.Page(\"pages/08_clustering.py\", title=\"グループに分ける\", icon=\"🧩\")\n\nvisualization = st.Page(\"pages/09_visualization.py\", title=\"図表を出力する\", icon=\"🎨\")\n\nnav = st.navigation(\n    {\n        \"はじめに\": [home, upload],\n        \"データを確認したい\": [quality, descriptive],\n        \"群の違いを調べたい\": [hypothesis, effect],\n        \"変数間の関係を調べたい\": [regression],\n        \"予測モデルを作りたい\": [ml],\n        \"グループに分けたい\": [cluster],\n        \"図表を出力する\": [visualization],\n    }\n)\n\nst.sidebar.markdown(\"## 📊 StatEasy\")\nst.sidebar.caption(\"統計の面白さを、手法名を知らなくても。\")\nrender_sidebar_credit()\n\nnav.run()\n", "modules/__init__.py": "\"\"\"StatEasy 解析モジュール群。\"\"\"\n", "modules/common.py": "\"\"\"共通ユーティリティ。\n\nStatEasy 全体で使うフッタークレジット、CSS 読み込み、日本語フォント設定、\n数値フォーマット（APA 形式の有効桁数ルール）などをまとめる。\n\n統計計算は SciPy / statsmodels / scikit-learn / pandas / NumPy のみで行い、\n生成 AI は一切利用しない（再現性の担保のため）。\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nfrom pathlib import Path\n\nimport numpy as np\n\n# クレジット表記（必ずフッターに表示する）\nCREDIT_TEXT = \"考案：土居拓務 ／ 制作：株式会社Miyabee\"\n\nROOT_DIR = Path(__file__).resolve().parent.parent\nASSETS_DIR = ROOT_DIR / \"assets\"\nSAMPLE_DIR = ROOT_DIR / \"sample_data\"\n\n# 効果量の解釈基準（Cohen 1988 ほか）\nEFFECT_SIZE_THRESHOLDS = {\n    \"d\": [(0.2, \"小 (small)\"), (0.5, \"中 (medium)\"), (0.8, \"大 (large)\")],\n    \"r\": [(0.1, \"小 (small)\"), (0.3, \"中 (medium)\"), (0.5, \"大 (large)\")],\n    \"eta2\": [(0.01, \"小 (small)\"), (0.06, \"中 (medium)\"), (0.14, \"大 (large)\")],\n    \"cramers_v\": [(0.1, \"小 (small)\"), (0.3, \"中 (medium)\"), (0.5, \"大 (large)\")],\n}\n\n\ndef setup_japanese_font() -> None:\n    \"\"\"matplotlib の日本語フォントを設定（文字化け防止）。\"\"\"\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    try:\n        import japanize_matplotlib  # noqa: F401\n    except Exception:\n        # japanize-matplotlib が無い環境でも落ちないようにする\n        import matplotlib.pyplot as plt\n\n        for cand in (\"IPAexGothic\", \"Noto Sans CJK JP\", \"TakaoGothic\", \"DejaVu Sans\"):\n            plt.rcParams[\"font.family\"] = cand\n            break\n    import matplotlib.pyplot as plt\n\n    plt.rcParams[\"axes.unicode_minus\"] = False\n    plt.rcParams[\"figure.dpi\"] = 110\n    plt.rcParams[\"savefig.dpi\"] = 300\n    plt.rcParams[\"font.size\"] = 12\n    plt.rcParams[\"axes.grid\"] = True\n    plt.rcParams[\"grid.alpha\"] = 0.25\n    plt.rcParams[\"figure.facecolor\"] = \"white\"\n    plt.rcParams[\"axes.facecolor\"] = \"white\"\n\n\ndef fmt_p(p: float) -> str:\n    \"\"\"p 値を APA 形式で整形（小数点 3 桁、< .001 表記）。\"\"\"\n    if p is None or (isinstance(p, float) and np.isnan(p)):\n        return \"—\"\n    if p < 0.001:\n        return \"< .001\"\n    return f\"{p:.3f}\".lstrip(\"0\") if p < 1 else f\"{p:.3f}\"\n\n\ndef fmt_num(x: float, digits: int = 3) -> str:\n    \"\"\"一般の数値を指定桁で整形。\"\"\"\n    if x is None or (isinstance(x, float) and (np.isnan(x) or np.isinf(x))):\n        return \"—\"\n    return f\"{x:.{digits}f}\"\n\n\ndef stars(p: float) -> str:\n    \"\"\"有意水準の星表記。\"\"\"\n    if p is None or np.isnan(p):\n        return \"\"\n    if p < 0.001:\n        return \"***\"\n    if p < 0.01:\n        return \"**\"\n    if p < 0.05:\n        return \"*\"\n    return \"n.s.\"\n\n\ndef interpret_effect(value: float, kind: str) -> str:\n    \"\"\"効果量の大きさを言葉で解釈する。\"\"\"\n    table = EFFECT_SIZE_THRESHOLDS.get(kind)\n    if table is None or value is None or np.isnan(value):\n        return \"—\"\n    av = abs(value)\n    label = \"ごく小 (negligible)\"\n    for thr, name in table:\n        if av >= thr:\n            label = name\n    return label\n\n\n# ---- Streamlit ヘルパー（import 失敗してもモジュール単体テストは可能）----\n\ndef load_css() -> None:\n    import streamlit as st\n\n    css_path = ASSETS_DIR / \"style.css\"\n    if css_path.exists():\n        st.markdown(f\"<style>{css_path.read_text(encoding='utf-8')}<\/style>\", unsafe_allow_html=True)\n\n\ndef render_footer() -> None:\n    \"\"\"全ページ共通のクレジットフッターを表示。\"\"\"\n    import streamlit as st\n\n    st.markdown(\n        f\"<div class='stateasy-footer'>{CREDIT_TEXT}<\/div>\",\n        unsafe_allow_html=True,\n    )\n\n\ndef render_sidebar_credit() -> None:\n    import streamlit as st\n\n    st.sidebar.markdown(\"---\")\n    st.sidebar.markdown(\n        \"<div style='font-size:0.8rem;color:#5A6B7B;'>考案：土居拓務<br>制作：株式会社Miyabee<\/div>\",\n        unsafe_allow_html=True,\n    )\n\n\ndef get_data():\n    \"\"\"セッションに保存された解析対象 DataFrame を取得（無ければ None）。\"\"\"\n    import streamlit as st\n\n    return st.session_state.get(\"df\")\n\n\ndef require_data():\n    \"\"\"データ未アップロード時に案内を出して停止する。\"\"\"\n    import streamlit as st\n\n    df = get_data()\n    if df is None:\n        st.warning(\"まずは「データアップロード」ページで CSV / Excel を読み込んでください。\")\n        st.page_link(\"pages/01_upload.py\", label=\"➡ データアップロードへ\", icon=\"📁\")\n        st.stop()\n    return df\n", "modules/data_loader.py": "\"\"\"① ファイル読み込み・型判定。\n\nCSV / Excel(.xlsx) に対応。文字コードは自動判定（chardet）。\n数値列に文字が混入している場合は自動で数値化を試み、変換できない値は欠損に。\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom io import BytesIO\nfrom typing import Optional\n\nimport numpy as np\nimport pandas as pd\n\nSUPPORTED_EXTENSIONS = (\".csv\", \".xlsx\", \".xls\")\n\n# 列の型ラベル\nTYPE_NUMERIC = \"数値\"\nTYPE_CATEGORICAL = \"カテゴリ\"\nTYPE_DATETIME = \"日付\"\nTYPE_TEXT = \"テキスト\"\n\n\n@dataclass\nclass LoadResult:\n    df: pd.DataFrame\n    column_types: dict = field(default_factory=dict)\n    warnings: list = field(default_factory=list)\n    encoding: Optional[str] = None\n    source_name: str = \"\"\n\n\ndef _detect_encoding(raw: bytes) -> str:\n    try:\n        import chardet\n\n        guess = chardet.detect(raw[:200_000])\n        enc = guess.get(\"encoding\") or \"utf-8\"\n        # 日本語環境でよくある誤判定の補正\n        if enc.lower() in (\"ascii\",):\n            enc = \"utf-8\"\n        return enc\n    except Exception:\n        return \"utf-8\"\n\n\ndef read_file(file_obj, filename: str) -> pd.DataFrame:\n    \"\"\"アップロードファイル（またはパス）から DataFrame を読み込む。\"\"\"\n    name = str(filename).lower()\n    if not name.endswith(SUPPORTED_EXTENSIONS):\n        raise ValueError(\n            \"サポートしていないファイル形式です。CSV (.csv) または Excel (.xlsx) を指定してください。\"\n        )\n\n    if name.endswith(\".csv\"):\n        if hasattr(file_obj, \"read\"):\n            raw = file_obj.read()\n            if isinstance(raw, str):\n                raw = raw.encode(\"utf-8\")\n        else:  # パス文字列\n            with open(file_obj, \"rb\") as fh:\n                raw = fh.read()\n        enc = _detect_encoding(raw)\n        for trial in (enc, \"utf-8-sig\", \"cp932\", \"utf-8\"):\n            try:\n                df = pd.read_csv(BytesIO(raw), encoding=trial)\n                enc = trial\n                break\n            except (UnicodeDecodeError, ValueError):\n                continue\n        else:  # すべて失敗した場合は置換読み込み\n            df = pd.read_csv(BytesIO(raw), encoding=\"utf-8\", encoding_errors=\"replace\")\n            enc = \"utf-8(replace)\"\n        df.attrs[\"encoding\"] = enc\n    else:\n        df = pd.read_excel(file_obj, engine=\"openpyxl\")\n        df.attrs[\"encoding\"] = \"xlsx\"\n    return df\n\n\ndef infer_column_type(series: pd.Series) -> str:\n    \"\"\"単一列の型を推定する。\"\"\"\n    s = series.dropna()\n    if len(s) == 0:\n        return TYPE_TEXT\n\n    if pd.api.types.is_datetime64_any_dtype(series):\n        return TYPE_DATETIME\n    if pd.api.types.is_numeric_dtype(series):\n        # 少数のユニーク値しか持たない整数はカテゴリ的だが、数値として扱う\n        return TYPE_NUMERIC\n\n    # 文字列。日付として解釈できるか試す\n    sample = s.astype(str).head(50)\n    parsed = pd.to_datetime(sample, errors=\"coerce\", format=\"mixed\")\n    if parsed.notna().mean() > 0.8:\n        return TYPE_DATETIME\n\n    # 数値に変換できるか\n    numeric = pd.to_numeric(s.astype(str).str.replace(\",\", \"\", regex=False), errors=\"coerce\")\n    if numeric.notna().mean() > 0.8:\n        return TYPE_NUMERIC\n\n    nunique = s.nunique()\n    if nunique <= max(20, int(len(s) * 0.5)):\n        return TYPE_CATEGORICAL\n    return TYPE_TEXT\n\n\ndef clean_and_type(df: pd.DataFrame) -> LoadResult:\n    \"\"\"型判定と軽いクレンジング（数値列の文字混入除去・日付変換）。\"\"\"\n    warnings: list[str] = []\n    types: dict[str, str] = {}\n    out = df.copy()\n\n    for col in out.columns:\n        t = infer_column_type(out[col])\n        if t == TYPE_NUMERIC and not pd.api.types.is_numeric_dtype(out[col]):\n            cleaned = pd.to_numeric(\n                out[col].astype(str).str.replace(\",\", \"\", regex=False), errors=\"coerce\"\n            )\n            n_bad = int(cleaned.isna().sum() - out[col].isna().sum())\n            if n_bad > 0:\n                warnings.append(\n                    f\"列『{col}』は数値列ですが、変換できない値 {n_bad} 件を欠損として除外しました。\"\n                )\n            out[col] = cleaned\n        elif t == TYPE_DATETIME and not pd.api.types.is_datetime64_any_dtype(out[col]):\n            out[col] = pd.to_datetime(out[col], errors=\"coerce\", format=\"mixed\")\n        types[col] = t\n\n    return LoadResult(\n        df=out,\n        column_types=types,\n        warnings=warnings,\n        encoding=df.attrs.get(\"encoding\"),\n    )\n\n\ndef load(file_obj, filename: str) -> LoadResult:\n    \"\"\"読み込み + 型判定 + クレンジングを一括実行する高水準 API。\"\"\"\n    df = read_file(file_obj, filename)\n    result = clean_and_type(df)\n    result.source_name = str(filename)\n    return result\n\n\ndef numeric_columns(df: pd.DataFrame) -> list[str]:\n    return [c for c in df.columns if pd.api.types.is_numeric_dtype(df[c])]\n\n\ndef categorical_columns(df: pd.DataFrame, max_levels: int = 30) -> list[str]:\n    cols = []\n    for c in df.columns:\n        if pd.api.types.is_numeric_dtype(df[c]):\n            continue\n        if pd.api.types.is_datetime64_any_dtype(df[c]):\n            continue\n        if df[c].nunique(dropna=True) <= max_levels:\n            cols.append(c)\n    return cols\n", "modules/data_quality.py": "\"\"\"① データ品質診断。\n\n欠損値レポート、外れ値候補検出（IQR / Z-score）、重複行検出、\n有効サンプルサイズ、データ形状サマリーを提供する。\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nimport pandas as pd\n\nfrom . import data_loader\n\n\n@dataclass\nclass QualityReport:\n    shape: tuple\n    missing: pd.DataFrame\n    outliers: pd.DataFrame\n    n_duplicates: int\n    duplicate_rows: pd.DataFrame\n    column_types: dict\n    valid_n: int\n    high_missing_cols: list = field(default_factory=list)\n    severity: dict = field(default_factory=dict)\n\n\ndef missing_report(df: pd.DataFrame) -> pd.DataFrame:\n    n = len(df)\n    miss = df.isna().sum()\n    rep = pd.DataFrame(\n        {\n            \"列名\": miss.index,\n            \"欠損数\": miss.values,\n            \"欠損率(%)\": (miss.values / n * 100).round(1) if n else 0,\n            \"有効数\": n - miss.values,\n        }\n    ).reset_index(drop=True)\n    return rep\n\n\ndef detect_outliers(\n    df: pd.DataFrame, iqr_k: float = 1.5, z_thresh: float = 3.0\n) -> pd.DataFrame:\n    \"\"\"数値列ごとに IQR 法・Z-score 法で外れ値候補件数を集計。\"\"\"\n    rows = []\n    for col in data_loader.numeric_columns(df):\n        s = df[col].dropna()\n        if len(s) < 4:\n            rows.append({\"列名\": col, \"IQR外れ値\": 0, \"Zスコア外れ値\": 0,\n                         \"下限\": np.nan, \"上限\": np.nan})\n            continue\n        q1, q3 = s.quantile(0.25), s.quantile(0.75)\n        iqr = q3 - q1\n        low, high = q1 - iqr_k * iqr, q3 + iqr_k * iqr\n        iqr_out = int(((s < low) | (s > high)).sum())\n\n        std = s.std(ddof=0)\n        if std > 0:\n            z = (s - s.mean()) / std\n            z_out = int((z.abs() > z_thresh).sum())\n        else:\n            z_out = 0\n\n        rows.append(\n            {\n                \"列名\": col,\n                \"IQR外れ値\": iqr_out,\n                \"Zスコア外れ値\": z_out,\n                \"下限\": round(low, 3),\n                \"上限\": round(high, 3),\n            }\n        )\n    return pd.DataFrame(rows)\n\n\ndef outlier_mask(series: pd.Series, iqr_k: float = 1.5) -> pd.Series:\n    \"\"\"IQR 法による外れ値の真偽マスク（可視化や除外に利用）。\"\"\"\n    s = series.dropna()\n    if len(s) < 4:\n        return pd.Series(False, index=series.index)\n    q1, q3 = s.quantile(0.25), s.quantile(0.75)\n    iqr = q3 - q1\n    low, high = q1 - iqr_k * iqr, q3 + iqr_k * iqr\n    return (series < low) | (series > high)\n\n\ndef diagnose(\n    df: pd.DataFrame,\n    column_types: dict | None = None,\n    iqr_k: float = 1.5,\n    z_thresh: float = 3.0,\n    high_missing_threshold: float = 50.0,\n) -> QualityReport:\n    if column_types is None:\n        column_types = {c: data_loader.infer_column_type(df[c]) for c in df.columns}\n\n    miss = missing_report(df)\n    out = detect_outliers(df, iqr_k=iqr_k, z_thresh=z_thresh)\n    dup_mask = df.duplicated(keep=\"first\")\n    n_dup = int(dup_mask.sum())\n    valid_n = int((~df.isna().any(axis=1)).sum())\n\n    high_missing = miss.loc[miss[\"欠損率(%)\"] > high_missing_threshold, \"列名\"].tolist()\n\n    # 列ごとの信号色（赤/黄/緑）\n    severity = {}\n    for _, r in miss.iterrows():\n        rate = r[\"欠損率(%)\"]\n        if rate > high_missing_threshold:\n            severity[r[\"列名\"]] = \"bad\"\n        elif rate > 10:\n            severity[r[\"列名\"]] = \"warn\"\n        else:\n            severity[r[\"列名\"]] = \"ok\"\n\n    return QualityReport(\n        shape=df.shape,\n        missing=miss,\n        outliers=out,\n        n_duplicates=n_dup,\n        duplicate_rows=df[dup_mask],\n        column_types=column_types,\n        valid_n=valid_n,\n        high_missing_cols=high_missing,\n        severity=severity,\n    )\n\n\ndef missing_hint(rate: float) -> str:\n    \"\"\"欠損率に応じた対処ヒント（教育的説明）。\"\"\"\n    if rate == 0:\n        return \"欠損はありません。\"\n    if rate < 5:\n        return \"欠損は少量です。リストワイズ削除（該当行除外）で概ね問題ありません。\"\n    if rate < 20:\n        return \"中程度の欠損です。平均値・中央値補完や多重代入の検討余地があります。\"\n    if rate <= 50:\n        return \"欠損が多めです。補完手法の選択がバイアスに影響します。慎重に。\"\n    return \"欠損が50%を超えています。この変数の利用可否を再検討してください。\"\n", "modules/descriptive_stats.py": "\"\"\"② 記述統計・Table 1 自動生成。\n\n連続変数とカテゴリ変数の記述統計、群別比較 Table（APA 形式）を生成する。\n\"\"\"\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfrom . import data_loader\n\n\ndef describe_numeric(df: pd.DataFrame, columns: list[str] | None = None) -> pd.DataFrame:\n    cols = columns or data_loader.numeric_columns(df)\n    rows = []\n    for c in cols:\n        s = df[c].dropna()\n        if len(s) == 0:\n            continue\n        rows.append(\n            {\n                \"変数\": c,\n                \"N\": int(s.count()),\n                \"平均\": round(s.mean(), 3),\n                \"標準偏差\": round(s.std(ddof=1), 3),\n                \"中央値\": round(s.median(), 3),\n                \"Q1\": round(s.quantile(0.25), 3),\n                \"Q3\": round(s.quantile(0.75), 3),\n                \"最小\": round(s.min(), 3),\n                \"最大\": round(s.max(), 3),\n                \"歪度\": round(stats.skew(s), 3),\n                \"尖度\": round(stats.kurtosis(s), 3),\n            }\n        )\n    return pd.DataFrame(rows)\n\n\ndef describe_categorical(df: pd.DataFrame, columns: list[str] | None = None) -> pd.DataFrame:\n    cols = columns or data_loader.categorical_columns(df)\n    rows = []\n    for c in cols:\n        s = df[c].dropna()\n        n = len(s)\n        if n == 0:\n            continue\n        vc = s.value_counts()\n        for level, cnt in vc.items():\n            rows.append(\n                {\n                    \"変数\": c,\n                    \"水準\": str(level),\n                    \"度数\": int(cnt),\n                    \"割合(%)\": round(cnt / n * 100, 1),\n                }\n            )\n    return pd.DataFrame(rows)\n\n\ndef table_one(\n    df: pd.DataFrame,\n    group_col: str | None = None,\n    continuous: list[str] | None = None,\n    categorical: list[str] | None = None,\n) -> pd.DataFrame:\n    \"\"\"論文用 Table 1 を生成する。\n\n    群分け変数 ``group_col`` を指定すると群別に集計し、連続変数は\n    「平均 (SD)」、カテゴリ変数は「n (%)」で表す（APA 風）。\n    \"\"\"\n    if continuous is None:\n        continuous = [c for c in data_loader.numeric_columns(df) if c != group_col]\n    if categorical is None:\n        categorical = [c for c in data_loader.categorical_columns(df) if c != group_col]\n\n    if group_col is None:\n        groups = {\"全体\": df}\n    else:\n        groups = {str(g): sub for g, sub in df.groupby(group_col, dropna=True)}\n        groups = {\"全体\": df, **groups}\n\n    rows = []\n    # サンプルサイズ行\n    size_row = {\"変数\": \"N (人数)\"}\n    for gname, gdf in groups.items():\n        size_row[gname] = f\"{len(gdf)}\"\n    rows.append(size_row)\n\n    for c in continuous:\n        row = {\"変数\": f\"{c}（平均 ± SD）\"}\n        for gname, gdf in groups.items():\n            s = gdf[c].dropna()\n            if len(s):\n                row[gname] = f\"{s.mean():.2f} ± {s.std(ddof=1):.2f}\"\n            else:\n                row[gname] = \"—\"\n        rows.append(row)\n\n    for c in categorical:\n        levels = df[c].dropna().unique()\n        rows.append({\"変数\": f\"{c} — n (%)\", **{g: \"\" for g in groups}})\n        for lv in levels:\n            row = {\"変数\": f\"　{lv}\"}\n            for gname, gdf in groups.items():\n                sub = gdf[c].dropna()\n                n = len(sub)\n                cnt = int((sub == lv).sum())\n                row[gname] = f\"{cnt} ({cnt / n * 100:.1f}%)\" if n else \"—\"\n            rows.append(row)\n\n    return pd.DataFrame(rows)\n", "modules/hypothesis_test.py": "\"\"\"③ 仮説検定の自動選択・実行。\n\n群数・正規性・対応の有無・期待度数に基づいて適切な検定を自動選択し、\n「なぜこの検定を選んだか」の理由（教育目的）を必ず添えて結果を返す。\n\nすべて SciPy / statsmodels で計算（生成 AI 不使用、再現性を担保）。\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfrom . import effect_size\n\n\n@dataclass\nclass TestResult:\n    test_name: str\n    reason: str  # なぜこの検定を選んだか\n    statistic: float\n    pvalue: float\n    dof: object = None\n    assumptions: dict = field(default_factory=dict)\n    effect: object = None  # effect_size.EffectResult\n    posthoc: object = None  # pandas.DataFrame or None\n    n_groups: int = 0\n    extra: dict = field(default_factory=dict)\n\n\ndef check_normality(values, alpha: float = 0.05) -> dict:\n    \"\"\"Shapiro-Wilk 検定で正規性を確認。\"\"\"\n    v = np.asarray(values, dtype=float)\n    v = v[~np.isnan(v)]\n    if len(v) < 3:\n        return {\"test\": \"Shapiro-Wilk\", \"p\": np.nan, \"normal\": False,\n                \"note\": \"サンプルが少なすぎて正規性を判定できません。\"}\n    if len(v) > 5000:\n        v = np.random.default_rng(42).choice(v, 5000, replace=False)\n    try:\n        w, p = stats.shapiro(v)\n    except Exception:\n        return {\"test\": \"Shapiro-Wilk\", \"p\": np.nan, \"normal\": False, \"note\": \"判定不能\"}\n    return {\"test\": \"Shapiro-Wilk\", \"statistic\": float(w), \"p\": float(p),\n            \"normal\": bool(p > alpha)}\n\n\ndef check_equal_variance(groups, alpha: float = 0.05) -> dict:\n    \"\"\"Levene 検定で等分散性を確認。\"\"\"\n    arrays = [np.asarray(g, dtype=float) for g in groups]\n    arrays = [a[~np.isnan(a)] for a in arrays]\n    arrays = [a for a in arrays if len(a) >= 2]\n    if len(arrays) < 2:\n        return {\"test\": \"Levene\", \"p\": np.nan, \"equal\": True, \"note\": \"判定不能\"}\n    stat, p = stats.levene(*arrays)\n    return {\"test\": \"Levene\", \"statistic\": float(stat), \"p\": float(p),\n            \"equal\": bool(p > alpha)}\n\n\ndef compare_groups(\n    df: pd.DataFrame,\n    value_col: str,\n    group_col: str,\n    paired: bool = False,\n    alpha: float = 0.05,\n    use_bootstrap: bool = False,\n) -> TestResult:\n    \"\"\"群間で連続変数を比較する。検定は自動選択する。\"\"\"\n    sub = df[[value_col, group_col]].dropna()\n    group_labels = list(sub[group_col].unique())\n    n_groups = len(group_labels)\n    if n_groups < 2:\n        raise ValueError(\"比較するには群が2つ以上必要です。\")\n\n    groups = [sub.loc[sub[group_col] == g, value_col].to_numpy(dtype=float)\n              for g in group_labels]\n    for g, lab in zip(groups, group_labels):\n        if len(g) < 3:\n            raise ValueError(f\"群『{lab}』のサンプルが少なすぎます (n={len(g)})。各群 n≥3 が必要です。\")\n\n    # 正規性は各群で判定し、全群正規なら「正規性あり」とみなす\n    normality = {str(lab): check_normality(g, alpha) for lab, g in zip(group_labels, groups)}\n    all_normal = all(r.get(\"normal\") for r in normality.values())\n\n    if n_groups == 2:\n        return _two_group(groups, group_labels, normality, all_normal, paired, alpha, use_bootstrap)\n    return _multi_group(groups, group_labels, sub, value_col, group_col,\n                        normality, all_normal, alpha)\n\n\ndef _two_group(groups, labels, normality, all_normal, paired, alpha, use_bootstrap) -> TestResult:\n    a, b = groups[0], groups[1]\n    assumptions = {\"normality\": normality}\n\n    if all_normal:\n        if paired:\n            n = min(len(a), len(b))\n            stat, p = stats.ttest_rel(a[:n], b[:n])\n            name = \"対応のある t 検定 (paired t-test)\"\n            reason = (\"2群・正規性あり（Shapiro-Wilk p>{:.2f}）・対応ありのため、\"\n                      \"対応のある t 検定を選択しました。\".format(alpha))\n            dof = n - 1\n        else:\n            lev = check_equal_variance(groups, alpha)\n            assumptions[\"equal_variance\"] = lev\n            equal = lev.get(\"equal\", True)\n            stat, p = stats.ttest_ind(a, b, equal_var=equal)\n            if equal:\n                name = \"独立2標本 t 検定 (Student's t-test)\"\n                reason = (\"2群・正規性あり・対応なし、かつ等分散（Levene p>{:.2f}）のため、\"\n                          \"通常の独立2標本 t 検定を選択しました。\".format(alpha))\n            else:\n                name = \"Welch の t 検定 (不等分散)\"\n                reason = (\"2群・正規性あり・対応なしですが、等分散性が棄却された\"\n                          \"（Levene p≦{:.2f}）ため、Welch の t 検定を選択しました。\".format(alpha))\n            dof = len(a) + len(b) - 2\n        effect = effect_size.two_group_effect(a, b, paired=paired, use_bootstrap=use_bootstrap)\n    else:\n        if paired:\n            n = min(len(a), len(b))\n            stat, p = stats.wilcoxon(a[:n], b[:n])\n            name = \"Wilcoxon 符号順位検定\"\n            reason = (\"2群・正規性なし・対応ありのため、ノンパラメトリックな\"\n                      \"Wilcoxon 符号順位検定を選択しました。\")\n            dof = None\n        else:\n            stat, p = stats.mannwhitneyu(a, b, alternative=\"two-sided\")\n            name = \"Mann-Whitney U 検定\"\n            reason = (\"2群・正規性なし・対応なしのため、ノンパラメトリックな\"\n                      \"Mann-Whitney U 検定を選択しました。\")\n            dof = None\n        effect = effect_size.two_group_effect(a, b, paired=paired, use_bootstrap=use_bootstrap)\n\n    return TestResult(\n        test_name=name, reason=reason, statistic=float(stat), pvalue=float(p),\n        dof=dof, assumptions=assumptions, effect=effect, n_groups=2,\n    )\n\n\ndef _multi_group(groups, labels, sub, value_col, group_col, normality, all_normal, alpha) -> TestResult:\n    assumptions = {\"normality\": normality}\n    posthoc = None\n    if all_normal:\n        lev = check_equal_variance(groups, alpha)\n        assumptions[\"equal_variance\"] = lev\n        stat, p = stats.f_oneway(*groups)\n        name = \"一元配置分散分析 (one-way ANOVA)\"\n        reason = (\"3群以上・正規性ありのため、一元配置分散分析を選択しました。\"\n                  \"有意な場合は Tukey HSD による多重比較を行います。\")\n        dof = (len(groups) - 1, sum(len(g) for g in groups) - len(groups))\n        if p < alpha:\n            posthoc = _tukey(sub, value_col, group_col)\n        effect = effect_size.anova_effect(groups)\n    else:\n        stat, p = stats.kruskal(*groups)\n        name = \"Kruskal-Wallis 検定\"\n        reason = (\"3群以上・正規性なしのため、ノンパラメトリックな Kruskal-Wallis 検定を\"\n                  \"選択しました。有意な場合は Dunn 検定で多重比較します。\")\n        dof = len(groups) - 1\n        if p < alpha:\n            posthoc = _dunn(groups, labels)\n        effect = effect_size.anova_effect(groups)\n\n    return TestResult(\n        test_name=name, reason=reason, statistic=float(stat), pvalue=float(p),\n        dof=dof, assumptions=assumptions, effect=effect, posthoc=posthoc,\n        n_groups=len(groups),\n    )\n\n\ndef _tukey(sub, value_col, group_col):\n    from statsmodels.stats.multicomp import pairwise_tukeyhsd\n\n    res = pairwise_tukeyhsd(sub[value_col], sub[group_col])\n    return pd.DataFrame(res.summary().data[1:], columns=res.summary().data[0])\n\n\ndef _dunn(groups, labels):\n    \"\"\"Dunn 検定（Bonferroni 補正）を SciPy ベースで実装。\"\"\"\n    from itertools import combinations\n\n    all_vals = np.concatenate(groups)\n    ranks = stats.rankdata(all_vals)\n    n = len(all_vals)\n    idx = 0\n    group_ranks = []\n    for g in groups:\n        group_ranks.append(ranks[idx: idx + len(g)])\n        idx += len(g)\n    mean_ranks = [r.mean() for r in group_ranks]\n    sizes = [len(g) for g in groups]\n\n    # tie 補正\n    _, counts = np.unique(all_vals, return_counts=True)\n    tie_term = (counts ** 3 - counts).sum()\n    sigma2 = (n * (n + 1) / 12.0) - tie_term / (12.0 * (n - 1))\n\n    rows = []\n    n_comp = len(list(combinations(range(len(groups)), 2)))\n    for i, j in combinations(range(len(groups)), 2):\n        diff = abs(mean_ranks[i] - mean_ranks[j])\n        se = np.sqrt(sigma2 * (1 / sizes[i] + 1 / sizes[j]))\n        z = diff / se if se > 0 else 0.0\n        p = 2 * (1 - stats.norm.cdf(abs(z)))\n        rows.append(\n            {\n                \"群1\": str(labels[i]),\n                \"群2\": str(labels[j]),\n                \"z値\": round(z, 3),\n                \"p値\": round(p, 4),\n                \"p値(Bonferroni)\": round(min(1.0, p * n_comp), 4),\n                \"有意(α=0.05)\": \"はい\" if p * n_comp < 0.05 else \"いいえ\",\n            }\n        )\n    return pd.DataFrame(rows)\n\n\ndef categorical_test(df: pd.DataFrame, col1: str, col2: str, alpha: float = 0.05) -> TestResult:\n    \"\"\"2つのカテゴリ変数の関連を検定（カイ二乗 / Fisher 自動選択）。\"\"\"\n    table = pd.crosstab(df[col1], df[col2])\n    chi2, p, dof, expected = stats.chi2_contingency(table)\n    min_expected = expected.min()\n    assumptions = {\"min_expected_freq\": float(min_expected),\n                   \"table_shape\": table.shape}\n\n    if min_expected >= 5:\n        name = \"カイ二乗検定 (chi-squared test)\"\n        reason = (\"すべてのセルで期待度数が5以上のため、カイ二乗検定を選択しました。\")\n        stat, pval = float(chi2), float(p)\n    else:\n        if table.shape == (2, 2):\n            odds, pval = stats.fisher_exact(table)\n            name = \"Fisher の正確確率検定\"\n            reason = (\"期待度数が5未満のセルがあり（最小={:.2f}）、表が2×2のため、\"\n                      \"Fisher の正確確率検定を選択しました。\".format(min_expected))\n            stat = float(odds)\n        else:\n            # 2×2 より大きく期待度数が小さい場合はカイ二乗（補正付き）で代替\n            name = \"カイ二乗検定（期待度数小・要注意）\"\n            reason = (\"期待度数が5未満のセルがありますが、表が2×2より大きいため\"\n                      \"カイ二乗検定で代替します。結果の解釈には注意してください。\")\n            stat, pval = float(chi2), float(p)\n\n    effect = effect_size.chi2_effect(table.to_numpy())\n    return TestResult(\n        test_name=name, reason=reason, statistic=stat, pvalue=pval, dof=dof,\n        assumptions=assumptions, effect=effect,\n        extra={\"crosstab\": table, \"expected\": pd.DataFrame(\n            expected, index=table.index, columns=table.columns)},\n    )\n", "modules/effect_size.py": "\"\"\"④ 効果量・信頼区間の自動計算。\n\nCohen's d / Hedges' g / η² / partial η² / Cramer's V と、\n各種 95% 信頼区間（解析的 + bootstrap）を提供する。\nすべて SciPy / NumPy のみで計算（生成 AI 不使用）。\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport numpy as np\nfrom scipy import stats\n\nfrom .common import interpret_effect\n\n\n@dataclass\nclass EffectResult:\n    name: str\n    value: float\n    ci_low: float\n    ci_high: float\n    interpretation: str\n    comment: str = \"\"\n\n\ndef cohens_d(a, b) -> float:\n    \"\"\"独立2群の Cohen's d（プールされた標準偏差を使用）。\"\"\"\n    a = np.asarray(a, dtype=float)\n    a = a[~np.isnan(a)]\n    b = np.asarray(b, dtype=float)\n    b = b[~np.isnan(b)]\n    n1, n2 = len(a), len(b)\n    if n1 < 2 or n2 < 2:\n        return np.nan\n    s_pooled = np.sqrt(((n1 - 1) * a.var(ddof=1) + (n2 - 1) * b.var(ddof=1)) / (n1 + n2 - 2))\n    if s_pooled == 0:\n        return np.nan\n    return (a.mean() - b.mean()) / s_pooled\n\n\ndef hedges_g(a, b) -> float:\n    \"\"\"小サンプル補正版 Cohen's d。\"\"\"\n    d = cohens_d(a, b)\n    a = np.asarray(a, dtype=float); a = a[~np.isnan(a)]\n    b = np.asarray(b, dtype=float); b = b[~np.isnan(b)]\n    n = len(a) + len(b)\n    if n <= 2 or np.isnan(d):\n        return np.nan\n    correction = 1 - (3 / (4 * (n) - 9))\n    return d * correction\n\n\ndef cohens_d_paired(a, b) -> float:\n    \"\"\"対応のある2群の Cohen's d（差分の標準偏差を使用）。\"\"\"\n    a = np.asarray(a, dtype=float)\n    b = np.asarray(b, dtype=float)\n    mask = ~(np.isnan(a) | np.isnan(b))\n    diff = a[mask] - b[mask]\n    if len(diff) < 2 or diff.std(ddof=1) == 0:\n        return np.nan\n    return diff.mean() / diff.std(ddof=1)\n\n\ndef eta_squared(groups: list) -> float:\n    \"\"\"一元配置 ANOVA の η²（SS_between / SS_total）。\"\"\"\n    arrays = [np.asarray(g, dtype=float) for g in groups]\n    arrays = [a[~np.isnan(a)] for a in arrays]\n    grand = np.concatenate(arrays)\n    grand_mean = grand.mean()\n    ss_total = ((grand - grand_mean) ** 2).sum()\n    ss_between = sum(len(a) * (a.mean() - grand_mean) ** 2 for a in arrays)\n    if ss_total == 0:\n        return np.nan\n    return ss_between / ss_total\n\n\ndef partial_eta_squared(groups: list) -> float:\n    \"\"\"一元配置 ANOVA の partial η²（偏イータ二乗）。\n\n    partial η² = SS_between / (SS_between + SS_within)。\n    一元配置では SS_total = SS_between + SS_within のため η² と一致するが、\n    多元配置への一般化を見据えて別関数として提供する。\n    \"\"\"\n    arrays = [np.asarray(g, dtype=float) for g in groups]\n    arrays = [a[~np.isnan(a)] for a in arrays]\n    grand = np.concatenate(arrays)\n    grand_mean = grand.mean()\n    ss_between = sum(len(a) * (a.mean() - grand_mean) ** 2 for a in arrays)\n    ss_within = sum(((a - a.mean()) ** 2).sum() for a in arrays)\n    denom = ss_between + ss_within\n    if denom == 0:\n        return np.nan\n    return ss_between / denom\n\n\ndef cramers_v(confusion: np.ndarray) -> float:\n    \"\"\"カテゴリ変数の Cramer's V（バイアス補正版）。\"\"\"\n    confusion = np.asarray(confusion, dtype=float)\n    chi2 = stats.chi2_contingency(confusion, correction=False)[0]\n    n = confusion.sum()\n    if n == 0:\n        return np.nan\n    phi2 = chi2 / n\n    r, k = confusion.shape\n    phi2corr = max(0, phi2 - (k - 1) * (r - 1) / (n - 1))\n    rcorr = r - (r - 1) ** 2 / (n - 1)\n    kcorr = k - (k - 1) ** 2 / (n - 1)\n    denom = min(kcorr - 1, rcorr - 1)\n    if denom <= 0:\n        return np.nan\n    return np.sqrt(phi2corr / denom)\n\n\ndef bootstrap_ci(a, b, statistic, n_boot: int = 2000, seed: int = 42, alpha: float = 0.05):\n    \"\"\"2群の効果量に対する bootstrap 信頼区間（パーセンタイル法）。\"\"\"\n    rng = np.random.default_rng(seed)\n    a = np.asarray(a, dtype=float); a = a[~np.isnan(a)]\n    b = np.asarray(b, dtype=float); b = b[~np.isnan(b)]\n    if len(a) < 2 or len(b) < 2:\n        return (np.nan, np.nan)\n    estimates = np.empty(n_boot)\n    for i in range(n_boot):\n        sa = rng.choice(a, size=len(a), replace=True)\n        sb = rng.choice(b, size=len(b), replace=True)\n        estimates[i] = statistic(sa, sb)\n    lo = np.nanpercentile(estimates, 100 * alpha / 2)\n    hi = np.nanpercentile(estimates, 100 * (1 - alpha / 2))\n    return (lo, hi)\n\n\ndef cohens_d_ci(a, b, alpha: float = 0.05):\n    \"\"\"Cohen's d の解析的近似信頼区間（正規近似）。\"\"\"\n    a = np.asarray(a, dtype=float); a = a[~np.isnan(a)]\n    b = np.asarray(b, dtype=float); b = b[~np.isnan(b)]\n    n1, n2 = len(a), len(b)\n    d = cohens_d(a, b)\n    if np.isnan(d) or n1 < 2 or n2 < 2:\n        return (np.nan, np.nan)\n    se = np.sqrt((n1 + n2) / (n1 * n2) + d ** 2 / (2 * (n1 + n2)))\n    z = stats.norm.ppf(1 - alpha / 2)\n    return (d - z * se, d + z * se)\n\n\ndef two_group_effect(a, b, paired: bool = False, use_bootstrap: bool = False) -> EffectResult:\n    \"\"\"2群比較の効果量（Hedges' g を主指標に）をまとめて返す。\"\"\"\n    if paired:\n        d = cohens_d_paired(a, b)\n        g = d  # 対応ありは補正を簡略化\n        name = \"Cohen's d (対応あり)\"\n    else:\n        g = hedges_g(a, b)\n        name = \"Hedges' g\"\n    if use_bootstrap:\n        stat_fn = (lambda x, y: cohens_d_paired(x, y)) if paired else hedges_g\n        lo, hi = bootstrap_ci(a, b, stat_fn)\n    else:\n        lo, hi = cohens_d_ci(a, b)\n    value = g\n    interp = interpret_effect(value, \"d\")\n    comment = _pval_effect_comment(interp)\n    return EffectResult(name, value, lo, hi, interp, comment)\n\n\ndef anova_effect(groups: list) -> EffectResult:\n    eta = eta_squared(groups)\n    p_eta = partial_eta_squared(groups)\n    interp = interpret_effect(eta, \"eta2\")\n    comment = _pval_effect_comment(interp)\n    comment += f\"（partial η² = {p_eta:.3f}）\" if not np.isnan(p_eta) else \"\"\n    res = EffectResult(\"η² (イータ二乗)\", eta, np.nan, np.nan, interp, comment)\n    res.partial_eta2 = p_eta\n    return res\n\n\ndef chi2_effect(confusion: np.ndarray) -> EffectResult:\n    v = cramers_v(confusion)\n    interp = interpret_effect(v, \"cramers_v\")\n    return EffectResult(\"Cramer's V\", v, np.nan, np.nan, interp,\n                        _pval_effect_comment(interp))\n\n\ndef _pval_effect_comment(interp: str) -> str:\n    if interp.startswith(\"ごく小\") or interp.startswith(\"小\"):\n        return (\"効果量は小さめです。p 値が有意でも、実質的な差は小さい可能性があります\"\n                \"（サンプルサイズが大きいと小さな差でも有意になりがちです）。\")\n    if interp.startswith(\"中\"):\n        return \"中程度の効果量です。実質的にも意味のある差と考えられます。\"\n    return \"効果量が大きく、実質的にも明確な差があると解釈できます。\"\n", "modules/correlation.py": "\"\"\"⑤ 相関分析・回帰分析。\n\n相関行列（Pearson/Spearman/Kendall）、線形回帰（単/重）、ロジスティック回帰、\nVIF、残差診断などを statsmodels / scipy / sklearn で計算する。\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfrom . import data_loader\n\n\n# ----------------------------- 相関 -----------------------------\n\ndef correlation_matrix(df: pd.DataFrame, method: str = \"pearson\",\n                       columns: list[str] | None = None):\n    \"\"\"相関係数行列と p 値行列を返す。\"\"\"\n    cols = columns or data_loader.numeric_columns(df)\n    data = df[cols].dropna()\n    corr = data.corr(method=method)\n\n    pvals = pd.DataFrame(np.ones((len(cols), len(cols))), index=cols, columns=cols)\n    for i, a in enumerate(cols):\n        for j, b in enumerate(cols):\n            if i >= j:\n                continue\n            x, y = data[a], data[b]\n            if method == \"pearson\":\n                _, p = stats.pearsonr(x, y)\n            elif method == \"spearman\":\n                _, p = stats.spearmanr(x, y)\n            else:\n                _, p = stats.kendalltau(x, y)\n            pvals.iloc[i, j] = pvals.iloc[j, i] = p\n    return corr, pvals\n\n\n# --------------------------- 線形回帰 ---------------------------\n\n@dataclass\nclass RegressionResult:\n    kind: str\n    summary_table: pd.DataFrame\n    fit_stats: dict\n    vif: pd.DataFrame = None\n    diagnostics: dict = field(default_factory=dict)\n    model: object = None\n    warnings: list = field(default_factory=list)\n\n\ndef linear_regression(df: pd.DataFrame, y_col: str, x_cols: list[str],\n                      standardize_beta: bool = True) -> RegressionResult:\n    import statsmodels.api as sm\n    from statsmodels.stats.stattools import durbin_watson\n\n    data = df[[y_col] + list(x_cols)].dropna()\n    y = data[y_col].astype(float)\n    X = data[x_cols].astype(float)\n    X_const = sm.add_constant(X)\n    model = sm.OLS(y, X_const).fit()\n\n    # 標準化係数 β\n    betas = {}\n    if standardize_beta:\n        sy = y.std(ddof=1)\n        for c in x_cols:\n            sx = X[c].std(ddof=1)\n            betas[c] = model.params[c] * sx / sy if sy else np.nan\n\n    rows = []\n    for name in model.params.index:\n        ci = model.conf_int().loc[name]\n        rows.append(\n            {\n                \"項\": name,\n                \"係数 B\": round(model.params[name], 4),\n                \"標準化β\": round(betas.get(name, np.nan), 4) if name != \"const\" else np.nan,\n                \"標準誤差\": round(model.bse[name], 4),\n                \"t値\": round(model.tvalues[name], 3),\n                \"p値\": model.pvalues[name],\n                \"95%CI下限\": round(ci[0], 4),\n                \"95%CI上限\": round(ci[1], 4),\n            }\n        )\n    summary_table = pd.DataFrame(rows)\n\n    fit_stats = {\n        \"R²\": round(model.rsquared, 4),\n        \"調整済みR²\": round(model.rsquared_adj, 4),\n        \"F統計量\": round(model.fvalue, 3),\n        \"F検定p値\": model.f_pvalue,\n        \"AIC\": round(model.aic, 2),\n        \"BIC\": round(model.bic, 2),\n        \"N\": int(model.nobs),\n    }\n\n    vif = compute_vif(X) if len(x_cols) > 1 else None\n    warnings = []\n    if vif is not None and (vif[\"VIF\"] > 10).any():\n        bad = vif.loc[vif[\"VIF\"] > 10, \"変数\"].tolist()\n        warnings.append(\n            f\"多重共線性の懸念: VIF>10 の変数があります（{', '.join(bad)}）。\"\n            \"変数の見直し（除外・統合）を検討してください。\"\n        )\n\n    diagnostics = {\n        \"durbin_watson\": round(durbin_watson(model.resid), 3),\n        \"residuals\": model.resid,\n        \"fitted\": model.fittedvalues,\n    }\n\n    return RegressionResult(\"linear\", summary_table, fit_stats, vif, diagnostics,\n                            model, warnings)\n\n\ndef compute_vif(X: pd.DataFrame) -> pd.DataFrame:\n    from statsmodels.stats.outliers_influence import variance_inflation_factor\n    import statsmodels.api as sm\n\n    Xc = sm.add_constant(X.astype(float))\n    rows = []\n    for i, col in enumerate(Xc.columns):\n        if col == \"const\":\n            continue\n        rows.append({\"変数\": col, \"VIF\": round(variance_inflation_factor(Xc.values, i), 3)})\n    return pd.DataFrame(rows)\n\n\n# ------------------------ ロジスティック回帰 ------------------------\n\ndef logistic_regression(df: pd.DataFrame, y_col: str, x_cols: list[str]) -> RegressionResult:\n    import statsmodels.api as sm\n    from sklearn.metrics import roc_auc_score, roc_curve, confusion_matrix\n\n    data = df[[y_col] + list(x_cols)].dropna()\n    y_raw = data[y_col]\n    # 2値化（カテゴリなら最初の水準を 0 とする）\n    classes = sorted(y_raw.unique(), key=lambda v: str(v))\n    if len(classes) != 2:\n        raise ValueError(\"ロジスティック回帰は2値の目的変数が必要です。\")\n    mapping = {classes[0]: 0, classes[1]: 1}\n    y = y_raw.map(mapping).astype(int)\n    X = sm.add_constant(data[x_cols].astype(float))\n    model = sm.Logit(y, X).fit(disp=False)\n\n    rows = []\n    conf = model.conf_int()\n    for name in model.params.index:\n        coef = model.params[name]\n        rows.append(\n            {\n                \"項\": name,\n                \"係数\": round(coef, 4),\n                \"オッズ比\": round(np.exp(coef), 4),\n                \"OR 95%CI下限\": round(np.exp(conf.loc[name][0]), 4),\n                \"OR 95%CI上限\": round(np.exp(conf.loc[name][1]), 4),\n                \"p値\": model.pvalues[name],\n            }\n        )\n    summary_table = pd.DataFrame(rows)\n\n    prob = model.predict(X)\n    auc = roc_auc_score(y, prob)\n    fpr, tpr, _ = roc_curve(y, prob)\n    pred = (prob >= 0.5).astype(int)\n    cm = confusion_matrix(y, pred)\n\n    fit_stats = {\n        \"疑似R² (McFadden)\": round(model.prsquared, 4),\n        \"AIC\": round(model.aic, 2),\n        \"BIC\": round(model.bic, 2),\n        \"AUC\": round(auc, 4),\n        \"N\": int(model.nobs),\n    }\n    diagnostics = {\n        \"roc\": (fpr, tpr),\n        \"auc\": auc,\n        \"confusion_matrix\": cm,\n        \"classes\": classes,\n        \"hosmer_lemeshow\": hosmer_lemeshow(y.to_numpy(), prob.to_numpy()),\n    }\n    return RegressionResult(\"logistic\", summary_table, fit_stats, None, diagnostics, model)\n\n\ndef hosmer_lemeshow(y_true, y_prob, g: int = 10) -> dict:\n    \"\"\"Hosmer-Lemeshow 適合度検定。\"\"\"\n    order = np.argsort(y_prob)\n    y_true = np.asarray(y_true)[order]\n    y_prob = np.asarray(y_prob)[order]\n    n = len(y_true)\n    g = min(g, max(2, n // 5))\n    bins = np.array_split(np.arange(n), g)\n    hl = 0.0\n    for b in bins:\n        if len(b) == 0:\n            continue\n        obs = y_true[b].sum()\n        exp = y_prob[b].sum()\n        n_b = len(b)\n        if 0 < exp < n_b:\n            hl += (obs - exp) ** 2 / (exp * (1 - exp / n_b))\n    dof = max(1, g - 2)\n    p = 1 - stats.chi2.cdf(hl, dof)\n    return {\"statistic\": round(hl, 3), \"dof\": dof, \"p\": float(p)}\n\n\n# ------------------------ 変数変換補助 ------------------------\n\ndef add_transformations(df: pd.DataFrame, col: str, kinds: list[str]) -> pd.DataFrame:\n    \"\"\"指定列に対数・二乗・平方根などの変換列を追加した DataFrame を返す。\"\"\"\n    out = df.copy()\n    s = out[col].astype(float)\n    if \"log\" in kinds:\n        out[f\"log_{col}\"] = np.log(s.where(s > 0))\n    if \"square\" in kinds:\n        out[f\"sq_{col}\"] = s ** 2\n    if \"sqrt\" in kinds:\n        out[f\"sqrt_{col}\"] = np.sqrt(s.where(s >= 0))\n    return out\n\n\ndef add_interaction(df: pd.DataFrame, col1: str, col2: str) -> pd.DataFrame:\n    \"\"\"2 つの数値列の交互作用項（積）を追加した DataFrame を返す。\"\"\"\n    out = df.copy()\n    out[f\"{col1}×{col2}\"] = out[col1].astype(float) * out[col2].astype(float)\n    return out\n\n\ndef compare_models_fit(results: dict) -> pd.DataFrame:\n    \"\"\"複数モデルの AIC/BIC/R² 比較表（変換前後比較用）。\"\"\"\n    rows = []\n    for label, res in results.items():\n        rows.append(\n            {\n                \"モデル\": label,\n                \"R²\": res.fit_stats.get(\"R²\"),\n                \"調整済みR²\": res.fit_stats.get(\"調整済みR²\"),\n                \"AIC\": res.fit_stats.get(\"AIC\"),\n                \"BIC\": res.fit_stats.get(\"BIC\"),\n            }\n        )\n    return pd.DataFrame(rows)\n", "modules/ml_compare.py": "\"\"\"⑥ 機械学習モデルの自動比較。\n\n目的変数の型から分類/回帰を自動判定し、複数モデルを k-fold 交差検証で比較する。\nすべて scikit-learn / xgboost で計算（生成 AI 不使用）。\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nimport pandas as pd\n\nfrom . import data_loader\n\nLARGE_DATA_THRESHOLD = 100_000\nSUBSAMPLE_N = 20_000\n\n\n@dataclass\nclass MLResult:\n    mode: str  # \"classification\" or \"regression\"\n    comparison: pd.DataFrame\n    best_model_name: str\n    feature_importance: pd.DataFrame = None\n    roc_data: dict = field(default_factory=dict)  # model_name -> (fpr, tpr, auc)\n    warnings: list = field(default_factory=list)\n    target: str = \"\"\n    confusion_matrix: object = None  # 最優秀モデルの混同行列 (ndarray)\n    confusion_labels: list = field(default_factory=list)\n\n\ndef detect_mode(y: pd.Series) -> str:\n    if pd.api.types.is_numeric_dtype(y) and y.nunique() > 10:\n        return \"regression\"\n    return \"classification\"\n\n\ndef _build_models(mode: str):\n    from sklearn.ensemble import RandomForestClassifier, RandomForestRegressor\n    from sklearn.linear_model import LogisticRegression, Ridge\n    from sklearn.svm import SVC, SVR\n    from sklearn.neighbors import KNeighborsClassifier, KNeighborsRegressor\n\n    models = {}\n    if mode == \"classification\":\n        models[\"Random Forest\"] = RandomForestClassifier(n_estimators=200, random_state=42)\n        models[\"Logistic Regression\"] = LogisticRegression(max_iter=1000)\n        models[\"SVM\"] = SVC(probability=True, random_state=42)\n        models[\"K-Nearest Neighbors\"] = KNeighborsClassifier()\n        try:\n            from xgboost import XGBClassifier\n\n            models[\"XGBoost\"] = XGBClassifier(\n                n_estimators=200, eval_metric=\"logloss\", random_state=42, verbosity=0\n            )\n        except Exception:\n            pass\n    else:\n        models[\"Random Forest\"] = RandomForestRegressor(n_estimators=200, random_state=42)\n        models[\"Ridge Regression\"] = Ridge()\n        models[\"SVM\"] = SVR()\n        models[\"K-Nearest Neighbors\"] = KNeighborsRegressor()\n        try:\n            from xgboost import XGBRegressor\n\n            models[\"XGBoost\"] = XGBRegressor(n_estimators=200, random_state=42, verbosity=0)\n        except Exception:\n            pass\n    return models\n\n\ndef compare(\n    df: pd.DataFrame,\n    target: str,\n    features: list[str] | None = None,\n    k: int = 5,\n    mode: str | None = None,\n    allow_subsample: bool = True,\n) -> MLResult:\n    from sklearn.model_selection import cross_validate, StratifiedKFold, KFold\n    from sklearn.preprocessing import StandardScaler, LabelEncoder\n    from sklearn.pipeline import Pipeline\n\n    warnings: list[str] = []\n    data = df.dropna(subset=[target]).copy()\n\n    if features is None:\n        features = [c for c in data_loader.numeric_columns(df) if c != target]\n    if not features:\n        raise ValueError(\"特徴量となる数値列がありません。\")\n\n    data = data.dropna(subset=features)\n\n    if len(data) > LARGE_DATA_THRESHOLD and allow_subsample:\n        warnings.append(\n            f\"データが大規模（{len(data):,}行）のため、{SUBSAMPLE_N:,}行にサブサンプリングして実行しました。\"\n        )\n        data = data.sample(SUBSAMPLE_N, random_state=42)\n\n    y = data[target]\n    X = data[features].astype(float)\n\n    if mode is None:\n        mode = detect_mode(y)\n\n    if mode == \"classification\":\n        y_enc = LabelEncoder().fit_transform(y.astype(str))\n        scoring = [\"accuracy\", \"precision_macro\", \"recall_macro\", \"f1_macro\", \"roc_auc_ovr\"]\n        cv = StratifiedKFold(n_splits=k, shuffle=True, random_state=42)\n    else:\n        y_enc = y.astype(float).to_numpy()\n        scoring = [\"neg_root_mean_squared_error\", \"neg_mean_absolute_error\", \"r2\"]\n        cv = KFold(n_splits=k, shuffle=True, random_state=42)\n\n    models = _build_models(mode)\n    rows = []\n    for name, est in models.items():\n        pipe = Pipeline([(\"scaler\", StandardScaler()), (\"model\", est)])\n        try:\n            cvres = cross_validate(\n                pipe, X, y_enc, cv=cv, scoring=scoring, return_train_score=True,\n                error_score=\"raise\",\n            )\n        except Exception as exc:  # noqa: BLE001\n            warnings.append(f\"{name} は評価できませんでした: {exc}\")\n            continue\n        row = {\"モデル\": name}\n        if mode == \"classification\":\n            row[\"AUC\"] = round(np.nanmean(cvres[\"test_roc_auc_ovr\"]), 4)\n            row[\"Accuracy\"] = round(cvres[\"test_accuracy\"].mean(), 4)\n            row[\"Precision\"] = round(cvres[\"test_precision_macro\"].mean(), 4)\n            row[\"Recall\"] = round(cvres[\"test_recall_macro\"].mean(), 4)\n            row[\"F1\"] = round(cvres[\"test_f1_macro\"].mean(), 4)\n            train_f1 = cvres[\"train_f1_macro\"].mean()\n            row[\"_gap\"] = train_f1 - cvres[\"test_f1_macro\"].mean()\n            row[\"_score\"] = row[\"F1\"]\n        else:\n            row[\"RMSE\"] = round(-cvres[\"test_neg_root_mean_squared_error\"].mean(), 4)\n            row[\"MAE\"] = round(-cvres[\"test_neg_mean_absolute_error\"].mean(), 4)\n            row[\"R²\"] = round(cvres[\"test_r2\"].mean(), 4)\n            row[\"_gap\"] = cvres[\"train_r2\"].mean() - cvres[\"test_r2\"].mean()\n            row[\"_score\"] = row[\"R²\"]\n        rows.append(row)\n\n    if not rows:\n        raise ValueError(\"すべてのモデルで評価に失敗しました。データを確認してください。\")\n\n    comp = pd.DataFrame(rows).sort_values(\"_score\", ascending=False).reset_index(drop=True)\n\n    # 過学習診断\n    for _, r in comp.iterrows():\n        if r[\"_gap\"] > 0.2:\n            warnings.append(\n                f\"{r['モデル']}: 訓練と検証のスコア差が大きく（{r['_gap']:.2f}）、\"\n                \"過学習の可能性があります。\"\n            )\n\n    best_name = comp.iloc[0][\"モデル\"]\n    comp_display = comp.drop(columns=[\"_gap\", \"_score\"])\n\n    # 最優秀モデルの特徴量重要度\n    fi = _feature_importance(models[best_name], X, y_enc, features, mode)\n\n    # ROC（分類のみ、各モデルを 1 回 train/test split で）\n    roc_data = {}\n    cm, cm_labels = None, []\n    if mode == \"classification\":\n        if len(np.unique(y_enc)) == 2:\n            roc_data = _roc_curves(models, X, y_enc)\n        cm, cm_labels = _confusion_for_best(\n            models[best_name], X, y, y_enc)\n\n    return MLResult(\n        mode=mode, comparison=comp_display, best_model_name=best_name,\n        feature_importance=fi, roc_data=roc_data, warnings=warnings, target=target,\n        confusion_matrix=cm, confusion_labels=cm_labels,\n    )\n\n\ndef _confusion_for_best(estimator, X, y_raw, y_enc):\n    \"\"\"最優秀分類モデルの混同行列を train/test split で算出する。\"\"\"\n    from sklearn.model_selection import train_test_split\n    from sklearn.metrics import confusion_matrix\n    from sklearn.preprocessing import StandardScaler\n    from sklearn.pipeline import Pipeline\n\n    try:\n        labels = sorted(np.unique(y_enc).tolist())\n        # 元のクラス名（ラベルエンコード前）を順序通りに対応づける\n        uniq_raw = pd.Series(y_raw).astype(str)\n        name_map = {}\n        for code in labels:\n            mask = y_enc == code\n            name_map[code] = uniq_raw[mask].iloc[0] if mask.any() else str(code)\n        X_tr, X_te, y_tr, y_te = train_test_split(\n            X, y_enc, test_size=0.3, random_state=42, stratify=y_enc)\n        pipe = Pipeline([(\"scaler\", StandardScaler()), (\"model\", estimator)])\n        pipe.fit(X_tr, y_tr)\n        pred = pipe.predict(X_te)\n        cm = confusion_matrix(y_te, pred, labels=labels)\n        return cm, [name_map[c] for c in labels]\n    except Exception:\n        return None, []\n\n\ndef _feature_importance(estimator, X, y, features, mode) -> pd.DataFrame:\n    from sklearn.preprocessing import StandardScaler\n\n    Xs = StandardScaler().fit_transform(X)\n    try:\n        est = estimator\n        est.fit(Xs, y)\n        if hasattr(est, \"feature_importances_\"):\n            imp = est.feature_importances_\n        elif hasattr(est, \"coef_\"):\n            coef = np.asarray(est.coef_)\n            imp = np.abs(coef).ravel()[: len(features)]\n        else:\n            return None\n    except Exception:\n        return None\n    return (\n        pd.DataFrame({\"特徴量\": features, \"重要度\": np.round(imp, 4)})\n        .sort_values(\"重要度\", ascending=False)\n        .reset_index(drop=True)\n    )\n\n\ndef _roc_curves(models, X, y) -> dict:\n    from sklearn.model_selection import train_test_split\n    from sklearn.metrics import roc_curve, auc\n    from sklearn.preprocessing import StandardScaler\n    from sklearn.pipeline import Pipeline\n\n    out = {}\n    X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.3, random_state=42, stratify=y)\n    for name, est in models.items():\n        try:\n            pipe = Pipeline([(\"scaler\", StandardScaler()), (\"model\", est)])\n            pipe.fit(X_tr, y_tr)\n            if hasattr(pipe, \"predict_proba\"):\n                prob = pipe.predict_proba(X_te)[:, 1]\n            elif hasattr(pipe.named_steps[\"model\"], \"decision_function\"):\n                prob = pipe.decision_function(X_te)\n            else:\n                continue\n            fpr, tpr, _ = roc_curve(y_te, prob)\n            out[name] = (fpr, tpr, auc(fpr, tpr))\n        except Exception:\n            continue\n    return out\n", "modules/clustering.py": "\"\"\"⑦ クラスタリング。\n\nk-means（Elbow + シルエットでクラスタ数提示）、階層的クラスタリング、\nPCA 2 次元散布図を提供する。すべて scikit-learn / scipy で計算。\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nimport pandas as pd\n\nfrom . import data_loader\n\nHIER_WARN_THRESHOLD = 5_000\nHIER_SAMPLE_N = 3_000\n\n\n@dataclass\nclass ClusterSuggestion:\n    k_values: list\n    inertia: list\n    silhouette: list\n    suggested_k: int\n\n\n@dataclass\nclass ClusterResult:\n    labels: np.ndarray\n    df_with_clusters: pd.DataFrame\n    cluster_summary: pd.DataFrame\n    pca_coords: np.ndarray = None\n    pca_explained: tuple = None\n    extra: dict = field(default_factory=dict)\n\n\ndef _prepare(df: pd.DataFrame, features: list[str] | None):\n    feats = features or data_loader.numeric_columns(df)\n    data = df[feats].dropna()\n    return data, feats\n\n\ndef suggest_k(df: pd.DataFrame, features: list[str] | None = None,\n             k_range=range(2, 11)) -> ClusterSuggestion:\n    from sklearn.cluster import KMeans\n    from sklearn.preprocessing import StandardScaler\n    from sklearn.metrics import silhouette_score\n\n    data, feats = _prepare(df, features)\n    X = StandardScaler().fit_transform(data)\n\n    inertia, sil, ks = [], [], []\n    for k in k_range:\n        if k >= len(X):\n            continue\n        km = KMeans(n_clusters=k, n_init=10, random_state=42).fit(X)\n        inertia.append(km.inertia_)\n        sil.append(silhouette_score(X, km.labels_))\n        ks.append(k)\n    suggested = ks[int(np.argmax(sil))] if sil else 2\n    return ClusterSuggestion(ks, inertia, sil, suggested)\n\n\ndef kmeans(df: pd.DataFrame, k: int, features: list[str] | None = None,\n          run_pca: bool = True) -> ClusterResult:\n    from sklearn.cluster import KMeans\n    from sklearn.preprocessing import StandardScaler\n\n    data, feats = _prepare(df, features)\n    scaler = StandardScaler()\n    X = scaler.fit_transform(data)\n    km = KMeans(n_clusters=k, n_init=10, random_state=42).fit(X)\n    labels = km.labels_\n\n    out = data.copy()\n    out[\"cluster\"] = labels\n    summary = out.groupby(\"cluster\")[feats].mean().round(3)\n    summary.insert(0, \"件数\", out.groupby(\"cluster\").size())\n\n    coords, explained = (None, None)\n    if run_pca and X.shape[1] >= 2:\n        coords, explained = _pca2d(X)\n\n    return ClusterResult(labels, out, summary.reset_index(), coords, explained,\n                         extra={\"features\": feats})\n\n\ndef hierarchical(df: pd.DataFrame, k: int, method: str = \"ward\",\n                features: list[str] | None = None, auto_sample: bool = True) -> ClusterResult:\n    from scipy.cluster.hierarchy import linkage, fcluster\n    from sklearn.preprocessing import StandardScaler\n\n    data, feats = _prepare(df, features)\n    warnings = []\n    if len(data) > HIER_WARN_THRESHOLD and auto_sample:\n        warnings.append(\n            f\"行数が {len(data):,} と多いため、{HIER_SAMPLE_N:,}行にランダムサンプリングして実行しました。\"\n            \"大規模データでは k-means を推奨します。\"\n        )\n        data = data.sample(HIER_SAMPLE_N, random_state=42)\n\n    X = StandardScaler().fit_transform(data)\n    Z = linkage(X, method=method)\n    labels = fcluster(Z, t=k, criterion=\"maxclust\") - 1\n\n    out = data.copy()\n    out[\"cluster\"] = labels\n    summary = out.groupby(\"cluster\")[feats].mean().round(3)\n    summary.insert(0, \"件数\", out.groupby(\"cluster\").size())\n\n    coords, explained = (None, None)\n    if X.shape[1] >= 2:\n        coords, explained = _pca2d(X)\n\n    return ClusterResult(labels, out, summary.reset_index(), coords, explained,\n                         extra={\"linkage\": Z, \"features\": feats, \"warnings\": warnings})\n\n\ndef _pca2d(X):\n    from sklearn.decomposition import PCA\n\n    pca = PCA(n_components=2, random_state=42)\n    coords = pca.fit_transform(X)\n    return coords, tuple(np.round(pca.explained_variance_ratio_, 3))\n", "modules/visualizer.py": "\"\"\"⑧ 図表出力（PNG/SVG）。\n\n論文投稿に耐える品質（300dpi、白背景、薄いグリッド、日本語対応フォント）で\n各種の図を生成し、PNG（300dpi）と SVG（ベクター）の両方で出力できる。\n\"\"\"\nfrom __future__ import annotations\n\nfrom io import BytesIO\n\nimport numpy as np\nimport pandas as pd\n\nfrom .common import setup_japanese_font\n\nsetup_japanese_font()\n\nimport matplotlib.pyplot as plt  # noqa: E402\nimport seaborn as sns  # noqa: E402\n\nsns.set_style(\"whitegrid\")\n\n# ラベル辞書（日本語 / 英語切り替え）\n_LABELS = {\n    \"ja\": {\"freq\": \"度数\", \"value\": \"値\", \"density\": \"密度\", \"cluster\": \"クラスタ\"},\n    \"en\": {\"freq\": \"Frequency\", \"value\": \"Value\", \"density\": \"Density\", \"cluster\": \"Cluster\"},\n}\n\n\ndef fig_to_bytes(fig, fmt: str = \"png\") -> bytes:\n    \"\"\"Figure を PNG(300dpi) または SVG のバイト列に変換する。\"\"\"\n    buf = BytesIO()\n    if fmt == \"png\":\n        fig.savefig(buf, format=\"png\", dpi=300, bbox_inches=\"tight\", facecolor=\"white\")\n    else:\n        fig.savefig(buf, format=\"svg\", bbox_inches=\"tight\", facecolor=\"white\")\n    buf.seek(0)\n    return buf.getvalue()\n\n\ndef histogram(df, col, bins=30, kde=True, lang=\"ja\", title=None):\n    fig, ax = plt.subplots(figsize=(7, 4.5))\n    s = df[col].dropna()\n    ax.hist(s, bins=bins, color=\"#1E6091\", alpha=0.7, edgecolor=\"white\", density=kde)\n    if kde and len(s) > 1:\n        from scipy import stats\n\n        xs = np.linspace(s.min(), s.max(), 200)\n        kde_fn = stats.gaussian_kde(s)\n        ax.plot(xs, kde_fn(xs), color=\"#C0392B\", lw=2, label=\"密度推定\" if lang == \"ja\" else \"KDE\")\n        # 正規分布曲線\n        ax.plot(xs, stats.norm.pdf(xs, s.mean(), s.std()), \"--\", color=\"#2E8B57\",\n                lw=1.5, label=\"正規分布\" if lang == \"ja\" else \"Normal\")\n        ax.legend()\n    ax.set_xlabel(col)\n    ax.set_ylabel(_LABELS[lang][\"density\"] if kde else _LABELS[lang][\"freq\"])\n    ax.set_title(title or f\"{col} のヒストグラム\")\n    fig.tight_layout()\n    return fig\n\n\ndef boxplot(df, value_col, group_col=None, strip=True, lang=\"ja\", title=None):\n    fig, ax = plt.subplots(figsize=(7, 4.5))\n    if group_col:\n        sns.boxplot(data=df, x=group_col, y=value_col, ax=ax, palette=\"Blues\")\n        if strip:\n            sns.stripplot(data=df, x=group_col, y=value_col, ax=ax, color=\"#1A1A2E\",\n                          alpha=0.4, size=3)\n    else:\n        sns.boxplot(data=df, y=value_col, ax=ax, color=\"#1E6091\")\n        if strip:\n            sns.stripplot(data=df, y=value_col, ax=ax, color=\"#1A1A2E\", alpha=0.4, size=3)\n    ax.set_title(title or f\"{value_col} の箱ひげ図\")\n    fig.tight_layout()\n    return fig\n\n\ndef violin(df, value_col, group_col=None, lang=\"ja\", title=None):\n    fig, ax = plt.subplots(figsize=(7, 4.5))\n    if group_col:\n        sns.violinplot(data=df, x=group_col, y=value_col, ax=ax, palette=\"Blues\")\n    else:\n        sns.violinplot(data=df, y=value_col, ax=ax, color=\"#1E6091\")\n    ax.set_title(title or f\"{value_col} のバイオリンプロット\")\n    fig.tight_layout()\n    return fig\n\n\ndef scatter_regression(df, x_col, y_col, lang=\"ja\", title=None):\n    fig, ax = plt.subplots(figsize=(7, 4.5))\n    sns.regplot(data=df, x=x_col, y=y_col, ax=ax,\n                scatter_kws={\"alpha\": 0.5, \"color\": \"#1E6091\"},\n                line_kws={\"color\": \"#C0392B\"})\n    ax.set_title(title or f\"{x_col} と {y_col} の散布図（回帰直線・95%CI）\")\n    fig.tight_layout()\n    return fig\n\n\ndef correlation_heatmap(corr, lang=\"ja\", title=None):\n    fig, ax = plt.subplots(figsize=(max(5, len(corr) * 0.8), max(4, len(corr) * 0.7)))\n    sns.heatmap(corr, annot=True, fmt=\".2f\", cmap=\"RdBu_r\", center=0, vmin=-1, vmax=1,\n                square=True, ax=ax, cbar_kws={\"shrink\": 0.8})\n    ax.set_title(title or (\"相関ヒートマップ\" if lang == \"ja\" else \"Correlation heatmap\"))\n    fig.tight_layout()\n    return fig\n\n\ndef roc_curve_plot(roc_data: dict, lang=\"ja\", title=None):\n    \"\"\"roc_data: name -> (fpr, tpr, auc)。複数モデル重ね描き可。\"\"\"\n    fig, ax = plt.subplots(figsize=(6, 6))\n    for name, (fpr, tpr, auc_val) in roc_data.items():\n        ax.plot(fpr, tpr, lw=2, label=f\"{name} (AUC={auc_val:.3f})\")\n    ax.plot([0, 1], [0, 1], \"--\", color=\"gray\", lw=1)\n    ax.set_xlabel(\"偽陽性率 (FPR)\" if lang == \"ja\" else \"False Positive Rate\")\n    ax.set_ylabel(\"真陽性率 (TPR)\" if lang == \"ja\" else \"True Positive Rate\")\n    ax.set_title(title or (\"ROC 曲線\" if lang == \"ja\" else \"ROC curve\"))\n    ax.legend(loc=\"lower right\")\n    fig.tight_layout()\n    return fig\n\n\ndef bar_with_error(df, group_col, value_col, lang=\"ja\", title=None):\n    fig, ax = plt.subplots(figsize=(7, 4.5))\n    grp = df.groupby(group_col)[value_col]\n    means = grp.mean()\n    sems = grp.sem()\n    ax.bar(means.index.astype(str), means.values, yerr=sems.values, capsize=5,\n           color=\"#1E6091\", alpha=0.8, edgecolor=\"white\")\n    ax.set_ylabel(value_col)\n    ax.set_title(title or f\"{group_col} 別 {value_col}（平均 ± SE）\")\n    fig.tight_layout()\n    return fig\n\n\ndef missing_heatmap(df, lang=\"ja\", title=None):\n    fig, ax = plt.subplots(figsize=(8, 4.5))\n    sns.heatmap(df.isna(), cbar=False, cmap=\"Greys\", ax=ax)\n    ax.set_title(title or (\"欠損値ヒートマップ\" if lang == \"ja\" else \"Missing value heatmap\"))\n    fig.tight_layout()\n    return fig\n\n\ndef feature_importance_plot(fi_df, lang=\"ja\", title=None, top=15):\n    data = fi_df.head(top).iloc[::-1]\n    fig, ax = plt.subplots(figsize=(7, max(3, len(data) * 0.4)))\n    ax.barh(data.iloc[:, 0].astype(str), data.iloc[:, 1], color=\"#1E6091\")\n    ax.set_xlabel(\"重要度\" if lang == \"ja\" else \"Importance\")\n    ax.set_title(title or (\"特徴量重要度\" if lang == \"ja\" else \"Feature importance\"))\n    fig.tight_layout()\n    return fig\n\n\ndef residual_plots(fitted, residuals, lang=\"ja\"):\n    \"\"\"残差プロット + QQ プロットを横並びで返す。\"\"\"\n    from scipy import stats\n\n    fig, axes = plt.subplots(1, 2, figsize=(11, 4.5))\n    axes[0].scatter(fitted, residuals, alpha=0.5, color=\"#1E6091\")\n    axes[0].axhline(0, color=\"#C0392B\", ls=\"--\")\n    axes[0].set_xlabel(\"予測値\" if lang == \"ja\" else \"Fitted\")\n    axes[0].set_ylabel(\"残差\" if lang == \"ja\" else \"Residuals\")\n    axes[0].set_title(\"残差プロット\" if lang == \"ja\" else \"Residuals vs Fitted\")\n\n    stats.probplot(residuals, dist=\"norm\", plot=axes[1])\n    axes[1].set_title(\"QQ プロット\" if lang == \"ja\" else \"Normal Q-Q\")\n    fig.tight_layout()\n    return fig\n\n\ndef dendrogram_plot(Z, lang=\"ja\", title=None):\n    from scipy.cluster.hierarchy import dendrogram\n\n    fig, ax = plt.subplots(figsize=(9, 4.5))\n    dendrogram(Z, ax=ax, no_labels=True, color_threshold=0.7 * max(Z[:, 2]))\n    ax.set_title(title or (\"デンドログラム\" if lang == \"ja\" else \"Dendrogram\"))\n    ax.set_ylabel(\"距離\" if lang == \"ja\" else \"Distance\")\n    fig.tight_layout()\n    return fig\n\n\ndef pca_scatter(coords, labels, explained=None, lang=\"ja\", title=None):\n    fig, ax = plt.subplots(figsize=(7, 5.5))\n    sc = ax.scatter(coords[:, 0], coords[:, 1], c=labels, cmap=\"tab10\", alpha=0.7)\n    xl = \"PC1\" if explained is None else f\"PC1 ({explained[0]*100:.1f}%)\"\n    yl = \"PC2\" if explained is None else f\"PC2 ({explained[1]*100:.1f}%)\"\n    ax.set_xlabel(xl)\n    ax.set_ylabel(yl)\n    ax.set_title(title or (\"PCA 散布図（クラスタ色分け）\" if lang == \"ja\" else \"PCA scatter\"))\n    legend = ax.legend(*sc.legend_elements(), title=_LABELS[lang][\"cluster\"])\n    ax.add_artist(legend)\n    fig.tight_layout()\n    return fig\n\n\ndef elbow_silhouette(suggestion, lang=\"ja\"):\n    fig, axes = plt.subplots(1, 2, figsize=(11, 4))\n    axes[0].plot(suggestion.k_values, suggestion.inertia, \"o-\", color=\"#1E6091\")\n    axes[0].set_xlabel(\"クラスタ数 k\")\n    axes[0].set_ylabel(\"慣性 (inertia)\")\n    axes[0].set_title(\"Elbow 法\")\n    axes[1].plot(suggestion.k_values, suggestion.silhouette, \"o-\", color=\"#C0392B\")\n    axes[1].axvline(suggestion.suggested_k, ls=\"--\", color=\"gray\")\n    axes[1].set_xlabel(\"クラスタ数 k\")\n    axes[1].set_ylabel(\"シルエット係数\")\n    axes[1].set_title(f\"シルエット係数（推奨 k={suggestion.suggested_k}）\")\n    fig.tight_layout()\n    return fig\n", "exporters/__init__.py": "\"\"\"StatEasy エクスポーター群。\"\"\"\n", "exporters/excel_exporter.py": "\"\"\"Excel(.xlsx) 出力。openpyxl で APA 風（三線表）スタイルを適用する。\"\"\"\nfrom __future__ import annotations\n\nfrom io import BytesIO\n\nimport pandas as pd\n\n\ndef export_tables(tables: dict[str, pd.DataFrame]) -> bytes:\n    \"\"\"シート名 -> DataFrame の辞書を 1 つの xlsx にまとめて出力。\n\n    APA 風の三線表（上下に太線、ヘッダー下に細線）を適用する。\n    \"\"\"\n    from openpyxl import Workbook\n    from openpyxl.styles import Font, Border, Side, Alignment, PatternFill\n\n    wb = Workbook()\n    wb.remove(wb.active)\n\n    thick = Side(style=\"thick\", color=\"1A1A2E\")\n    thin = Side(style=\"thin\", color=\"1A1A2E\")\n    header_font = Font(bold=True, color=\"FFFFFF\")\n    header_fill = PatternFill(\"solid\", fgColor=\"1E6091\")\n    center = Alignment(horizontal=\"center\", vertical=\"center\")\n\n    for sheet_name, df in tables.items():\n        ws = wb.create_sheet(title=str(sheet_name)[:31])\n        ws.append(list(df.columns))\n        for _, row in df.iterrows():\n            ws.append([_fmt(v) for v in row.tolist()])\n\n        n_rows = len(df) + 1\n        n_cols = len(df.columns)\n        for c in range(1, n_cols + 1):\n            hc = ws.cell(row=1, column=c)\n            hc.font = header_font\n            hc.fill = header_fill\n            hc.alignment = center\n            # 上罫線（太）+ ヘッダー下罫線（細）\n            hc.border = Border(top=thick, bottom=thin)\n            # 最終行の下罫線（太）\n            bc = ws.cell(row=n_rows, column=c)\n            bc.border = Border(bottom=thick)\n        # 列幅自動調整\n        for c in range(1, n_cols + 1):\n            letter = ws.cell(row=1, column=c).column_letter\n            maxlen = max([len(str(ws.cell(row=r, column=c).value or \"\")) for r in range(1, n_rows + 1)])\n            ws.column_dimensions[letter].width = min(40, max(10, maxlen + 2))\n\n    buf = BytesIO()\n    wb.save(buf)\n    buf.seek(0)\n    return buf.getvalue()\n\n\ndef _fmt(v):\n    if isinstance(v, float):\n        return round(v, 4)\n    return v\n", "exporters/word_exporter.py": "\"\"\"Word(.docx) 出力。python-docx で APA 風三線表と Methods テンプレートを生成。\"\"\"\nfrom __future__ import annotations\n\nfrom io import BytesIO\n\nimport pandas as pd\n\nMETHODS_TEMPLATE = (\n    \"【統計手法（Methods）テンプレート】\\n\"\n    \"本研究の統計解析はすべて Python の統計ライブラリ（SciPy, statsmodels, \"\n    \"scikit-learn, pandas, NumPy）を用いて実施した。生成 AI による推定は一切用いておらず、\"\n    \"同一データ・同一設定に対して常に同一の結果が得られる再現性を担保している。\"\n    \"2 群の比較では正規性（Shapiro-Wilk 検定）と等分散性（Levene 検定）を確認した上で、\"\n    \"適切な検定（t 検定／Mann-Whitney U 検定等）を選択した。\"\n    \"効果量（Cohen's d / Hedges' g 等）と 95% 信頼区間を併記し、\"\n    \"有意水準は両側 5% とした。\"\n)\n\n\ndef _add_apa_table(doc, df: pd.DataFrame, title: str | None = None):\n    from docx.shared import Pt\n    from docx.enum.table import WD_TABLE_ALIGNMENT\n\n    if title:\n        doc.add_heading(title, level=2)\n    table = doc.add_table(rows=1, cols=len(df.columns))\n    table.alignment = WD_TABLE_ALIGNMENT.CENTER\n    table.style = \"Table Grid\"\n\n    hdr = table.rows[0].cells\n    for i, col in enumerate(df.columns):\n        hdr[i].text = str(col)\n        for p in hdr[i].paragraphs:\n            for r in p.runs:\n                r.font.bold = True\n                r.font.size = Pt(10)\n\n    for _, row in df.iterrows():\n        cells = table.add_row().cells\n        for i, v in enumerate(row.tolist()):\n            cells[i].text = _fmt(v)\n            for p in cells[i].paragraphs:\n                for r in p.runs:\n                    r.font.size = Pt(10)\n    return table\n\n\ndef export_report(tables: dict[str, pd.DataFrame], images: list[tuple] | None = None,\n                 include_methods: bool = True, heading: str = \"StatEasy 解析レポート\") -> bytes:\n    \"\"\"tables: タイトル->DataFrame、images: [(キャプション, png_bytes), ...]。\"\"\"\n    from docx import Document\n    from docx.shared import Inches\n\n    doc = Document()\n    doc.add_heading(heading, level=0)\n\n    for title, df in tables.items():\n        _add_apa_table(doc, df, title)\n        doc.add_paragraph(\"\")\n\n    if images:\n        doc.add_heading(\"図\", level=1)\n        for caption, png in images:\n            doc.add_picture(BytesIO(png), width=Inches(5.5))\n            cap = doc.add_paragraph(caption)\n            cap.alignment = 1\n\n    if include_methods:\n        doc.add_heading(\"統計手法（Methods）\", level=1)\n        doc.add_paragraph(METHODS_TEMPLATE)\n\n    doc.add_paragraph(\"\")\n    footer = doc.add_paragraph(\"考案：土居拓務 ／ 制作：株式会社Miyabee\")\n    footer.alignment = 1\n\n    buf = BytesIO()\n    doc.save(buf)\n    buf.seek(0)\n    return buf.getvalue()\n\n\ndef _fmt(v):\n    if isinstance(v, float):\n        return f\"{v:.4f}\".rstrip(\"0\").rstrip(\".\") if v == v else \"—\"\n    return str(v)\n", "exporters/pdf_exporter.py": "\"\"\"PDF 出力。reportlab で日本語フォント対応の APA 風表を生成する。\"\"\"\nfrom __future__ import annotations\n\nfrom io import BytesIO\n\nimport pandas as pd\n\n_FONT_NAME = \"HeiseiKakuGo-W5\"  # reportlab 同梱の日本語 CID フォント\n\n\ndef _register_font() -> str:\n    from reportlab.pdfbase import pdfmetrics\n    from reportlab.pdfbase.cidfonts import UnicodeCIDFont\n\n    try:\n        pdfmetrics.registerFont(UnicodeCIDFont(_FONT_NAME))\n        return _FONT_NAME\n    except Exception:\n        return \"Helvetica\"\n\n\ndef export_report(tables: dict[str, pd.DataFrame], images: list[tuple] | None = None,\n                 heading: str = \"StatEasy 解析レポート\") -> bytes:\n    from reportlab.lib import colors\n    from reportlab.lib.pagesizes import A4\n    from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle\n    from reportlab.lib.units import mm\n    from reportlab.platypus import (\n        SimpleDocTemplate, Table, TableStyle, Paragraph, Spacer, Image,\n    )\n\n    font = _register_font()\n    buf = BytesIO()\n    doc = SimpleDocTemplate(buf, pagesize=A4, topMargin=20 * mm, bottomMargin=20 * mm)\n\n    styles = getSampleStyleSheet()\n    title_style = ParagraphStyle(\"t\", parent=styles[\"Title\"], fontName=font)\n    h2 = ParagraphStyle(\"h2\", parent=styles[\"Heading2\"], fontName=font)\n    normal = ParagraphStyle(\"n\", parent=styles[\"Normal\"], fontName=font)\n\n    elements = [Paragraph(heading, title_style), Spacer(1, 8)]\n\n    for title, df in tables.items():\n        elements.append(Paragraph(str(title), h2))\n        data = [list(map(str, df.columns))]\n        for _, row in df.iterrows():\n            data.append([_fmt(v) for v in row.tolist()])\n        tbl = Table(data, hAlign=\"LEFT\")\n        tbl.setStyle(\n            TableStyle(\n                [\n                    (\"FONTNAME\", (0, 0), (-1, -1), font),\n                    (\"FONTSIZE\", (0, 0), (-1, -1), 8),\n                    (\"BACKGROUND\", (0, 0), (-1, 0), colors.HexColor(\"#1E6091\")),\n                    (\"TEXTCOLOR\", (0, 0), (-1, 0), colors.white),\n                    (\"LINEABOVE\", (0, 0), (-1, 0), 1.5, colors.black),\n                    (\"LINEBELOW\", (0, 0), (-1, 0), 0.75, colors.black),\n                    (\"LINEBELOW\", (0, -1), (-1, -1), 1.5, colors.black),\n                    (\"ALIGN\", (0, 0), (-1, -1), \"CENTER\"),\n                    (\"VALIGN\", (0, 0), (-1, -1), \"MIDDLE\"),\n                    (\"TOPPADDING\", (0, 0), (-1, -1), 3),\n                    (\"BOTTOMPADDING\", (0, 0), (-1, -1), 3),\n                ]\n            )\n        )\n        elements += [tbl, Spacer(1, 12)]\n\n    if images:\n        elements.append(Paragraph(\"図\", h2))\n        for caption, png in images:\n            elements.append(Image(BytesIO(png), width=140 * mm, height=90 * mm,\n                                  kind=\"proportional\"))\n            elements.append(Paragraph(caption, normal))\n            elements.append(Spacer(1, 10))\n\n    elements.append(Spacer(1, 16))\n    elements.append(Paragraph(\"考案：土居拓務 ／ 制作：株式会社Miyabee\", normal))\n\n    doc.build(elements)\n    buf.seek(0)\n    return buf.getvalue()\n\n\ndef _fmt(v):\n    if isinstance(v, float):\n        return f\"{v:.4f}\".rstrip(\"0\").rstrip(\".\") if v == v else \"—\"\n    return str(v)\n", "pages/00_home.py": "\"\"\"ホーム / オンボーディング・チュートリアルページ。\"\"\"\nfrom __future__ import annotations\n\nfrom pathlib import Path\n\nimport streamlit as st\n\nfrom modules import common, data_loader\n\ncommon.load_css()\n\n# ---- ヒーローバナー ----\nst.markdown(\n    \"\"\"\n    <div class=\"stateasy-hero\">\n        <h1>StatEasy<\/h1>\n        <p>統計の面白さを、もっと身近に。<br>\n        データを読み込むだけで、診断から検定・可視化・出力までを一気通貫で。<\/p>\n    <\/div>\n    \"\"\",\n    unsafe_allow_html=True,\n)\n\n# ---- 3ステップの使い方ガイド ----\nst.subheader(\"使い方は 3 ステップ\")\nsteps = [\n    (\"①\", \"データを読み込む\", \"CSV / Excel をアップロード、またはサンプルデータを選ぶだけ。文字コードや列の型は自動で判定します。\"),\n    (\"②\", \"目的のメニューを選ぶ\", \"品質診断・記述統計・仮説検定など、やりたいことに合わせてメニューを選択します。\"),\n    (\"③\", \"結果を解釈・出力する\", \"なぜその手法かの説明つきで結果を表示。図表は Excel / Word / PDF / 画像で出力できます。\"),\n]\ncols = st.columns(3)\nfor col, (num, title, desc) in zip(cols, steps):\n    with col:\n        st.markdown(\n            f\"\"\"\n            <div class=\"stateasy-card\">\n                <h2 style=\"margin:0;\">{num}<\/h2>\n                <h4 style=\"margin:0.3rem 0;\">{title}<\/h4>\n                <p style=\"margin:0;color:#5A6B7B;\">{desc}<\/p>\n            <\/div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\nst.divider()\n\n# ---- サンプルデータで試す ----\nst.subheader(\"サンプルデータで試す\")\nst.caption(\"実際のデータがなくても、用意したサンプルですぐに体験できます。\")\n\nSAMPLES = [\n    (\"実験データ\", \"sample_experiment.csv\", \"2 群以上の比較・効果量の体験に。\"),\n    (\"アンケートデータ\", \"sample_survey.csv\", \"カテゴリ集計・相関の体験に。\"),\n    (\"時系列データ\", \"sample_timeseries.csv\", \"推移の記述・可視化の体験に。\"),\n]\n\n\ndef _load_sample(filename: str) -> None:\n    path = Path(common.SAMPLE_DIR) / filename\n    result = data_loader.load(str(path), filename)\n    st.session_state[\"df\"] = result.df\n    st.session_state[\"column_types\"] = result.column_types\n    st.session_state[\"source_name\"] = result.source_name\n    st.success(f\"サンプル『{filename}』を読み込みました（{result.df.shape[0]} 行 × {result.df.shape[1]} 列）。\")\n    st.switch_page(\"pages/02_quality.py\")\n\n\nscols = st.columns(3)\nfor col, (label, filename, desc) in zip(scols, SAMPLES):\n    with col:\n        st.markdown(f\"**{label}**\")\n        st.caption(desc)\n        if st.button(f\"{label}を読み込む\", key=f\"sample_{filename}\", use_container_width=True):\n            try:\n                _load_sample(filename)\n            except Exception as e:  # noqa: BLE001\n                st.error(str(e))\n\nst.divider()\n\n# ---- 8 機能の概要カード ----\nst.subheader(\"できること（8 つの機能）\")\nFEATURES = [\n    (\"品質診断\", \"欠損・外れ値・重複を自動チェックし、対処のヒントを提示。\"),\n    (\"記述統計\", \"数値・カテゴリの要約や APA 形式の Table 1 を作成。\"),\n    (\"仮説検定\", \"2 群／多群を自動判定し、前提確認のうえ最適な検定を選択。\"),\n    (\"効果量\", \"Cohen's d・η²・Cramér's V などを信頼区間つきで算出。\"),\n    (\"相関・回帰\", \"相関行列、線形・ロジスティック回帰、VIF まで対応。\"),\n    (\"機械学習\", \"複数モデルを自動比較し、最良モデルと重要度を提示。\"),\n    (\"クラスタリング\", \"最適なクラスタ数の提案・k-means・階層クラスタリング。\"),\n    (\"図表出力\", \"図は PNG / SVG、表は Excel / Word / PDF で出力。\"),\n]\nfcols = st.columns(4)\nfor i, (title, desc) in enumerate(FEATURES):\n    with fcols[i % 4]:\n        st.markdown(\n            f\"\"\"\n            <div class=\"stateasy-card\">\n                <h4 style=\"margin:0 0 0.3rem 0;\">{title}<\/h4>\n                <p style=\"margin:0;color:#5A6B7B;font-size:0.9rem;\">{desc}<\/p>\n            <\/div>\n            \"\"\",\n            unsafe_allow_html=True,\n        )\n\nst.divider()\n\n# ---- 再現性に関する重要事項 ----\nst.info(\n    \"**再現性について**：StatEasy の統計計算は SciPy / statsmodels / scikit-learn のみで行います。\"\n    \"生成 AI は一切利用しないため、同じデータからは常に同じ結果が得られ、研究・報告での再現性を担保します。\"\n)\n\ncommon.render_footer()\n", "pages/01_upload.py": "\"\"\"① データアップロード・プレビューページ。\"\"\"\nfrom __future__ import annotations\n\nfrom pathlib import Path\n\nimport pandas as pd\nimport streamlit as st\n\nfrom modules import common, data_loader\n\ncommon.load_css()\n\nst.title(\"データアップロード\")\nst.caption(\"CSV / Excel(.xlsx) を読み込みます。文字コードと列の型は自動で判定します。\")\n\n\ndef _store_result(result) -> None:\n    st.session_state[\"df\"] = result.df\n    st.session_state[\"column_types\"] = result.column_types\n    st.session_state[\"source_name\"] = result.source_name\n    # 直近の読み込み結果（エンコーディング・警告の表示用）\n    st.session_state[\"_last_encoding\"] = result.encoding\n    st.session_state[\"_last_warnings\"] = list(result.warnings)\n\n\n# ---- ファイルアップロード ----\nuploaded = st.file_uploader(\"ファイルを選択\", type=[\"csv\", \"xlsx\"])\nif uploaded is not None:\n    try:\n        result = data_loader.load(uploaded, uploaded.name)\n        _store_result(result)\n    except Exception as e:  # noqa: BLE001\n        st.error(str(e))\n\nst.divider()\n\n# ---- サンプルデータの代替手段 ----\nst.subheader(\"または サンプルデータを使う\")\nSAMPLES = {\n    \"実験データ (sample_experiment.csv)\": \"sample_experiment.csv\",\n    \"アンケートデータ (sample_survey.csv)\": \"sample_survey.csv\",\n    \"時系列データ (sample_timeseries.csv)\": \"sample_timeseries.csv\",\n}\nscol1, scol2 = st.columns([3, 1])\nwith scol1:\n    chosen = st.selectbox(\"サンプルを選択\", list(SAMPLES.keys()), key=\"sample_select\")\nwith scol2:\n    st.write(\"\")\n    st.write(\"\")\n    if st.button(\"読み込む\", key=\"load_sample_btn\", use_container_width=True):\n        filename = SAMPLES[chosen]\n        path = Path(common.SAMPLE_DIR) / filename\n        try:\n            result = data_loader.load(str(path), filename)\n            _store_result(result)\n        except Exception as e:  # noqa: BLE001\n
