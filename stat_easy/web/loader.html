<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StatEasy — 自動統計解析ツール（確認用）</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    #boot { font-family: "Hiragino Sans","Noto Sans JP",sans-serif; color:#1E6091;
            text-align:center; padding:16vh 1rem; }
    #boot .sub { color:#5A6B7B; font-size:0.9rem; margin-top:0.6rem; }
    .spin { width:38px;height:38px;border:4px solid #D6E0EA;border-top-color:#1E6091;
            border-radius:50%;margin:0 auto 1rem;animation:r 1s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div id="boot">
      <div class="spin"></div>
      <div><b>StatEasy</b> を起動しています…（版: 2026-07-09 更新版）</div>
      <div class="sub">初回はブラウザ内に統計ライブラリと日本語フォントを読み込むため<br>
      1〜2分ほどかかります。そのままお待ちください。</div>
      <div class="sub">開発：土居拓務・株式会社Miyabee</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>
  <script>
    const BASE = "https://cdn.jsdelivr.net/gh/dronehonpo-byte/-@55f8fdc6fda901d39962b5c59b9502dc08f9a828/stat_easy/";
    const PATHS = ["app.py", "modules/__init__.py", "modules/common.py", "modules/data_loader.py", "modules/data_quality.py", "modules/descriptive_stats.py", "modules/hypothesis_test.py", "modules/effect_size.py", "modules/correlation.py", "modules/clustering.py", "modules/visualizer.py", "exporters/__init__.py", "exporters/excel_exporter.py", "exporters/word_exporter.py", "exporters/pdf_exporter.py", "pages/00_home.py", "pages/01_upload.py", "pages/02_quality.py", "pages/03_descriptive.py", "pages/04_hypothesis.py", "pages/05_effect.py", "pages/06_regression.py", "pages/08_clustering.py", "pages/09_visualization.py", "sample_data/sample_experiment.csv", "sample_data/sample_survey.csv", "assets/style.css", ".streamlit/config.toml", "assets/fonts/ipaexg.ttf"];
    const files = {};
    for (const p of PATHS) { files[p] = { url: BASE + p }; }
    stlite.mount(
      { requirements: ["numpy", "pandas", "scipy", "scikit-learn", "statsmodels", "matplotlib", "seaborn", "openpyxl", "python-docx", "chardet"], entrypoint: "app.py", files: files },
      document.getElementById("root")
    );
  </script>
</body>
</html>
