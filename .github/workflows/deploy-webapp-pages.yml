name: Deploy WebApp to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["claude/animal-face-diagnosis-ios-e0i6wq"]
    paths:
      - "AnimalFaceApp/WebApp/**"
      - ".github/workflows/deploy-webapp-pages.yml"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: AnimalFaceApp/WebApp
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: 動物顔診断 Web版"
