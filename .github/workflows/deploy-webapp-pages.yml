name: Deploy WebApp to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["claude/animal-face-diagnosis-ios-e0i6wq"]
    paths: ["AnimalFaceApp/WebApp/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: AnimalFaceApp/WebApp
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
