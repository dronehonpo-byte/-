# Render Blueprint — 代行の窓口（daiko）
# Render → New → Blueprint → このリポジトリ＋ブランチ claude/inspiring-hopper-is4vyp を選択 → Apply
# Web サービス + Postgres + 永続ディスクが一括で作成される。
# （econtract 用の Blueprint は econtract/render.yaml に退避）
services:
  - type: web
    name: daiko
    runtime: python
    plan: starter
    rootDir: daiko
    region: singapore
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    preDeployCommand: |
      flask --app wsgi seed             # テーブル作成＋管理者＋参加業者を冪等に投入
    startCommand: |
      gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: FLASK_ENV
        value: production
      - key: DAIKO_SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        sync: false                      # デプロイ後に Render のURL/独自ドメインを入れる（後でOK）
      - key: DAIKO_ADMIN_ID
        value: admin
      - key: DAIKO_ADMIN_PASSWORD
        sync: false                      # ← 適用時に管理者パスワードを入力（必須）
      - key: SMS_BACKEND
        value: console
      - key: DAIKO_OTP_SHOW_IN_RESPONSE
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DAIKO_STORAGE_DIR
        value: /var/data/daiko
      - key: DATABASE_URL
        fromDatabase:
          name: daiko-db
          property: connectionString
    disk:
      name: storage
      mountPath: /var/data/daiko
      sizeGB: 1

databases:
  - name: daiko-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
