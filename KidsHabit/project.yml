# xcodegen 設定ファイル
# 使い方:
#   brew install xcodegen
#   cd KidsHabit && xcodegen generate
#   open KidsHabit.xcodeproj
#
# 未確定事項のため仮の値を使用（Bundle ID / チーム等）。確定後にここを更新する。

name: KidsHabit

options:
  bundleIdPrefix: com.miyabee
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ja
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone / iPad 両対応
    TARGETED_DEVICE_FAMILY: "1,2"
    # 横向き（ランドスケープ）固定。縦向きは含めない。
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  KidsHabit:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KidsHabit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miyabee.kidshabit
        INFOPLIST_FILE: KidsHabit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 横向き固定（iPhone / iPad とも）
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    dependencies: []

  KidsHabitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KidsHabitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miyabee.kidshabit.tests
    dependencies:
      - target: KidsHabit

schemes:
  KidsHabit:
    build:
      targets:
        KidsHabit: all
        KidsHabitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KidsHabitTests
