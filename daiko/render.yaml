# Render Blueprint — 代行の窓口（運転代行マッチング）
# Render ダッシュボード → New → Blueprint → このリポジトリを選択 → rootDir を daiko に
services:
  - type: web
    name: daiko
    runtime: python
    plan: starter
    rootDir: daiko
    region: singapore
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: FLASK_ENV
        value: production
      - key: DAIKO_SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        sync: false                      # ← デプロイ後に Render の URL/独自ドメインを入れる
      - key: SMS_BACKEND
        value: console                   # ← Twilio 契約後に twilio へ
      - key: DAIKO_OTP_SHOW_IN_RESPONSE
        value: "true"                    # ← 本番運用開始時は false に
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DAIKO_STORAGE_DIR
        value: /var/data/daiko
      - key: DATABASE_URL
        fromDatabase:
          name: daiko-db
          property: connectionString
    disk:
      name: storage
      mountPath: /var/data/daiko
      sizeGB: 1

databases:
  - name: daiko-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
