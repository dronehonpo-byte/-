<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEMEasy — 共分散構造分析ツール</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    #boot { font-family: "Hiragino Sans","Noto Sans JP",sans-serif; color:#1E4E79;
            text-align:center; padding:15vh 1rem; }
    #boot .sub { color:#5A6B7B; font-size:.9rem; margin-top:.6rem; line-height:1.7; }
    .spin { width:40px;height:40px;border:4px solid #D6E0EA;border-top-color:#1E4E79;
            border-radius:50%;margin:0 auto 1.2rem;animation:r 1s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div id="boot">
      <div class="spin"></div>
      <div style="font-size:1.15rem;"><b>SEMEasy</b> を起動しています…</div>
      <div class="sub">
        初回はブラウザ内に統計ライブラリ（SciPy・statsmodels・semopy）と<br>
        日本語フォントを読み込むため、<b>2〜3分ほど</b>かかります。<br>
        そのままお待ちください。
      </div>
      <div class="sub">開発：株式会社Miyabee</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>
  <script>
    const BASE = "https://cdn.jsdelivr.net/gh/dronehonpo-byte/-@cd0fae1dba7ec20b6ccb2826f3fa676bd7f4a31d/sem_easy/";
    const PATHS = ["app.py", "users.json", "modules/__init__.py", "modules/common.py", "modules/auth.py", "modules/data_loader.py", "modules/scales.py", "modules/model_spec.py", "modules/fitindices.py", "modules/estimator.py", "modules/candidates.py", "modules/pathdiagram.py", "modules/interpret.py", "modules/reproduce.py", "exporters/__init__.py", "exporters/tables.py", "exporters/excel_exporter.py", "exporters/word_exporter.py", "exporters/pdf_exporter.py", "pages/00_home.py", "pages/01_data.py", "pages/02_check.py", "pages/03_model.py", "pages/04_estimate.py", "pages/05_result.py", "sample_data/sample_cfa_正常例.csv", "sample_data/sample_媒介モデル.csv", "sample_data/sample_順序尺度_5件法.csv", "sample_data/sample_欠損あり.csv", "sample_data/sample_問題データ.csv", "assets/fonts/ipaexg.ttf", ".streamlit/config.toml"];
    const files = {};
    for (const p of PATHS) { files[p] = { url: BASE + encodeURI(p) }; }
    const EXTRA = {".preview_mode": "web/preview_flag.txt"};
    for (const [vpath, rpath] of Object.entries(EXTRA)) {
      files[vpath] = { url: BASE + encodeURI(rpath) };
    }
    stlite.mount(
      { requirements: ["numpy", "pandas", "scipy", "statsmodels", "scikit-learn", "sympy", "matplotlib", "openpyxl", "python-docx", "chardet", "https://cdn.jsdelivr.net/gh/dronehonpo-byte/-@cd0fae1dba7ec20b6ccb2826f3fa676bd7f4a31d/sem_easy/web/wheels/semopy-2.3.11-py3-none-any.whl"], entrypoint: "app.py", files: files },
      document.getElementById("root")
    );
  </script>
</body>
</html>
