<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>顔タイプ診断（仮）— Web版 v2</title>
<!-- build: v2-web-demo (買い切り480円／全診断開放＋結果前に広告／%スプレッド／もう一度診断／写真選択1本化／SNS4種シェア／設定・規約・PP／画像はプレースホルダー) -->
<!-- TODO(appname): 正式アプリ名が未確定（§12）。下部 APP_NAME を差し替えれば全画面に反映される。 -->
<meta name="description" content="顔写真からあなたの顔タイプを診断！写真はブラウザ内でのみ解析され、アップロード・保存されません。">
<style>
  /* ============================================================
     デザイントークン（v2: 明るめ／パステル）
     §9-3「暫定パステルトーン」・7/15フィードバック#4「明るめの背景」対応。
     メインカラーは追って確定（§12）。--brand-* を差し替えれば全体に反映。
     TODO(color): 正式メインカラー確定後、--brand-a / --brand-b を更新。
     ============================================================ */
  :root {
    --brand-a:#FF8FC4;      /* メイン（ピンク・暫定） */
    --brand-b:#B98CFF;      /* サブ（パープル・暫定） */
    --bg1:#FFF3F8; --bg2:#F3EEFF; --bg3:#EAF6FF;
    --surface:#FFFFFF; --surface-2:#FFF8FC;
    --stroke:rgba(150,110,200,0.16);
    --stroke-hot:rgba(255,143,196,0.55);
    --text:#3B3048; --text-dim:#7A6B88; --text-mute:#A99DB5;
    --pink:var(--brand-a); --magenta:var(--brand-b); --violet:#8FA7FF; --gold:#FFB84D; --mint:#57D3BE;
    --grad-hot:linear-gradient(120deg,var(--brand-a),var(--brand-b));
    --grad-gold:linear-gradient(120deg,#FFD98A,#FFB07A);
    --glow:0 8px 24px rgba(255,143,196,0.35);
    --r:24px;
    --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  html { overflow-x:hidden; }
  body {
    margin:0; color:var(--text); font-family:var(--font);
    line-height:1.7; font-size:15px; overflow-x:hidden;
    background:
      radial-gradient(120% 70% at 50% -8%, #FFE3F1 0%, transparent 55%),
      radial-gradient(90% 60% at 100% 100%, #E5F1FF 0%, transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    display:flex; justify-content:center;
  }
  .app {
    position:relative; overflow:hidden;
    width:100%; max-width:430px; min-height:100dvh;
    background:linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.30));
    display:flex; flex-direction:column;
    box-shadow:0 0 60px rgba(185,140,255,0.16);
  }
  /* 背景のふわふわブロブ（装飾・操作不可） */
  .bgfx { position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bgfx::before, .bgfx::after { content:""; position:absolute; border-radius:50%; filter:blur(60px); opacity:0.5; }
  .bgfx::before { width:300px; height:300px; top:-70px; left:-90px;
    background:radial-gradient(circle, var(--brand-b), transparent 70%); animation:blob1 16s ease-in-out infinite; }
  .bgfx::after { width:340px; height:340px; bottom:-90px; right:-110px;
    background:radial-gradient(circle, var(--brand-a), transparent 70%); animation:blob2 20s ease-in-out infinite; }
  @keyframes blob1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.15);} }
  @keyframes blob2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,-30px) scale(1.1);} }

  .appbar {
    position:relative; z-index:2; flex-shrink:0;
    padding:max(12px, env(safe-area-inset-top)) 18px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(255,255,255,0.72); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--stroke);
  }
  .appbar .brand { flex:1; min-width:0; font-weight:900; font-size:15px; letter-spacing:0.02em;
    background:var(--grad-hot); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .appbar .brand small { display:block; font-size:9.5px; font-weight:700; color:var(--text-mute);
    letter-spacing:0.04em; -webkit-text-fill-color:var(--text-mute);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .appbar .bar-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .icon-btn { background:rgba(150,110,200,0.10); border:1px solid var(--stroke); color:var(--text-dim);
    width:34px; height:34px; border-radius:12px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .plan { font-size:10.5px; font-weight:800; padding:5px 12px; border-radius:999px; white-space:nowrap;
    background:rgba(185,140,255,0.14); color:#8A63D8; border:1px solid rgba(185,140,255,0.30); }
  .plan.premium { background:var(--grad-gold); color:#5a3a00; border:none; box-shadow:0 4px 14px rgba(255,184,77,0.45); }

  .body { position:relative; z-index:1; flex:1; overflow-y:auto; padding:14px 18px 24px; display:flex; flex-direction:column; }
  .screen-enter { animation:screenIn 0.34s cubic-bezier(.2,.75,.3,1) both; }
  @keyframes screenIn { from{opacity:0; transform:translateY(10px) scale(0.99);} to{opacity:1; transform:none;} }

  .navrow { display:flex; align-items:center; min-height:30px; margin-bottom:6px; }
  .navbtn { background:none; border:none; color:var(--magenta); font-weight:800; font-size:14px; cursor:pointer; padding:4px 8px 4px 0; font-family:inherit; }

  .card {
    background:var(--surface); border:1px solid var(--stroke); border-radius:var(--r); padding:16px;
    box-shadow:0 10px 26px rgba(150,110,200,0.10); margin-bottom:12px;
  }
  b, .card b { color:var(--text); }

  .btn {
    display:block; width:100%; border:none; cursor:pointer; font-family:inherit;
    font-weight:800; font-size:15.5px; padding:16px 12px; border-radius:16px; margin-top:10px;
    transition:transform 0.12s ease, filter 0.2s ease; color:#fff;
  }
  .btn:active { transform:scale(0.97); }
  .btn.primary { background:var(--grad-hot); box-shadow:var(--glow); }
  .btn.soft { background:rgba(185,140,255,0.12); color:#7A54C8; border:1px solid rgba(185,140,255,0.30); }
  .btn.gold { background:var(--grad-gold); color:#5a3a00; box-shadow:0 6px 18px rgba(255,184,77,0.40); }
  .btn.ghost { background:transparent; color:var(--text-dim); border:1px solid var(--stroke); }
  .btn:disabled { opacity:0.45; cursor:default; transform:none; }
  .btn:focus-visible { outline:3px solid var(--magenta); outline-offset:2px; }
  .note { font-size:10.5px; color:var(--text-mute); text-align:center; margin:12px 4px 0; line-height:1.7; }

  /* ===== トップ / スプラッシュ ===== */
  .hero-top { text-align:center; padding:8px 4px 0; }
  .logo-badge { width:120px; height:120px; margin:6px auto 10px; border-radius:34px;
    background:var(--grad-hot); display:flex; align-items:center; justify-content:center; font-size:60px;
    box-shadow:0 14px 34px rgba(255,143,196,0.42); }
  .app-title { font-size:24px; font-weight:900; letter-spacing:0.02em;
    background:var(--grad-hot); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .app-tagline { font-size:12.5px; color:var(--text-dim); margin-top:6px; }
  .feat-list { list-style:none; padding:0; margin:14px 0 0; text-align:left; }
  .feat-list li { display:flex; gap:10px; align-items:flex-start; font-size:13px; padding:7px 0; color:var(--text); }
  .feat-list li span.e { font-size:18px; flex-shrink:0; }

  /* ===== 診断メニュー（#4: 明るめ背景・「あなたは〇〇！」・メイン画像 約2倍） ===== */
  .menu-hero { position:relative; text-align:center; padding:16px 12px 18px; margin-bottom:14px; border-radius:var(--r);
    background:linear-gradient(160deg, #FFEAF4, #EEE7FF 70%, #E6F3FF);
    border:1px solid var(--stroke); box-shadow:0 10px 26px rgba(150,110,200,0.12); overflow:hidden; }
  .menu-hero .catch { font-size:13px; font-weight:900; color:var(--magenta); letter-spacing:0.04em; }
  .menu-hero .catch b { color:var(--pink); font-size:20px; -webkit-text-fill-color:initial; }
  .menu-hero .hero-img { margin:8px auto 4px; }
  .menu-hero .deco { position:absolute; opacity:0.9; }
  .menu-title-row { font-size:13px; font-weight:800; color:var(--text-dim); margin:2px 2px 10px; }

  .menu-item {
    position:relative; display:flex; align-items:center; gap:12px; width:100%;
    background:var(--surface); border:1px solid var(--stroke); border-radius:var(--r);
    padding:15px 14px; margin-bottom:11px;
    box-shadow:0 8px 20px rgba(150,110,200,0.08); cursor:pointer; text-align:left;
    font-family:inherit; color:var(--text); overflow:hidden;
    transition:transform 0.14s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .menu-item::after { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--grad-hot); opacity:0.9; }
  .menu-item:active { transform:scale(0.985); border-color:var(--stroke-hot); box-shadow:0 0 22px rgba(255,143,196,0.22); }
  .menu-item .mi-icon {
    font-size:26px; width:52px; height:52px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%, rgba(255,143,196,0.28), rgba(185,140,255,0.14));
    border:1px solid var(--stroke); border-radius:16px;
  }
  .menu-item .mi-title { font-weight:800; font-size:15px; color:var(--text); }
  .menu-item .mi-sub { font-size:11.5px; color:var(--text-dim); }
  .menu-item .chev { margin-left:auto; font-size:18px; color:var(--text-mute); }
  .tag { font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:7px; margin-left:6px; vertical-align:2px;
    background:rgba(87,211,190,0.18); color:#1FA791; border:1px solid rgba(87,211,190,0.4); }
  .premium-strip {
    position:relative; display:block; width:100%; border:none; border-radius:16px; padding:14px 16px;
    background:var(--grad-gold); color:#5a3a00; cursor:pointer; overflow:hidden;
    font-family:inherit; font-weight:800; font-size:13px; margin-bottom:14px; text-align:left;
    box-shadow:0 8px 20px rgba(255,184,77,0.35);
  }

  .guide li { font-size:13px; padding:2px 0; color:var(--text); }
  .photo-input { display:none; }

  /* フォーム（ユーザー情報） */
  .field { margin:12px 0; }
  .field > label { display:block; font-size:12.5px; font-weight:800; color:var(--text-dim); margin-bottom:8px; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg button { flex:1 1 auto; min-width:60px; padding:11px 8px; border-radius:13px; font-family:inherit; font-weight:800; font-size:13px;
    background:var(--surface-2); border:1.5px solid var(--stroke); color:var(--text-dim); cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--grad-hot); color:#fff; border-color:transparent; box-shadow:var(--glow); }
  select.input { width:100%; padding:13px; border-radius:13px; border:1.5px solid var(--stroke); background:var(--surface-2);
    font-family:inherit; font-size:14px; color:var(--text); }

  .center-fill { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; }
  .loading-emoji { position:relative; font-size:52px; width:118px; height:118px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:radial-gradient(circle, rgba(255,143,196,0.24), transparent 70%); }
  .loading-emoji::before { content:""; position:absolute; inset:-6px; border-radius:50%;
    border:3px solid transparent; border-top-color:var(--pink); border-right-color:var(--magenta);
    animation:spin 1s linear infinite; }
  .loading-emoji::after { content:""; position:absolute; inset:8px; border-radius:50%;
    border:2px dashed rgba(185,140,255,0.5); animation:spin 3.2s linear infinite reverse; }
  @keyframes spin { to{transform:rotate(360deg);} }
  @keyframes pulse { 0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.06); opacity:0.9;} }

  .ring-holder { position:relative; width:150px; height:150px; margin:8px auto; }
  .ring { transform:rotate(-90deg); filter:drop-shadow(0 4px 8px rgba(255,143,196,0.4)); }
  .ring .track { stroke:rgba(185,140,255,0.16); }
  .ring .bar { stroke:url(#ringGrad); stroke-linecap:round; transition:stroke-dashoffset 1.0s cubic-bezier(.2,.7,.3,1); }
  .ring-label { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-label .pct { font-size:34px; font-weight:900; font-variant-numeric:tabular-nums;
    background:var(--grad-hot); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .ring-label .cap { font-size:10.5px; color:var(--text-dim); font-weight:700; }
  .chips { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0; }
  .chip { font-size:11px; font-weight:800; padding:4px 12px; border-radius:10px;
    background:rgba(185,140,255,0.14); color:#7A54C8; border:1px solid rgba(185,140,255,0.30); }
  .hero-visual { filter:drop-shadow(0 8px 18px rgba(255,143,196,0.32)); animation:pulse 3s ease-in-out infinite; }

  .share-card { position:relative; border-radius:var(--r); padding:20px 14px; text-align:center; color:var(--text); overflow:hidden;
    background:linear-gradient(155deg,#FFF0F7,#F2ECFF 70%,#E9F4FF); border:1.5px solid var(--stroke-hot);
    box-shadow:0 12px 30px rgba(185,140,255,0.22); margin-top:12px; }
  .share-card .sc-app { font-size:10.5px; font-weight:800; letter-spacing:0.06em; color:var(--magenta); }
  .share-card .sc-visual { margin:6px 0; }
  .share-card .sc-name { font-size:22px; font-weight:900; color:var(--pink); }
  .share-card .sc-pct { font-size:32px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--magenta); }
  .share-card .sc-text { font-size:11.5px; color:var(--text-dim); margin-top:4px; }
  .share-card .sc-tags { font-size:10px; color:var(--text-mute); margin-top:8px; }

  .share-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .share-grid button { display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 4px; border-radius:15px;
    background:var(--surface); border:1px solid var(--stroke); color:var(--text-dim); font-family:inherit; font-weight:800; font-size:10.5px; cursor:pointer; }
  .share-grid button .si { width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; }
  .si.tiktok { background:#111; } .si.x { background:#111; } .si.insta { background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF); } .si.line { background:#06C755; }

  .fake-ad { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(160deg,#FFF6FB,#F1ECFF); border:1px solid var(--stroke); color:var(--text-dim); text-align:center; padding:24px; border-radius:var(--r); margin:8px 0; }
  .fake-ad .ad-mark { font-size:10px; font-weight:800; letter-spacing:0.2em; color:var(--text-mute); }

  .banner-ad { position:relative; z-index:2; flex-shrink:0; min-height:52px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.8); backdrop-filter:blur(10px); border-top:1px solid var(--stroke);
    color:var(--text-mute); font-size:11px; font-weight:700; letter-spacing:0.04em; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); }

  .error-emoji { font-size:54px; }
  .status { font-size:11.5px; color:var(--text-dim); }

  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 2px; border-bottom:1px solid var(--stroke); }
  .row:last-child { border-bottom:none; }
  .row .k { font-size:13.5px; font-weight:700; color:var(--text); }
  .row .v { font-size:12.5px; color:var(--text-dim); }
  .link-row { display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none; font-family:inherit;
    padding:14px 2px; border-bottom:1px solid var(--stroke); cursor:pointer; color:var(--text); font-size:14px; font-weight:700; text-align:left; }
  .link-row:last-child { border-bottom:none; }
  .link-row .chev { color:var(--text-mute); }

  .legal-body { font-size:12.5px; color:var(--text-dim); line-height:1.9; }
  .legal-body h3 { font-size:14px; color:var(--text); margin:18px 0 6px; }
  .placeholder-note { font-size:11px; background:rgba(255,184,77,0.14); border:1px solid rgba(255,184,77,0.4); color:#8a5a00;
    border-radius:12px; padding:10px 12px; margin-bottom:12px; }

  @media (prefers-reduced-motion:reduce) {
    .bgfx::before,.bgfx::after,.loading-emoji::before,.loading-emoji::after,.hero-visual { animation:none !important; }
    .screen-enter { animation:none !important; }
    .ring .bar { transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="bgfx" aria-hidden="true"></div>
  <div class="appbar">
    <div class="brand" id="brandName">🎀 顔タイプ診断（仮）<small>ブラウザ内AIで診断 — 写真は端末外に出ません</small></div>
    <div class="bar-actions">
      <span class="plan" id="planBadge">無料プラン</span>
      <button class="icon-btn" id="settingsBtn" aria-label="設定" data-go="settings">⚙️</button>
    </div>
  </div>
  <div class="body" id="body"></div>
  <div class="banner-ad" id="bannerAd">AD — バナー広告（無料プランのみ・モック / 本番はAdMob）</div>
</div>

<script type="module">
/* ================================================================
   顔タイプ診断 Web版 v2（デモ）
   - 顔解析: MediaPipe FaceLandmarker（ブラウザ内 WASM・写真は端末外に送信しない）
   - スコアリング: 決定論（乱数不使用／同じ写真 → 同じ結果）§4-1
   - 課金/広告/シェアは Web デモ用モック（§0-2）
   ================================================================ */

/* TODO(appname): 正式名称が未確定（§12）。ここを変えると全画面に反映。 */
const APP_NAME = "顔タイプ診断（仮）";
const APP_EMOJI = "🎀";
const APP_URL = location.href.split(/[?#]/)[0]; // シェア用アプリURL
const CONTACT_EMAIL = "support@example.com"; // TODO(contact): 正式問い合わせ先に差し替え

/* ================================================================
   画像アセット（§8）: 今回は画像を実装しない。
   すべてのスロットは単一の placeholder.svg を参照し、data-image-slot で一意識別。
   後日、REAL_IMAGES[slotId] にパスを入れるだけで一括差し替え可能。
   ================================================================ */
const PLACEHOLDER = "assets/images/placeholder.svg";
/* 差し替え用マップ（現在は空＝全てプレースホルダー）。
   例: REAL_IMAGES["animal-tanuki"] = "assets/images/animals/tanuki.png"; */
const REAL_IMAGES = {};
/* スロット定義: slotId → { desc(日本語説明), path(想定パス) }。TODO(image) コメントと後日差し替えの索引。 */
const IMAGE_SLOTS = {
  "main-face-20":   { desc:"結果/トップ メイン顔画像(20番)", path:"main-face-20.png" },
  "animal-tanuki":  { desc:"動物診断-たぬき顔", path:"animals/tanuki.png" },
  "animal-kitsune": { desc:"動物診断-きつね顔", path:"animals/kitsune.png" },
  "animal-inu":     { desc:"動物診断-犬顔",     path:"animals/inu.png" },
  "animal-neko":    { desc:"動物診断-猫顔",     path:"animals/neko.png" },
  "animal-usagi":   { desc:"動物診断-うさぎ顔", path:"animals/usagi.png" },
  "animal-risu":    { desc:"動物診断-リス顔",   path:"animals/risu.png" },
  "animal-shika":   { desc:"動物診断-鹿顔",     path:"animals/shika.png" },
  "animal-ookami":  { desc:"動物診断-狼顔",     path:"animals/ookami.png" },
  "animal-hamster": { desc:"動物診断-ハムスター顔", path:"animals/hamster.png" },
  "animal-lion":    { desc:"動物診断-ライオン顔",   path:"animals/lion.png" },
  "deco-1": { desc:"結果/メニュー装飾1", path:"decorations/deco-1.png" },
  "deco-2": { desc:"結果/メニュー装飾2", path:"decorations/deco-2.png" },
};
// 5段階(1..5)を持つ診断のスロットを自動登録（source/soy/mental/psycho/s/m/youthful）
for (const [base, label, dir] of [
  ["source","ソース顔度","source-soy"], ["soy","醤油顔度","source-soy"],
  ["mental","メンヘラ度","mental"], ["psycho","サイコパス度","psycho"],
  ["s","S度","sm"], ["m","M度","sm"], ["youthful","童顔度","youthful"],
]) for (let n=1; n<=5; n++) IMAGE_SLOTS[`${base}-${n}`] = { desc:`${label}-段階${n}`, path:`${dir}/${base}-${n}.png` };

const srcOf = slotId => REAL_IMAGES[slotId] ?? PLACEHOLDER;
/* 画像スロットHTML（§8-2 準拠: TODO(image) コメント + data-image-slot 付き img） */
function slotImg(slotId, alt, size) {
  const meta = IMAGE_SLOTS[slotId] ?? { desc:slotId, path:slotId+".png" };
  const r = Math.max(8, Math.round(size*0.16));
  return `<!-- TODO(image): ${meta.desc} / ${meta.path} -->` +
    `<img src="${srcOf(slotId)}" alt="${esc(alt)}" data-image-slot="${slotId}" loading="lazy" ` +
    `style="width:${size}px;height:${size}px;object-fit:contain;display:inline-block;vertical-align:middle;border-radius:${r}px">`;
}
const bandIndex = pct => pct>=80?5 : pct>=60?4 : pct>=40?3 : pct>=20?2 : 1; // 5段階→1..5
// 結果に対応する画像スロットID
function resultSlot(r) {
  if (r.animal) return `animal-${r.animal.id}`;
  const bi = bandIndex(r.percent);
  if (r.kind === "dual") {
    if (r.item.id === "shoyu_sauce") return `${r.isHigh?"source":"soy"}-${bi}`;
    if (r.item.id === "sm")          return `${r.isHigh?"s":"m"}-${bi}`;
  }
  const base = { babyface:"youthful", menhera:"mental", psychopath:"psycho" }[r.item.id];
  return base ? `${base}-${bi}` : "main-face-20";
}

/* ---- ソフト正規化（logistic）: 平均的な顔が ~0.5 ---- */
const SOFT_NORM = {
  faceAspectRatio:[1.30,0.13], eyeSize:[0.052,0.014], eyeSlant:[0.03,0.06], eyeSpacing:[1.00,0.16],
  browEyeGap:[0.075,0.028], browSlant:[0.00,0.12], noseHeight:[0.15,0.12], noseWidth:[0.25,0.035],
  faceDepth:[0.60,0.35], faceWidth:[0.68,0.10], jawSharpness:[0.30,0.09], cheekFullness:[0.86,0.09],
  mouthSize:[0.42,0.05], verticalBalance:[1.00,0.16], featureProminence:[0.80,0.10],
};
const softNorm = (v,key) => { const [c,s]=SOFT_NORM[key]; return 1/(1+Math.exp(-(v-c)/s)); };

/* ---- スコアリング（決定論・乱数なし §4-1） ---- */
function similarity(f, profile) {
  let ws=0, tw=0;
  for (const k of FEATURE_KEYS) {
    const dev = Math.abs(profile[k]-0.5);
    const w = (FEATURE_WEIGHTS[k]??1)*(0.15+dev);
    const d = f[k]-profile[k];
    ws += w*d*d; tw += w;
  }
  return 1 - Math.min(Math.max(Math.sqrt(ws/tw),0),1);
}
function matchAnimal(f) {
  let best=null;
  for (const a of ANIMALS) { const sim=similarity(f,a.profile); if (best && sim<=best.sim) continue; best={animal:a,sim}; }
  const t = Math.min(Math.max((best.sim-MATCH.simLow)/(MATCH.simHigh-MATCH.simLow),0),1);
  const pct = Math.round(MATCH.percentMin + t*(MATCH.percentMax-MATCH.percentMin));
  return { animal:best.animal, percent:Math.min(Math.max(pct,MATCH.percentMin),MATCH.percentMax) };
}
/* §4-2: 中央を基準に振れ幅を拡大（50〜65%集中を 0〜100% にスプレッド） */
const PCT_GAIN = 2.6;
function percentageScore(f, spec) {
  let s = spec.bias;
  for (const [k,w] of Object.entries(spec.weights)) s += w*(f[k]??0);
  s = 0.5 + (s-0.5)*PCT_GAIN;
  return Math.min(Math.max(Math.round(s*100), spec.percentMin), spec.percentMax);
}
const bandText = (pct,bands) => [...bands].sort((a,b)=>b.min-a.min).find(b=>pct>=b.min)?.text ?? "";
function diagnose(item, f) {
  if (item.kind === "animalMatch") {
    const m = matchAnimal(f);
    return { item, kind:"animalMatch", percent:m.percent, animal:m.animal, text:ANIMAL_TEXTS[m.animal.id] };
  }
  const pct = percentageScore(f, item.scoring);
  if (item.kind === "dual") {
    // 表裏の割合（例: ソース顔度 / 醤油顔度）。両側とも5段階の文言を表示（§3-2・§5・§10）。
    // 両者は補完関係（high + low = 100）で、先方文言もそれ前提に整合している。
    const highPct=pct, lowPct=100-pct, isHigh=highPct>=lowPct;
    const high = { label:item.dual.high.label, pct:highPct, text:bandText(highPct, item.highBands) };
    const low  = { label:item.dual.low.label,  pct:lowPct,  text:bandText(lowPct,  item.lowBands) };
    const dom = isHigh?high:low;
    // percent/text は優勢側（リング・シェア用）。high/low に両側の%と文言を保持。
    return { item, kind:"dual", percent:dom.pct, text:dom.text, highPct, lowPct, isHigh, high, low, animal:null };
  }
  return { item, kind:"percentage", percent:pct, animal:null, text:bandText(pct,item.bands) };
}

/* ---- 顔解析: MediaPipe FaceLandmarker（写真は端末外に送信しない §1-2/§9-1） ---- */
let landmarkerPromise = null;
async function getLandmarker() {
  if (!landmarkerPromise) {
    landmarkerPromise = (async () => {
      const { FaceLandmarker, FilesetResolver } =
        await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      return FaceLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
        runningMode:"IMAGE", numFaces:4,
      });
    })().catch(err => { landmarkerPromise=null; throw err; });
  }
  return landmarkerPromise;
}
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
let lastDebug = null;
function extractFeatures(pts) {
  const p = i => pts[i];
  const faceW = dist(p(234),p(454)), faceH = dist(p(10),p(152));
  if (faceW<4 || faceH<4) return null;
  const eyeW_L=dist(p(33),p(133)), eyeH_L=dist(p(159),p(145));
  const eyeW_R=dist(p(263),p(362)), eyeH_R=dist(p(386),p(374));
  const eyeWAvg=Math.max((eyeW_L+eyeW_R)/2,1), eyeHAvg=(eyeH_L+eyeH_R)/2;
  const eyeSizeRaw=eyeHAvg/faceW;
  const eyeSlantRaw=((p(133).y-p(33).y)/Math.max(eyeW_L,1)+(p(362).y-p(263).y)/Math.max(eyeW_R,1))/2;
  const eyeSpacingRaw=dist(p(133),p(362))/eyeWAvg;
  const browEyeGapRaw=((p(159).y-p(105).y)+(p(386).y-p(334).y))/2/faceH;
  const bwL=Math.max(dist(p(70),p(107)),1), bwR=Math.max(dist(p(300),p(336)),1);
  const browSlantRaw=((p(107).y-p(70).y)/bwL+(p(336).y-p(300).y)/bwR)/2;
  const interoc=Math.max(dist(p(133),p(362)),1);
  const zPlane=(p(234).z+p(454).z+p(133).z+p(362).z)/4;
  const noseHeightRaw=(zPlane-p(4).z)/interoc;
  const noseWidthRaw=dist(p(48),p(278))/faceW;
  const zs=[p(4).z,p(234).z,p(454).z,p(152).z,p(10).z,p(168).z];
  const faceDepthRaw=(Math.max(...zs)-Math.min(...zs))/interoc;
  const lowerW=dist(p(132),p(361));
  const faceWidthRaw=lowerW/faceH, cheekFullnessRaw=lowerW/faceW;
  const chin=p(152), jl=p(172), jr=p(397);
  const v1={x:jl.x-chin.x,y:jl.y-chin.y}, v2={x:jr.x-chin.x,y:jr.y-chin.y};
  const l1=Math.hypot(v1.x,v1.y), l2=Math.hypot(v2.x,v2.y);
  let jawSharpnessRaw=0;
  if (l1>0.5 && l2>0.5) { const cos=Math.min(Math.max((v1.x*v2.x+v1.y*v2.y)/(l1*l2),-1),1); jawSharpnessRaw=1-Math.acos(cos)/Math.PI; }
  const mouthW=dist(p(61),p(291)), mouthSizeRaw=mouthW/faceW;
  const browY=(p(105).y+p(334).y)/2;
  const midThird=Math.max(p(2).y-browY,1), lowerThird=Math.max(p(152).y-p(2).y,1);
  const verticalBalanceRaw=lowerThird/midThird;
  const prominenceRaw=(eyeWAvg+dist(p(48),p(278))+mouthW)/faceW;
  const raw={ faceAspectRatio:faceH/faceW, eyeSize:eyeSizeRaw, eyeSlant:eyeSlantRaw, eyeSpacing:eyeSpacingRaw,
    browEyeGap:browEyeGapRaw, browSlant:browSlantRaw, noseHeight:noseHeightRaw, noseWidth:noseWidthRaw,
    faceDepth:faceDepthRaw, faceWidth:faceWidthRaw, jawSharpness:jawSharpnessRaw, cheekFullness:cheekFullnessRaw,
    mouthSize:mouthSizeRaw, verticalBalance:verticalBalanceRaw, featureProminence:prominenceRaw };
  const feat={}; for (const k of FEATURE_KEYS) feat[k]=softNorm(raw[k],k);
  lastDebug={raw,feat};
  return feat;
}
async function analyzeImage(img) {
  const landmarker = await getLandmarker();
  const maxSide=1024, scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*scale), h=Math.round(img.naturalHeight*scale);
  const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
  canvas.getContext("2d").drawImage(img,0,0,w,h);
  const res=landmarker.detect(canvas);
  const faces=res?.faceLandmarks ?? [];
  if (!faces.length) return null;
  let best=null; // 最も大きく写る顔（§4-4）
  for (const lm of faces) {
    let minX=1,maxX=0,minY=1,maxY=0;
    for (const q of lm) { if(q.x<minX)minX=q.x; if(q.x>maxX)maxX=q.x; if(q.y<minY)minY=q.y; if(q.y>maxY)maxY=q.y; }
    const area=(maxX-minX)*(maxY-minY);
    if (!best || area>best.area) best={lm,area};
  }
  const pts=best.lm.map(q=>({x:q.x*w,y:q.y*h,z:q.z*w}));
  return extractFeatures(pts);
}

/* ---- ?debug: 特徴量ダンプ（校正用） ---- */
const DEBUG = /[?&]debug/.test(location.search);
function appendDebug() {
  if (!DEBUG || !lastDebug || !state.features) return;
  const sims = ANIMALS.map(a=>({id:a.id,s:similarity(state.features,a.profile)})).sort((x,y)=>y.s-x.s);
  const rows = FEATURE_KEYS.map(k=>`${k.padEnd(17)} raw=${Number(lastDebug.raw[k]).toFixed(3).padStart(8)}  norm=${lastDebug.feat[k].toFixed(2)}`).join("\n");
  const top = sims.slice(0,5).map(s=>`${s.id} ${(s.s*100).toFixed(1)}`).join("  ");
  body.insertAdjacentHTML("beforeend",
    `<pre style="font-size:10px;line-height:1.45;background:#f0eaf6;color:#3b3048;padding:12px;border-radius:12px;overflow-x:auto;margin-top:12px">[DEBUG]\n${esc(rows)}\n\nsim上位(%): ${esc(top)}</pre>`);
}
const REDUCE_MOTION = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
function animateCount(el, to, suffix="") {
  if (REDUCE_MOTION) { el.textContent=to+suffix; return; }
  const dur=900, t0=performance.now();
  const tick=now=>{ const p=Math.min((now-t0)/dur,1); const eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(eased*to)+suffix; if(p<1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function go(name, arg) {
  try { screens[name](arg); }
  catch (err) { console.error("screen error", name, err);
    body.innerHTML = `<div class="center-fill"><div class="error-emoji">😵</div><b>画面の表示に失敗しました</b>
      <button class="btn primary" data-go="home">メニューに戻る</button></div>`; }
  body.classList.remove("screen-enter"); void body.offsetWidth; body.classList.add("screen-enter");
  body.scrollTop=0; window.scrollTo(0,0);
  if (name==="result") appendDebug();
}

/* ---- 写真選択 → 実解析（#1: 選択後は即診断フロー） ---- */
async function onPhotoPicked(e) {
  const file = e.target.files?.[0];
  e.target.value = "";
  if (!file) return; // キャンセル時は capture 画面のまま（重複UIを出さない）
  go("loading");
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((ok,ng)=>{ img.onload=ok; img.onerror=ng; img.src=url; });
    const status=document.getElementById("loadStatus"); if(status) status.textContent="お顔の特徴を読み取っています…";
    const started=performance.now();
    const features = await analyzeImage(img);
    await new Promise(ok=>setTimeout(ok, Math.max(0, 900-(performance.now()-started))));
    if (!features) { go("faceError","お顔をうまく見つけられませんでした🙇 正面を向いて、明るい場所の写真でもう一度試してみてください！"); return; }
    state.features = features;
    state.result = diagnose(state.item, features);
    analytics.diagnose();
    go(!state.premium ? "adgate" : "result"); // 無料は結果前に広告
  } catch (err) {
    console.error(err);
    go("faceError","解析エンジンの読み込みに失敗しました。通信環境をご確認のうえ、もう一度お試しください。");
  } finally {
    URL.revokeObjectURL(url); // 画像参照を即破棄（保存しない §9-1）
  }
}

/* ---- シェア（§9-4: TikTok / X / Instagram / LINE） ---- */
function hashtagsFor(r) {
  const extra = r.animal ? " #"+r.animal.nameJa : ("dual"===r.kind ? " #"+resultName(r) : "");
  return BASE_HASHTAGS + extra;
}
function shareText(r) {
  const label = r.kind==="animalMatch" ? `「${r.animal.nameJa}」（マッチ率${r.percent}%）`
    : r.kind==="dual" ? `「${resultName(r)}」${r.percent}%`
    : `「${titleOf(r.item)}」${r.percent}%`;
  return `私は${label}でした！\n${hashtagsFor(r)}`;
}
async function copyCaption(r, appName) {
  const text = `${shareText(r)}\n${APP_URL}`;
  try { await navigator.clipboard.writeText(text);
    alert(`シェア文をコピーしました📋\n${appName}を開いたら貼り付けて投稿してね！`); }
  catch(_) { alert("シェア文のコピーに失敗しました。手動でコピーしてください。"); }
}
function shareTo(target) {
  const r = state.result; if (!r) return;
  const text = shareText(r);
  const url = APP_URL;
  const enc = encodeURIComponent;
  try {
    if (target==="x") { window.open(`https://twitter.com/intent/tweet?text=${enc(text+"\n")}&url=${enc(url)}`, "_blank","noopener"); return; }
    if (target==="line") { window.open(`https://social-plugins.line.me/lineit/share?url=${enc(url)}&text=${enc(text)}`, "_blank","noopener"); return; }
    // TikTok / Instagram はWeb共有インテント非対応 → 文言コピー＋アプリ/サイト起動
    if (target==="instagram") { copyCaption(r,"Instagram").then(()=>window.open("https://www.instagram.com/","_blank","noopener")); return; }
    if (target==="tiktok") { copyCaption(r,"TikTok").then(()=>window.open("https://www.tiktok.com/","_blank","noopener")); return; }
  } catch(_) { copyCaption(r, target); }
}
async function shareGeneric() {
  const r = state.result; if (!r) return;
  const text = `${shareText(r)}\n${APP_URL}`;
  try {
    if (navigator.share) { await navigator.share({ text, url:APP_URL }); return; }
    await navigator.clipboard.writeText(text);
    alert("シェア文をコピーしました！SNSに貼り付けてください📋");
  } catch(_) {}
}

/* ---- イベント委譲 ---- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-item],[data-act],[data-gender],[data-share]");
  if (!t) return;
  if (t.dataset.gender !== undefined) {
    state.gender = t.dataset.gender;
    document.querySelectorAll("#segGender button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.gender===state.gender)));
    return;
  }
  if (t.dataset.share) { shareTo(t.dataset.share); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.item !== undefined) { state.item = ITEMS[Number(t.dataset.item)]; go("capture"); return; }
  switch (t.dataset.act) {
    case "start": go(store.get(LS.seenIntro)==="1" ? "home" : "userinfo"); break;
    case "saveinfo":
      store.set(LS.gender, state.gender); store.set(LS.age, document.getElementById("ageSel")?.value || "");
      state.age = document.getElementById("ageSel")?.value || "";
      store.set(LS.seenIntro,"1"); go("home"); break;
    case "skipinfo": store.set(LS.seenIntro,"1"); go("home"); break;
    case "pick": document.getElementById("photoInput").click(); break;
    case "again": go("capture"); break;
    case "retry": go("capture"); break;
    case "watch-ad": analytics.ad(); go("interstitial"); break;
    case "close-ad": go("result"); break;
    case "paywall-menu": state.paywallCtx="menu"; go("paywall"); break;
    case "paywall-adskip": state.paywallCtx="adSkip"; go("paywall"); break;
    case "paywall-settings": state.paywallCtx="settings"; go("paywall"); break;
    case "purchase": purchase(); break;
    case "restore": restore(); break;
    case "contact": window.location.href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(APP_NAME+" お問い合わせ")}`; break;
    case "share": shareGeneric(); break;
  }
});

syncChrome();
go("splash");
getLandmarker().catch(()=>{}); // 解析エンジンを先読み（失敗しても診断時に再試行）
