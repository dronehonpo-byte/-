{% extends "base.html" %}
{% block title %}契約の編集{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>契約を編集</h1>
    <p class="muted">下書き状態の契約のみ編集できます。</p>
  </div>
  <a href="{{ url_for('contracts.detail', contract_id=contract.id) }}" class="btn-ghost">戻る</a>
</section>

<form method="post" class="form contract-form">
  <div class="grid2">
    <label class="span2">タイトル
      <input type="text" name="title" required value="{{ contract.title }}" />
    </label>
    <label>有効期限 (任意)
      <input type="date" name="expires_at" value="{{ contract.expires_at.strftime('%Y-%m-%d') if contract.expires_at else '' }}" />
    </label>
    <label class="span2">説明 (任意)
      <input type="text" name="description" value="{{ contract.description or '' }}" />
    </label>
    <label class="span2">本文
      <textarea name="body" rows="20" required>{{ contract.body or '' }}</textarea>
    </label>
  </div>

  {% with signers=contract.signers %}
    {% include "contracts/_form_signers.html" %}
  {% endwith %}

  <div class="form-actions">
    <a href="{{ url_for('contracts.detail', contract_id=contract.id) }}" class="btn-ghost">キャンセル</a>
    <button type="submit" class="btn-primary">更新する</button>
  </div>
</form>
{% endblock %}
