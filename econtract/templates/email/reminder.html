<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>署名リマインド</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;color:#0f172a;">
  <div style="max-width:600px;margin:0 auto;padding:24px;">
    <div style="background:#b45309;color:#fff;padding:18px 24px;border-radius:8px 8px 0 0;font-size:18px;font-weight:700;">
      署名のリマインド
    </div>
    <div style="background:#fff;padding:24px;border-radius:0 0 8px 8px;border:1px solid #e2e8f0;border-top:none;line-height:1.7;">
      <p>{{ signer.name }} 様</p>
      <p>契約書「<strong>{{ contract.title }}</strong>」の電子署名がまだお済みでないようです。</p>
      <p style="text-align:center;margin:24px 0;">
        <a href="{{ sign_url }}" style="display:inline-block;background:#1f3a8a;color:#fff;text-decoration:none;padding:12px 24px;border-radius:6px;font-weight:600;">
          署名画面を開く
        </a>
      </p>
      <p style="font-size:12px;color:#64748b;word-break:break-all;">{{ sign_url }}</p>
    </div>
  </div>
</body>
</html>
