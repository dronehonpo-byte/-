  featureProminence:[0.14, 0.05],

const softNorm = (v, key) => {
  const [c, s] = SOFT_NORM[key];
  return 1 / (1 + Math.exp(-(v - c) / s));
};

/* ---- スコアリング（決定論・乱数なし） ---- */
// 重み付きユークリッド類似度。各動物の「特徴的な次元(0.5から離れた特徴)」を重視するため
// プロファイルの中立(0.5)からのズレ dev で重みを増幅 → その動物らしさへの適合度を測る。
function similarity(f, profile) {
  let ws = 0, tw = 0;
  for (const k of FEATURE_KEYS) {
    const dev = Math.abs(profile[k] - 0.5);
    const w = (FEATURE_WEIGHTS[k] ?? 1) * (0.15 + dev);
    const d = f[k] - profile[k];
    ws += w * d * d; tw += w;
  }
  return 1 - Math.min(Math.max(Math.sqrt(ws / tw), 0), 1);
}
function matchAnimal(f) {
  let best = null;
  for (const a of ANIMALS) {
    const sim = similarity(f, a.profile);
    if (best && sim <= best.sim) continue;
    best = { animal: a, sim };
  }
  // 類似度の実効帯(simLow..simHigh)をマッチ率レンジへ引き伸ばす
  const t = Math.min(Math.max((best.sim - MATCH.simLow) / (MATCH.simHigh - MATCH.simLow), 0), 1);
  const pct = Math.round(MATCH.percentMin + t * (MATCH.percentMax - MATCH.percentMin));
  return { animal: best.animal, percent: Math.min(Math.max(pct, MATCH.percentMin), MATCH.percentMax) };
}
function percentageScore(f, spec) {
  let s = spec.bias;
  for (const [k, w] of Object.entries(spec.weights)) s += w * (f[k] ?? 0);
  return Math.min(Math.max(Math.round(s * 100), spec.percentMin), spec.percentMax);
}
function bandText(pct, bands) {
  return [...bands].sort((a, b) => b.min - a.min).find(b => pct >= b.min)?.text ?? "";
}
function diagnose(item, f) {
  if (item.kind === "animalMatch") {
    const m = matchAnimal(f);
    return { item, percent: m.percent, animal: m.animal, text: ANIMAL_TEXTS[m.animal.id] };
  }
  const pct = percentageScore(f, item.scoring);
  return { item, percent: pct, animal: null, text: bandText(pct, item.bands) };
}

/* ---- 顔解析: MediaPipe FaceLandmarker（VisionFaceAnalysisProvider.swift 相当） ---- */
let landmarkerPromise = null;
async function getLandmarker() {
  if (!landmarkerPromise) {
    landmarkerPromise = (async () => {
      const { FaceLandmarker, FilesetResolver } =
        await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      return FaceLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        },
        runningMode: "IMAGE",
        numFaces: 4, // 複数人が写る場合は最大の顔を対象にする
      });
    })().catch(err => { landmarkerPromise = null; throw err; });
  }
  return landmarkerPromise;
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/** ランドマーク(468点・{x,y,z}ピクセル座標) → 15特徴量。
 *  すべて顔サイズに対する比率＝撮影距離に不変、乱数なしの決定論。
 *  z座標(奥行き)を使い「鼻の高さ」「顔の立体感」を実測する。 */
function extractFeatures(pts) {
  const p = i => pts[i];
  const faceW = dist(p(234), p(454));           // 頬骨あたりの顔幅
  const faceH = dist(p(10), p(152));            // 額上端〜顎先
  if (faceW < 4 || faceH < 4) return null;
  const faceArea = faceW * faceH;

  // ---- 目（画像左目: 33外/133内/159上/145下、画像右目: 263外/362内/386上/374下）----
  const eyeW_L = dist(p(33), p(133)), eyeH_L = dist(p(159), p(145));
  const eyeW_R = dist(p(263), p(362)), eyeH_R = dist(p(386), p(374));
  const eyeWAvg = Math.max((eyeW_L + eyeW_R) / 2, 1);
  const eyeSizeRaw = ((eyeW_L * eyeH_L) + (eyeW_R * eyeH_R)) / 2 / faceArea;
  // 目尻の傾き（y下向き正 → 外側が上＝つり目で正）
  const eyeSlantRaw = ((p(133).y - p(33).y) / Math.max(eyeW_L, 1)
                     + (p(362).y - p(263).y) / Math.max(eyeW_R, 1)) / 2;
  // 目の間隔（内眼角間の距離 / 目の幅）: 高い=離れ目、低い=寄り目（パーツ配置）
  const eyeSpacingRaw = dist(p(133), p(362)) / eyeWAvg;

  // ---- 眉（左眉: 70外/107内、右眉: 300外/336内、中央 105/334）----
  // 眉と目の間隔（眉は目の上＝y小さい → 正）
  const browEyeGapRaw = ((p(159).y - p(105).y) + (p(386).y - p(334).y)) / 2 / faceH;
  const bwL = Math.max(dist(p(70), p(107)), 1), bwR = Math.max(dist(p(300), p(336)), 1);
  const browSlantRaw = ((p(107).y - p(70).y) / bwL + (p(336).y - p(300).y) / bwR) / 2;

  // ---- 鼻・立体感（z: 手前ほど小さい）----
  const zPlane = (p(234).z + p(454).z + p(133).z + p(362).z) / 4; // 頬・目の奥行き基準面
  const noseHeightRaw = (zPlane - p(4).z) / faceW;                // 鼻先の突出＝鼻の高さ
  const noseWidthRaw = dist(p(48), p(278)) / faceW;              // 小鼻の幅
  const zs = [p(4).z, p(234).z, p(454).z, p(152).z, p(10).z, p(168).z];
  const faceDepthRaw = (Math.max(...zs) - Math.min(...zs)) / faceW; // 奥行きレンジ＝立体感

  // ---- 輪郭 ----
  const lowerW = dist(p(132), p(361));          // エラ付近の幅
  const faceWidthRaw = lowerW / faceH;
  const cheekFullnessRaw = lowerW / faceW;
  // 顎の鋭さ: 顎先(152)から両サイド(172/397)への角度 θ → 1 - θ/π
  const chin = p(152), jl = p(172), jr = p(397);
  const v1 = { x: jl.x - chin.x, y: jl.y - chin.y }, v2 = { x: jr.x - chin.x, y: jr.y - chin.y };
  const l1 = Math.hypot(v1.x, v1.y), l2 = Math.hypot(v2.x, v2.y);
  let jawSharpnessRaw = 0;
  if (l1 > 0.5 && l2 > 0.5) {
    const cos = Math.min(Math.max((v1.x * v2.x + v1.y * v2.y) / (l1 * l2), -1), 1);
    jawSharpnessRaw = 1 - Math.acos(cos) / Math.PI;
  }

  // ---- 口 ----
  const mouthW = dist(p(61), p(291));
  const mouthH = dist(p(0), p(17));
  const mouthSizeRaw = mouthW / faceW;

  // ---- 三庭（縦配置）: 眉ライン→鼻底(2)→顎先(152) の下庭/中庭比。高い=下重心（大人/面長）----
  const browY = (p(105).y + p(334).y) / 2;
  const midThird = Math.max(p(2).y - browY, 1);
  const lowerThird = Math.max(p(152).y - p(2).y, 1);
  const verticalBalanceRaw = lowerThird / midThird;

  // ---- パーツの存在感（目+口+鼻の面積 / 顔面積）----
  const noseArea = noseWidthRaw * faceW * Math.max(p(2).y - p(6).y, 1);
  const prominenceRaw = (eyeW_L * eyeH_L + eyeW_R * eyeH_R + mouthW * mouthH + noseArea) / faceArea;

  return {
    faceAspectRatio: softNorm(faceH / faceW, "faceAspectRatio"),
    eyeSize:         softNorm(eyeSizeRaw, "eyeSize"),
    eyeSlant:        softNorm(eyeSlantRaw, "eyeSlant"),
    eyeSpacing:      softNorm(eyeSpacingRaw, "eyeSpacing"),
    browEyeGap:      softNorm(browEyeGapRaw, "browEyeGap"),
    browSlant:       softNorm(browSlantRaw, "browSlant"),
    noseHeight:      softNorm(noseHeightRaw, "noseHeight"),
    noseWidth:       softNorm(noseWidthRaw, "noseWidth"),
    faceDepth:       softNorm(faceDepthRaw, "faceDepth"),
    faceWidth:       softNorm(faceWidthRaw, "faceWidth"),
    jawSharpness:    softNorm(jawSharpnessRaw, "jawSharpness"),
    cheekFullness:   softNorm(cheekFullnessRaw, "cheekFullness"),
    mouthSize:       softNorm(mouthSizeRaw, "mouthSize"),
    verticalBalance: softNorm(verticalBalanceRaw, "verticalBalance"),
    featureProminence: softNorm(prominenceRaw, "featureProminence"),
  };
}

/** 画像 → 特徴量。顔なしは null。写真はメモリ上でのみ処理し、どこにも送信・保存しない */
async function analyzeImage(img) {
  const landmarker = await getLandmarker();
  // 大きすぎる画像は縮小して解析（比率ベースの特徴量なので結果は不変）
  const maxSide = 1024;
  const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);

  const res = landmarker.detect(canvas);
  const faces = res?.faceLandmarks ?? [];
  if (!faces.length) return null;

  // 複数人が写る場合は最も大きく写っている顔を対象（iOS実装と同じ方針）
  let best = null;
  for (const lm of faces) {
    let minX = 1, maxX = 0, minY = 1, maxY = 0;
    for (const q of lm) {
      if (q.x < minX) minX = q.x; if (q.x > maxX) maxX = q.x;
      if (q.y < minY) minY = q.y; if (q.y > maxY) maxY = q.y;
    }
    const area = (maxX - minX) * (maxY - minY);
    if (!best || area > best.area) best = { lm, area };
  }
  // z は x と同スケールの相対奥行き → 幅で正規化して立体感/鼻の高さに使う
  const pts = best.lm.map(q => ({ x: q.x * w, y: q.y * h, z: q.z * w }));
  return extractFeatures(pts);
}

function go(name, arg) { screens[name](arg); body.scrollTop = 0; window.scrollTo(0, 0); }

/* 写真選択 → 実解析 */
async function onPhotoPicked(e) {
  const file = e.target.files?.[0];
  e.target.value = "";
  if (!file) return;
  go("loading");
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((ok, ng) => { img.onload = ok; img.onerror = ng; img.src = url; });
    const status = document.getElementById("loadStatus");
    if (status) status.textContent = "お顔の特徴を読み取っています…";
    const started = performance.now();
    const features = await analyzeImage(img);
    // 演出用の最低表示時間
    const waitMs = Math.max(0, 900 - (performance.now() - started));
    await new Promise(ok => setTimeout(ok, waitMs));
    if (!features) {
      go("faceError", "お顔をうまく見つけられませんでした🙇 正面を向いて、明るい場所の写真でもう一度試してみてください！");
      return;
    }
    state.features = features;
    state.result = diagnose(state.item, features);
    const secondOrLater = state.count + 1 >= 2;
    state.count++;
    go(!state.premium && secondOrLater ? "adgate" : "result");
  } catch (err) {
    console.error(err);
    go("faceError", "解析エンジンの読み込みに失敗しました。通信環境をご確認のうえ、もう一度お試しください。");
  } finally {
    URL.revokeObjectURL(url); // 画像参照を即時破棄（保存しない）
  }
}

  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    alert("シェア文をコピーしました！SNSに貼り付けてください📋");
  } catch (_) { /* ユーザーキャンセル等は無視 */ }
}

/* イベント委譲 */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-item],[data-act]");
  if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.item !== undefined) {
    const it = ITEMS[Number(t.dataset.item)];
    if (it.isPremium && !state.premium) { state.pendingItem = it; state.paywallCtx = "lockedItem"; go("paywall"); }
    else { state.item = it; go("capture"); }
    return;
  }
  switch (t.dataset.act) {
    case "camera": document.getElementById("cameraInput").click(); break;
    case "album": document.getElementById("albumInput").click(); break;
    case "retry": go("capture"); break;
    case "watch-ad": go("interstitial"); break;
    case "close-ad": go("result"); break;
    case "paywall-menu": state.paywallCtx = "menu"; go("paywall"); break;
    case "paywall-adskip": state.paywallCtx = "adSkip"; go("paywall"); break;
    case "purchase":
      state.premium = true; syncChrome();
      if (state.paywallCtx === "lockedItem" && state.pendingItem) { state.item = state.pendingItem; state.pendingItem = null; go("capture"); }
      else if (state.paywallCtx === "adSkip") go("result");
      else go("home");
      break;
    case "share": shareResult(); break;
  }
});

syncChrome();
go("home");
/* バックグラウンドで解析エンジンを先読み（失敗しても診断時に再試行） */
getLandmarker().catch(() => {});
</script>
