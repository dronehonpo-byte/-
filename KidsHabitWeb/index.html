<title>きっずしゅうかん（ウェブばん）</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{
    --bg:#FFF7E6; --blue:#59A6F2; --yellow:#FFD24D; --pink:#FA8CB3;
    --green:#66CC80; --accent:#FF7350; --ink:#4A3F35; --card:#FFFFFF;
  }
  :root[data-theme="dark"]{ --bg:#FFF7E6; --ink:#4A3F35; --card:#FFFFFF; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic UI",system-ui,sans-serif;
    font-weight:700; touch-action:none;
  }
  .screen{ position:fixed; inset:0; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- スプラッシュ ---------- */
  #splash{ align-items:center; justify-content:center; background:linear-gradient(160deg,#FFF3C9,#FFE9F1); }
  #splash .chara{ font-size:96px; animation:bounce .6s ease-in-out infinite alternate; }
  #splash h1{ font-size:clamp(32px,6vw,56px); color:var(--blue); margin:16px 0 0;
    animation:pop .6s cubic-bezier(.2,1.6,.4,1) both; letter-spacing:.06em; }
  @keyframes bounce{ from{transform:translateY(0)} to{transform:translateY(-22px)} }
  @keyframes pop{ from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1} }

  /* ---------- 共通ヘッダー ---------- */
  header{ display:flex; align-items:center; gap:12px; padding:12px 18px; flex:0 0 auto; }
  header .title{ flex:1; text-align:center; font-size:clamp(20px,3.4vw,30px); color:var(--blue); }
  .rbtn{
    width:56px; height:56px; border:none; border-radius:50%; font-size:26px; cursor:pointer;
    background:var(--card); box-shadow:0 3px 8px rgba(0,0,0,.15); flex:0 0 auto;
  }
  .rbtn.home{ background:var(--blue); color:#fff; }
  .rbtn:active{ transform:scale(.92); }
  .spacer56{ width:56px; flex:0 0 auto; }

  /* ---------- グリッド ---------- */
  .grid{ flex:1; overflow-y:auto; display:grid; gap:16px; padding:8px 22px 24px;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); align-content:start; }
  .card{ background:var(--card); border-radius:24px; padding:12px; cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.10); text-align:center; border:none; font:inherit; color:inherit; }
  .card:active{ transform:scale(.96); }
  .card .thumb{ position:relative; height:100px; border-radius:18px; display:flex;
    align-items:center; justify-content:center; font-size:52px; color:#fff; }
  .card .thumb .crown{ position:absolute; top:6px; right:6px; width:34px; height:34px;
    background:#fff; border-radius:50%; font-size:18px; display:flex; align-items:center;
    justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,.2); }
  .card .thumb .check{ position:absolute; top:6px; right:6px; font-size:30px; }
  .card .name{ margin-top:8px; font-size:20px; }
  .card .soon{ font-size:12px; color:#9a8f83; }
  .card.disabled{ opacity:.55; }

  /* ---------- ゲーム ---------- */
  #game{ background:var(--bg); }
  #gameCanvas{ position:absolute; inset:0; width:100%; height:100%; }
  #game .rbtn.home{ position:absolute; top:14px; left:14px; z-index:5; }
  #guide{ position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:4;
    background:rgba(255,255,255,.92); color:var(--accent); font-size:clamp(16px,2.6vw,24px);
    padding:10px 22px; border-radius:999px; box-shadow:0 3px 8px rgba(0,0,0,.12);
    transition:opacity .5s; white-space:nowrap; pointer-events:none; }

  /* ---------- クリア演出 ---------- */
  #sceneClear{ position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.12); z-index:20; }
  #sceneClear .badge{ background:#fff; border-radius:32px; padding:26px 52px; font-size:44px;
    color:var(--accent); box-shadow:0 8px 24px rgba(0,0,0,.2);
    animation:pop .45s cubic-bezier(.2,1.7,.4,1) both; }
  #catClear{ align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(135deg,#FFF0BF,#FFE0EC,#DCEBFF); background-size:300% 300%;
    animation:sky 4s ease-in-out infinite alternate; }
  @keyframes sky{ from{background-position:0% 0%} to{background-position:100% 100%} }
  #catClear .chara{ font-size:84px; animation:wiggle .5s ease-in-out infinite alternate; }
  @keyframes wiggle{ from{transform:rotate(-7deg)} to{transform:rotate(7deg)} }
  #catClear h2{ font-size:clamp(28px,5vw,46px); color:var(--accent); margin:14px 24px; }
  .btnrow{ display:flex; gap:16px; margin-top:10px; }
  .bigbtn{ border:none; border-radius:999px; padding:16px 34px; font:inherit; font-size:24px;
    color:#fff; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.18); }
  .bigbtn.green{ background:var(--green); } .bigbtn.blue{ background:var(--blue); }
  .bigbtn.yellow{ background:var(--yellow); color:var(--ink); }
  .bigbtn:active{ transform:scale(.95); }

  /* ---------- シート（設定・サブスク） ---------- */
  .sheet-bg{ position:fixed; inset:0; background:rgba(0,0,0,.35); display:none;
    align-items:center; justify-content:center; z-index:30; }
  .sheet{ background:var(--card); border-radius:28px; padding:30px 36px; max-width:440px;
    width:88%; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .sheet h2{ margin:4px 0 12px; font-size:26px; }
  .sheet p{ font-size:16px; line-height:1.7; color:#7a6f63; margin:0 0 16px; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between;
    font-size:20px; padding:10px 4px; }
  .toggle{ width:64px; height:36px; border-radius:999px; border:none; cursor:pointer;
    background:#d8d0c5; position:relative; transition:background .2s; }
  .toggle.on{ background:var(--green); }
  .toggle::after{ content:""; position:absolute; top:4px; left:4px; width:28px; height:28px;
    border-radius:50%; background:#fff; transition:left .2s; }
  .toggle.on::after{ left:32px; }
  .gate input{ font:inherit; font-size:24px; width:90px; text-align:center; padding:8px;
    border:3px solid var(--blue); border-radius:14px; margin:8px 0 14px; }
  .linkbtn{ background:none; border:none; font:inherit; color:#9a8f83; font-size:15px;
    cursor:pointer; text-decoration:underline; margin-top:10px; }

  /* ---------- 縦向き警告 ---------- */
  #rotate{ position:fixed; inset:0; z-index:50; background:var(--bg); display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:12px;
    font-size:20px; text-align:center; padding:24px; }
  #rotate .icon{ font-size:64px; animation:rot 1.4s ease-in-out infinite; }
  @keyframes rot{ 0%,20%{transform:rotate(0)} 60%,100%{transform:rotate(90deg)} }
  @media (orientation:portrait) and (max-width:600px){ #rotate{ display:flex; } }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.01s !important; } }
</style>

<div id="rotate"><div class="icon">📱</div>よこむきにして あそんでね！</div>

<!-- スプラッシュ -->
<div class="screen active" id="splash">
  <div class="chara">😊</div>
  <h1>きっずしゅうかん</h1>
</div>

<!-- ホーム -->
<div class="screen" id="home">
  <header>
    <button class="rbtn" id="settingsBtn" aria-label="せってい">⚙️</button>
    <div class="title">きょうもがんばろう！</div>
    <div class="spacer56"></div>
  </header>
  <div class="grid" id="homeGrid"></div>
</div>

<!-- カテゴリTOP -->
<div class="screen" id="catTop">
  <header>
    <button class="rbtn home" aria-label="ホームへ" onclick="goHome()">🏠</button>
    <div class="title" id="catTitle"></div>
    <div class="spacer56"></div>
  </header>
  <div class="grid" id="sceneGrid"></div>
</div>

<!-- ゲーム -->
<div class="screen" id="game">
  <canvas id="gameCanvas"></canvas>
  <button class="rbtn home" aria-label="ホームへ" onclick="goHome()">🏠</button>
  <div id="guide"></div>
</div>

<!-- 1場面クリア -->
<div id="sceneClear"><div class="badge">できた！</div></div>

<!-- カテゴリ完了 -->
<div class="screen" id="catClear">
  <div class="chara">😊</div>
  <h2 id="catClearText"></h2>
  <div class="btnrow">
    <button class="bigbtn green" onclick="replayCategory()">🔄 もういちど</button>
    <button class="bigbtn blue" onclick="goHome()">🏠 ホームへ</button>
  </div>
</div>

<!-- 設定 -->
<div class="sheet-bg" id="settingsSheet">
  <div class="sheet">
    <h2>せってい</h2>
    <div class="toggle-row">🎵 おんがく <button class="toggle" id="bgmToggle" aria-label="おんがく"></button></div>
    <div class="toggle-row">🔔 こうかおん <button class="toggle on" id="seToggle" aria-label="こうかおん"></button></div>
    <button class="bigbtn blue" style="margin-top:14px" onclick="hideSheet('settingsSheet')">とじる</button>
  </div>
</div>

<!-- サブスク -->
<div class="sheet-bg" id="subSheet">
  <div class="sheet">
    <div style="font-size:44px">👑</div>
    <h2>もっとあそぼう！</h2>
    <p>サブスクリプションにはいると<br>しょくじ・きがえ・てあらい・じゅんびが<br>あそべるようになるよ！</p>
    <div id="subBody">
      <button class="bigbtn yellow" onclick="showGate()">はじめる（¥200/つき）</button>
      <div class="gate" id="gate" style="display:none; margin-top:16px">
        <p style="margin-bottom:4px"><b>おとなのかたへ</b><br>こうにゅうにはかくにんがひつようです</p>
        <div style="font-size:24px" id="gateQ"></div>
        <input id="gateA" type="number" inputmode="numeric" aria-label="こたえ">
        <div><button class="bigbtn green" onclick="checkGate()">かくにん</button></div>
      </div>
    </div>
    <button class="linkbtn" onclick="hideSheet('subSheet')">とじる</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   きっずしゅうかん ウェブプレビュー版
   iOS版（SwiftUI + SpriteKit）の内容確認用に同一仕様を再現。
   進捗はセッション中のみ・課金はモック（ペアレンタルゲート付き）。
   ============================================================ */

// ---------- データ定義（Swift版 Category.swift と対応） ----------
const CATEGORIES = [
  { id:"tooth",  name:"はみがき", icon:"🦷", color:"#59A6F2", premium:false, playable:true,
    complete:"ぴかぴか！えらい！",
    scenes:[
      {title:"したのはの かみあわせ", type:"brush"},
      {title:"したのはの おもて",     type:"brush"},
      {title:"うえのはの かみあわせ", type:"brush"},
      {title:"うえのはの おもて",     type:"brush"},
      {title:"うがい",                type:"gargle"},
    ]},
  { id:"cleanup", name:"かたづけ", icon:"🧸", color:"#66CC80", premium:false, playable:true,
    complete:"おへやぴかぴか！",
    scenes:[
      {title:"りびんぐ",     type:"cleanup"},
      {title:"べっどまわり", type:"cleanup"},
      {title:"つくえのうえ", type:"cleanup"},
      {title:"げんかん",     type:"shoes"},
    ]},
  { id:"meal", name:"しょくじ", icon:"🍽️", color:"#FF7350", premium:true, playable:true,
    complete:"きらいなものがなくてえらい！すごいね！！",
    scenes:[
      {title:"せっと1", type:"meal"},{title:"せっと2", type:"meal"},
      {title:"せっと3", type:"meal"},{title:"せっと4", type:"meal"},
    ]},
  { id:"dress", name:"きがえ", icon:"👕", color:"#FA8CB3", premium:true, playable:true,
    complete:"じぶんできれたね！かっこいい！",
    scenes:[
      {title:"ふだんぎ",   type:"dress"},{title:"すーつふう", type:"dress"},
      {title:"あめのひ",   type:"dress"},{title:"なつふく",   type:"dress"},
    ]},
  { id:"wash", name:"てあらい", icon:"🫧", color:"#4FC3D9", premium:true, playable:false, scenes:[] },
  { id:"prep", name:"じゅんび", icon:"🎒", color:"#F5A24B", premium:true, playable:false, scenes:[] },
];

const MEAL_SETS = [
  [["ブロッコリー","#66CC80"],["ニンジン","#F5A24B"],["ハンバーグ","#9A6B4F"],["コーン","#FFD24D"]],
  [["パンケーキ","#D9A05B"],["キウイ","#8CC152"],["バナナ","#FFD24D"],["イチゴ","#F0576B"]],
  [["トマト","#F0576B"],["サケ","#FA9C8C"],["レタス","#8CC152"],["さつまいも","#9B6FB5"]],
  [["レンコン","#EFE6D8"],["コロッケ","#C98A4B"],["からあげ","#B5722F"],["たまご","#FFE08A"]],
];
const OUTFITS = [
  [["ぼうし","#F0576B"],["しゃつ","#59A6F2"],["ずぼん","#66CC80"],["くつ","#F5A24B"]],
  [["はっと","#555"],["じゃけっと","#8A8A8A"],["すらっくす","#666"],["かわぐつ","#9A6B4F"]],
  [["れいんはっと","#FFD24D"],["かっぱ","#4FC3D9"],["れいんずぼん","#7FD8E8"],["ながぐつ","#FFD24D"]],
  [["むぎわらぼうし","#E8C96A"],["てぃーしゃつ","#FDFDFD"],["はんずぼん","#59A6F2"],["さんだる","#FA8CB3"]],
];

// ---------- 状態 ----------
const state = {
  premium:false,
  progress:{},           // { catId: Set(sceneIndex) }  ※セッション中のみ
  cat:null, sceneIdx:0,
};

// ---------- オーディオ（WebAudio SE + 音声読み上げ） ----------
const audio = {
  ctx:null, seOn:true, bgmOn:false, bgmTimer:null,
  ac(){ if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); return this.ctx; },
  tone(freq, dur=.12, type="sine", vol=.15, when=0){
    if(!this.seOn) return;
    try{
      const c=this.ac(), o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
      const t=c.currentTime+when;
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  },
  se(name){
    const m={ tap:[[660,.08]], drag:[[440,.08]], snap:[[880,.06],[1320,.1,.06]],
      swipe:[[240,.05,"square",.05]], gargle:[[180,.1,"sawtooth",.08]],
      eat:[[520,.08],[390,.1,.09]],
      clear:[[1047,.15],[1319,.15,.12],[1568,.3,.24]],
      fanfare:[[523,.18],[659,.18,.15],[784,.18,.3],[1047,.5,.45]] };
    (m[name]||[]).forEach(a=>this.tone(a[0],a[1],typeof a[2]==="string"?a[2]:"sine",
      typeof a[3]==="number"?a[3]:(typeof a[2]==="number"?.15:.15), typeof a[2]==="number"?a[2]:(a[2] && typeof a[3]!=="number"?0:(typeof a[2]==="string"?(a[3]??0,0):0))));
  },
  speak(text){
    if(!this.seOn || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP"; u.rate=.9; u.pitch=1.4;
    speechSynthesis.speak(u);
  },
  bgm(on){
    this.bgmOn=on;
    clearInterval(this.bgmTimer); this.bgmTimer=null;
    if(on){
      const notes=[523,659,784,659,587,784,659,523];
      let i=0;
      this.bgmTimer=setInterval(()=>{ this.tone(notes[i++%notes.length],.25,"triangle",.04); },320);
    }
  },
};
// SE マップの重複バグ回避のため単純化して上書き
audio.se = function(name){
  const seq = {
    tap:[[660,.08,0]], drag:[[440,.08,0]],
    snap:[[880,.06,0],[1320,.1,.06]],
    swipe:[[240,.05,0]], gargle:[[180,.1,0]],
    eat:[[520,.08,0],[390,.1,.09]],
    clear:[[1047,.15,0],[1319,.15,.12],[1568,.3,.24]],
    fanfare:[[523,.18,0],[659,.18,.15],[784,.18,.3],[1047,.5,.45]],
  }[name]||[];
  const type = (name==="swipe")?"square":(name==="gargle")?"sawtooth":"sine";
  const vol  = (name==="swipe"||name==="gargle")?.06:.15;
  seq.forEach(([f,d,w])=>audio.tone(f,d,type,vol,w));
};

// ---------- 画面遷移 ----------
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function goHome(){ stopGame(); renderHome(); show("home"); audio.se("tap"); }
function showSheet(id){ document.getElementById(id).style.display="flex"; }
function hideSheet(id){ document.getElementById(id).style.display="none"; }

// ---------- ホーム ----------
function renderHome(){
  const grid=document.getElementById("homeGrid"); grid.innerHTML="";
  for(const cat of CATEGORIES){
    const locked = cat.premium && !state.premium;
    const btn=document.createElement("button");
    btn.className="card"+(cat.playable?"":" disabled");
    btn.innerHTML=`
      <div class="thumb" style="background:${cat.color}">${cat.icon}
        ${cat.premium?`<div class="crown">${locked?"👑":"✨"}</div>`:""}
      </div>
      <div class="name">${cat.name}</div>
      ${cat.playable?"":'<div class="soon">じゅんびちゅう</div>'}`;
    btn.onclick=()=>{
      audio.se("tap");
      if(!cat.playable) return;
      if(locked){ openSub(); return; }
      openCategory(cat);
    };
    grid.appendChild(btn);
  }
}

// ---------- カテゴリTOP ----------
function openCategory(cat){
  state.cat=cat;
  document.getElementById("catTitle").textContent=`${cat.icon} ${cat.name}`;
  const grid=document.getElementById("sceneGrid"); grid.innerHTML="";
  const done=state.progress[cat.id]||new Set();
  cat.scenes.forEach((sc,i)=>{
    const btn=document.createElement("button");
    btn.className="card";
    btn.innerHTML=`
      <div class="thumb" style="background:${cat.color}99">🖼️
        ${done.has(i)?'<div class="check">✅</div>':""}
      </div>
      <div class="name" style="font-size:17px">${sc.title}</div>`;
    btn.onclick=()=>{ audio.se("tap"); startGame(cat,i); };
    grid.appendChild(btn);
  });
  show("catTop");
}
function replayCategory(){
  audio.se("tap");
  state.progress[state.cat.id]=new Set();
  openCategory(state.cat);
}

// ---------- サブスク（モック） ----------
let gateAns=0;
function openSub(){
  document.getElementById("gate").style.display="none";
  showSheet("subSheet");
}
function showGate(){
  audio.se("tap");
  const a=3+Math.floor(Math.random()*7), b=2+Math.floor(Math.random()*7);
  gateAns=a+b;
  document.getElementById("gateQ").textContent=`${a} + ${b} = ?`;
  document.getElementById("gateA").value="";
  document.getElementById("gate").style.display="block";
}
function checkGate(){
  if(parseInt(document.getElementById("gateA").value,10)===gateAns){
    state.premium=true;
    audio.se("fanfare");
    audio.speak("サブスクリプションにはいったよ！");
    hideSheet("subSheet"); renderHome();
  }else{
    document.getElementById("gateA").value="";
  }
}

// ---------- 設定 ----------
document.getElementById("settingsBtn").onclick=()=>{ audio.se("tap"); showSheet("settingsSheet"); };
document.getElementById("seToggle").onclick=function(){
  audio.seOn=!audio.seOn; this.classList.toggle("on",audio.seOn); audio.se("tap");
};
document.getElementById("bgmToggle").onclick=function(){
  audio.bgm(!audio.bgmOn); this.classList.toggle("on",audio.bgmOn);
};

/* ============================================================
   ゲームエンジン（Canvas / Pointer Events）
   ============================================================ */
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
let W=0,H=0,game=null,raf=0,particles=[];

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=canvas.clientWidth; H=canvas.clientHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",()=>{ if(game){ resize(); game.layout(); } });

function guide(text,speakIt=true){
  const g=document.getElementById("guide");
  g.textContent=text; g.style.opacity=1;
  clearTimeout(g._t); g._t=setTimeout(()=>g.style.opacity=0,3500);
  if(speakIt) audio.speak(text);
}
function sparkle(x,y,n=14){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=60+Math.random()*160;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,
      r:4+Math.random()*7,color:["#FFD24D","#FA8CB3","#59A6F2","#fff"][i%4]});
  }
}
function drawStar(x,y,r,color,alpha){
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.translate(x,y); ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang=i*Math.PI/5-Math.PI/2, rad=i%2===0?r:r*.45;
    ctx[i===0?"moveTo":"lineTo"](Math.cos(ang)*rad,Math.sin(ang)*rad);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

// 共通：クリア処理 → 演出 → 進捗更新
function sceneCleared(message){
  if(game.cleared) return;
  game.cleared=true;
  audio.se("clear");
  if(message) audio.speak(message);
  sparkle(W/2,H/2,30);
  setTimeout(()=>{
    document.getElementById("sceneClear").style.display="flex";
    setTimeout(()=>{
      document.getElementById("sceneClear").style.display="none";
      const set=state.progress[state.cat.id]??=new Set();
      set.add(state.sceneIdx);
      stopGame();
      if(set.size>=state.cat.scenes.length){
        document.getElementById("catClearText").textContent=state.cat.complete;
        audio.se("fanfare"); audio.speak(state.cat.complete);
        show("catClear");
      }else{
        openCategory(state.cat);
      }
    },1500);
  },600);
}

function startGame(cat,idx){
  state.cat=cat; state.sceneIdx=idx;
  show("game"); resize();
  particles=[];
  const type=cat.scenes[idx].type;
  game=new ({brush:BrushGame,gargle:GargleGame,cleanup:CleanupGame,
             shoes:ShoesGame,meal:MealGame,dress:DressGame}[type])(idx);
  game.layout(); game.start();
  let last=performance.now();
  cancelAnimationFrame(raf);
  const loop=t=>{
    const dt=Math.min((t-last)/1000,.05); last=t;
    ctx.clearRect(0,0,W,H);
    game.draw(dt);
    // パーティクル
    particles=particles.filter(p=>p.life>0);
    for(const p of particles){
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=40*dt; p.life-=dt*1.1;
      drawStar(p.x,p.y,p.r,p.color,Math.max(p.life,0));
    }
    raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop);
}
function stopGame(){ cancelAnimationFrame(raf); game=null; }

// ポインタ入力（タッチ・マウス両対応）
let pointerDown=false;
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId); pointerDown=true;
  game && game.down && game.down(e.offsetX,e.offsetY);
});
canvas.addEventListener("pointermove",e=>{
  if(game && game.move) game.move(e.offsetX,e.offsetY,pointerDown);
});
canvas.addEventListener("pointerup",e=>{
  pointerDown=false;
  game && game.up && game.up(e.offsetX,e.offsetY);
});

/* ---------- はみがき（なぞって80%で汚れ落とし） ---------- */
class BrushGame{
  constructor(idx){ this.idx=idx; this.cleared=false; this.lastSE=0; }
  layout(){
    this.teethY = H/2 + (this.idx<2? 40 : -40); // したのは=下段
    this.dirt=[];
    for(let i=0;i<30;i++){
      this.dirt.push({ x:W/2+(Math.random()*2-1)*W*.27, y:this.teethY+(Math.random()*2-1)*40,
        r:9+Math.random()*8, on:true });
    }
    this.total=30;
    this.brush={x:W*.8,y:H*.75};
  }
  start(){ guide("はを みがいてみよう！"); }
  move(x,y,down){
    if(!down||this.cleared) return;
    this.brush={x,y};
    const now=performance.now();
    if(now-this.lastSE>250){ audio.se("swipe"); this.lastSE=now; }
    let removed=0;
    for(const d of this.dirt){
      if(d.on && Math.hypot(d.x-x,d.y-y)<60){ d.on=false; sparkle(d.x,d.y,3); }
      if(!d.on) removed++;
    }
    if(removed/this.total>=.8){
      this.dirt.forEach(d=>d.on=false);
      sceneCleared("ぴかぴかに なったね！");
    }
  }
  draw(){
    // 口
    ctx.fillStyle="#F29999"; rr(W*.12,H*.22,W*.76,H*.56,60); ctx.fill();
    // 歯
    for(let i=0;i<6;i++){
      ctx.fillStyle="#F5F2EC"; ctx.strokeStyle="#D8D2C8"; ctx.lineWidth=2;
      rr(W/2+(i-3)*82+8,this.teethY-46,68,92,18); ctx.fill(); ctx.stroke();
    }
    // 汚れ
    ctx.fillStyle="rgba(190,178,102,.9)";
    for(const d of this.dirt) if(d.on){ ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7); ctx.fill(); }
    // 歯ブラシ
    ctx.save(); ctx.translate(this.brush.x,this.brush.y); ctx.rotate(Math.PI/6);
    ctx.fillStyle="#59A6F2"; rr(-14,-20,28,110,10); ctx.fill();
    ctx.fillStyle="#fff"; rr(-17,-56,34,40,8); ctx.fill();
    ctx.restore();
  }
}

/* ---------- うがい（コップを口へ→往復なぞり） ---------- */
class GargleGame{
  constructor(){ this.cleared=false; this.atMouth=false; this.strokes=0;
    this.lastX=0; this.dir=0; this.dragging=false; }
  layout(){
    this.face={x:W/2,y:H*.42};
    this.cup={x:W*.8,y:H*.75,w:88,h:106};
  }
  start(){ guide("うがいを してみよう！ コップを くちへ"); }
  down(x,y){
    if(!this.atMouth && Math.hypot(this.cup.x-x,this.cup.y-y)<110){
      this.dragging=true; audio.se("drag");
    }
    this.lastX=x;
  }
  move(x,y,down){
    if(this.cleared||!down) return;
    if(!this.atMouth){
      if(!this.dragging) return;
      this.cup.x=x; this.cup.y=y;
      const mouth={x:this.face.x,y:this.face.y+60};
      if(Math.hypot(mouth.x-x,mouth.y-y)<120){
        this.atMouth=true; this.cup.x=mouth.x; this.cup.y=mouth.y+30;
        audio.se("snap");
        guide("よこに なぞって がらがら！");
      }
    }else{
      const dx=x-this.lastX;
      if(Math.abs(dx)>8){
        const d=dx>0?1:-1;
        if(d!==this.dir && this.dir!==0){ this.strokes++; audio.se("gargle"); sparkle(this.face.x,this.face.y+60,4); }
        this.dir=d; this.lastX=x;
      }
      if(this.strokes>=6) sceneCleared("のども すっきり！");
    }
  }
  up(){ this.dragging=false; }
  draw(){
    // 顔
    ctx.fillStyle="#FFDAB3"; ctx.beginPath(); ctx.arc(this.face.x,this.face.y,120,0,7); ctx.fill();
    ctx.fillStyle="#4A3F35";
    for(const dx of [-40,40]){ ctx.beginPath(); ctx.arc(this.face.x+dx,this.face.y-20,9,0,7); ctx.fill(); }
    // 口
    ctx.fillStyle="#D96666"; ctx.beginPath();
    ctx.ellipse(this.face.x,this.face.y+60,36,this.atMouth?26:18,0,0,7); ctx.fill();
    // コップ
    ctx.fillStyle="#66CC80"; rr(this.cup.x-this.cup.w/2,this.cup.y-this.cup.h/2,this.cup.w,this.cup.h,14); ctx.fill();
    ctx.fillStyle="#A8E6F5"; rr(this.cup.x-this.cup.w/2+8,this.cup.y-this.cup.h/2+8,this.cup.w-16,26,8); ctx.fill();
  }
}

/* ---------- 共通D&Dベース ---------- */
class DragBase{
  constructor(){ this.cleared=false; this.items=[]; this.dragging=null; }
  down(x,y){
    if(this.cleared) return;
    let best=null,bd=90;
    for(const it of this.items){
      if(it.done) continue;
      const d=Math.hypot(it.x-x,it.y-y);
      if(d<bd){ bd=d; best=it; }
    }
    if(best){ this.dragging=best; audio.se("drag"); }
  }
  move(x,y,down){
    if(this.dragging && down){ this.dragging.x=x; this.dragging.y=y; this.onDrag && this.onDrag(x,y); }
  }
  up(){
    const it=this.dragging; this.dragging=null;
    if(!it||this.cleared) return;
    if(!this.tryDrop(it)){
      // 優しく戻す
      const sx=it.x, sy=it.y, t0=performance.now();
      const back=()=>{ const t=Math.min((performance.now()-t0)/300,1), e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
        it.x=sx+(it.ox-sx)*e; it.y=sy+(it.oy-sy)*e; if(t<1&&!it.done) requestAnimationFrame(back); };
      requestAnimationFrame(back);
    }
  }
  labelItem(it,fill=true){
    if(fill){ ctx.fillStyle=it.color; }
    ctx.font="bold 15px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  }
}

/* ---------- かたづけ ---------- */
class CleanupGame extends DragBase{
  layout(){
    this.box={x:W*.82,y:H*.62,w:200,h:150};
    const colors=["#F0576B","#59A6F2","#66CC80","#F5A24B","#9B6FB5"];
    const icons=["🧸","📚","🚗","🧩","⚽"];
    this.items=colors.map((c,i)=>{
      const x=W*(0.15+Math.random()*0.4), y=H*(0.25+Math.random()*0.55);
      return {x,y,ox:x,oy:y,color:c,icon:icons[i],done:false,scale:1};
    });
    this.left=this.items.length;
  }
  start(){ guide("おかたづけ してみよう！"); }
  tryDrop(it){
    if(Math.hypot(it.x-this.box.x,it.y-this.box.y)<170){
      it.done=true; it.x=this.box.x+(Math.random()*2-1)*50; it.y=this.box.y-10; it.scale=.6;
      audio.se("snap"); sparkle(it.x,it.y,6);
      if(--this.left<=0) sceneCleared("おへや ぴかぴか！");
      return true;
    }
    return false;
  }
  draw(){
    ctx.fillStyle="#B08050"; rr(this.box.x-this.box.w/2,this.box.y-this.box.h/2,this.box.w,this.box.h,14); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="bold 22px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("はこ",this.box.x,this.box.y+this.box.h/2-22);
    for(const it of this.items){
      const s=44*it.scale;
      ctx.fillStyle=it.color; rr(it.x-s,it.y-s,s*2,s*2,14); ctx.fill();
      ctx.font=`${Math.round(38*it.scale)}px sans-serif`; ctx.fillText(it.icon,it.x,it.y+2);
    }
  }
}

/* ---------- げんかん（靴ペア合わせ） ---------- */
class ShoesGame extends DragBase{
  layout(){
    const colors=[["あか","#F0576B"],["あお","#59A6F2"],["きいろ","#FFD24D"]];
    this.targets=colors.map((c,i)=>({name:c[0],color:c[1],x:W*.58+i*130,y:H*.68}));
    this.items=colors.map((c,i)=>{
      const x=W*.12+i*110, y=H*(0.25+Math.random()*0.25);
      return {x,y,ox:x,oy:y,name:c[0],color:c[1],done:false};
    });
    this.left=3;
  }
  start(){ guide("おなじいろの くつを そろえよう！"); }
  tryDrop(it){
    const t=this.targets.find(t=>t.name===it.name);
    if(t && Math.hypot(it.x-t.x,it.y-t.y)<100){
      it.done=true; it.x=t.x+44; it.y=t.y;
      audio.se("snap"); sparkle(it.x,it.y,6);
      if(--this.left<=0) sceneCleared("くつが そろったね！");
      return true;
    }
    return false;
  }
  drawShoe(x,y,color,alpha=1){
    ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color;
    rr(x-30,y-48,60,96,[26,26,10,10]); ctx.fill(); ctx.restore();
  }
  draw(){
    ctx.fillStyle="#E8DFD2"; rr(W*.5,H*.5,W*.48,H*.44,20); ctx.fill(); // げんかんマット
    for(const t of this.targets) this.drawShoe(t.x,t.y,t.color,.35);
    for(const it of this.items) this.drawShoe(it.x,it.y,it.color);
  }
}

/* ---------- しょくじ ---------- */
class MealGame extends DragBase{
  constructor(idx){ super(); this.set=MEAL_SETS[idx]; this.mouthOpen=0; this.chew=0; }
  layout(){
    this.face={x:W*.27,y:H*.45};
    this.items=this.set.map((f,i)=>{
      const x=W*.5+i*(W*.115), y=H*.76;
      return {x,y,ox:x,oy:y,name:f[0],color:f[1],done:false};
    });
    this.left=4;
  }
  start(){ guide("ごはんを たべさせてあげよう！"); }
  mouth(){ return {x:this.face.x,y:this.face.y+52}; }
  onDrag(x,y){
    const m=this.mouth();
    this.mouthOpen=Math.hypot(m.x-x,m.y-y)<140?1:0;
  }
  tryDrop(it){
    const m=this.mouth();
    if(Math.hypot(it.x-m.x,it.y-m.y)<120){
      it.done=true; audio.se("eat"); this.chew=1; this.mouthOpen=0;
      sparkle(m.x,m.y,6);
      if(--this.left<=0){
        guide("ごちそうさまでした！",false);
        sceneCleared("ぜんぶ たべれて えらい！");
      }
      return true;
    }
    return false;
  }
  draw(dt){
    if(this.chew>0) this.chew=Math.max(0,this.chew-dt*2);
    // キャラ
    const f=this.face;
    ctx.fillStyle="#FFDAB3"; ctx.beginPath(); ctx.arc(f.x,f.y,92,0,7); ctx.fill();
    ctx.fillStyle="#4A3F35";
    for(const dx of [-32,32]){ ctx.beginPath(); ctx.arc(f.x+dx,f.y-18,8,0,7); ctx.fill(); }
    // 口（開閉＋もぐもぐ）
    const chewY=this.chew>0?(Math.sin(this.chew*Math.PI*4)*8+16):0;
    const oh=this.mouthOpen?30:12+chewY*.5;
    ctx.fillStyle="#D96666"; ctx.beginPath();
    ctx.ellipse(f.x,f.y+52,26,oh,0,0,7); ctx.fill();
    // おさら
    ctx.fillStyle="#fff"; ctx.strokeStyle="#D8D2C8"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(W*.67,H*.78,W*.22,46,0,0,7); ctx.fill(); ctx.stroke();
    // 食材
    for(const it of this.items){
      if(it.done) continue;
      ctx.fillStyle=it.color; ctx.beginPath(); ctx.arc(it.x,it.y,40,0,7); ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle=it.color==="#EFE6D8"||it.color==="#FFE08A"||it.color==="#FFD24D"?"#4A3F35":"#fff";
      ctx.font="bold 12px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(it.name,it.x,it.y);
    }
  }
}

/* ---------- きがえ ---------- */
class DressGame extends DragBase{
  constructor(idx){ super(); this.outfit=OUTFITS[idx]; this.pose=0; }
  layout(){
    const cx=W*.26, cy=H*.5;
    this.char={x:cx,y:cy};
    this.slots=[
      {key:0,x:cx,y:cy-H*.30},  // あたま
      {key:1,x:cx,y:cy-H*.05},  // うわはんしん
      {key:2,x:cx,y:cy+H*.16},  // したはんしん
      {key:3,x:cx,y:cy+H*.34},  // あしもと
    ];
    this.items=this.outfit.map((o,i)=>{
      const x=W*(.56+(i%2)*.2), y=H*(.3+Math.floor(i/2)*.38);
      return {x,y,ox:x,oy:y,name:o[0],color:o[1],slot:i,done:false};
    });
    this.left=4;
  }
  start(){ guide("おきがえ してみよう！"); }
  tryDrop(it){
    const s=this.slots[it.slot];
    if(Math.hypot(it.x-s.x,it.y-s.y)<110){
      it.done=true; it.x=s.x; it.y=s.y;
      audio.se("snap"); sparkle(s.x,s.y,6);
      if(--this.left<=0){ this.pose=1; sceneCleared("じぶんで きれたね！かっこいい！"); }
      return true;
    }
    return false;
  }
  draw(dt){
    const c=this.char, scale=this.pose?1.15:1;
    ctx.save(); ctx.translate(c.x,c.y); ctx.scale(scale,scale);
    if(this.pose) ctx.rotate(Math.sin(performance.now()/150)*.06);
    // 体（プレースホルダー）
    ctx.fillStyle="#FFDAB3"; ctx.beginPath(); ctx.arc(0,-H*.22,46,0,7); ctx.fill();
    ctx.fillStyle="#E8E2D8"; rr(-48,-H*.13,96,H*.2,18); ctx.fill();
    ctx.fillStyle="#DDD5C8"; rr(-38,H*.09,76,H*.16,14); ctx.fill();
    ctx.restore();
    // スロットガイド
    for(const s of this.slots){
      const it=this.items[s.key];
      if(!it.done){
        ctx.strokeStyle="rgba(120,110,100,.4)"; ctx.lineWidth=2; ctx.setLineDash([6,6]);
        ctx.beginPath(); ctx.arc(s.x,s.y,24,0,7); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    // アイテム
    for(const it of this.items){
      ctx.fillStyle=it.color; rr(it.x-46,it.y-32,92,64,14); ctx.fill();
      ctx.fillStyle=(it.color==="#FDFDFD"||it.color==="#FFD24D"||it.color==="#E8C96A")?"#4A3F35":"#fff";
      ctx.font="bold 14px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(it.name,it.x,it.y);
    }
  }
}
